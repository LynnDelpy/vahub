name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run `vahub doctor` and check the log with
        `hub.log_level: DEBUG`. Both often say plainly what is wrong.

        Never paste a token, an API key or the contents of a credential file
        into a public issue. Replace them with `REDACTED`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I said "turn on the bedroom light". The agent answered that it had done
        it, but the light stayed off and the audit log shows policy_denied.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. vahub init
        2. vahub module add time
        3. vahub run
        4. ask "what time is it" in the console
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: vahub version
      description: Output of `vahub --version`, or the container image tag.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - pip or uv, running directly
        - container image
        - systemd unit
        - from a git checkout
        - other
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and Python version
      placeholder: Debian 13, Python 3.12.7, x86_64
    validations:
      required: true

  - type: textarea
    id: modules
    attributes:
      label: Modules involved
      description: >
        Which modules are installed and which one is involved. Include the
        relevant manifest with any secrets removed.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The hub log around the failure, and the matching audit entries from
        `/api/audit` if a tool call is involved. Check for credentials before
        you paste.
      render: text

  - type: textarea
    id: policy
    attributes:
      label: Relevant policy section
      description: >
        If the problem is that something was denied or unexpectedly allowed,
        paste the `policy:` block from your vahub.yaml.
      render: yaml

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed every token, key and password from what I pasted.
          required: true
        - label: I searched the existing issues.
          required: true
