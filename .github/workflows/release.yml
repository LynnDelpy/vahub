name: release

on:
  push:
    # GitHub's ref filters are globs, not regular expressions. The exact shape
    # of the version is checked in the first job instead.
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # A tag that disagrees with __about__.py would publish a wheel whose
      # version does not exist in the repository history. Stop before that.
      - name: Check the tag against the package version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaged="$(python3 - <<'PY'
          import pathlib, re

          text = pathlib.Path("src/vahub/__about__.py").read_text(encoding="utf-8")
          match = re.search(r"""__version__\s*=\s*["']([^"']+)""", text)
          print(match.group(1) if match else "")
          PY
          )"
          if [ "$version" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match __about__.py version $packaged" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *a*|*b*|*rc*|*dev*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token stored anywhere that could leak or need rotating.
    environment:
      name: pypi
      url: https://pypi.org/p/vahub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # arm64 matters here: a lot of self-hosted installs are single board
      # machines sitting next to the hardware they talk to.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [build, pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The changelog is the source of truth for what a release contains.
      # Autogenerated commit lists are noise by comparison.
      - name: Extract the changelog section
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - "$VERSION" > release-notes.md <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S | re.M,
          )
          body = section.group(1) if section else ""
          # Link reference definitions live at the end of the changelog and would
          # be swept into the last section. They render as nothing anyway.
          body = "\n".join(
              line for line in body.splitlines() if not re.match(r"^\[[^\]]+\]:\s", line)
          ).strip()
          sys.stdout.write(body or f"Release {version}. See CHANGELOG.md.")
          PY
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "vahub $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            $flags \
            dist/*
