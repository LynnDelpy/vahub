[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vahub"
dynamic = ["version"]
description = "A self-hosted voice assistant hub: an LLM agent with a policy gate in front of every action"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "vahub contributors" }]
keywords = ["voice-assistant", "llm", "mcp", "home-automation", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.7",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
vahub = "vahub.cli.main:main"

[project.urls]
Homepage = "https://github.com/LynnDelpy/vahub"
Documentation = "https://github.com/LynnDelpy/vahub/tree/main/docs"
Issues = "https://github.com/LynnDelpy/vahub/issues"
Modules = "https://github.com/LynnDelpy/vahub-modules"

[tool.hatch.version]
path = "src/vahub/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vahub"]

# Ship the typing marker so downstream code gets our annotations.
[tool.hatch.build.targets.wheel.force-include]
"src/vahub/py.typed" = "vahub/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: spawns real subprocesses or containers",
  "contract: validates a module against the module contract",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.12"
# pydantic generates __init__ signatures and default_factory shapes that plain
# mypy cannot see; its plugin is the supported way to type-check models.
plugins = ["pydantic.mypy"]
packages = ["vahub"]
ignore_missing_imports = true
warn_unused_ignores = true
