<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="referrer" content="no-referrer" />
<title>Assistant</title>
<style nonce="__CSP_NONCE__">
  /*
   * The assistant, plus a signed-in owner's own things: a home dashboard of
   * cards they arrange, and one Settings tab that holds saved places, routines,
   * modules, preferences and appearance. It is not an operator console; module
   * stderr, the tool catalogue and the audit log are for whoever runs the
   * service, who has the CLI. Everything a module or the model produced is
   * inserted as text, never as markup.
   *
   * No external fonts, scripts or images, so it works on a network with no route
   * to the internet and leaks nothing to a third party. The accent colour and
   * light/dark choice are set by the owner and stored on the hub.
   */
  :root {
    color-scheme: light dark;
    /* warm, cozy light palette */
    --bg: #f6f1ea; --surface: #fffdfa; --surface-2: #f0e9df; --raised: #fffefb;
    --fg: #2a2621; --muted: #857b6c; --line: #e7ddd0; --line-soft: #efe7db;
    --theirs: #f0e9df; --mine-fg: #ffffff;
    --warn-bg: #fdf1dc; --warn-line: #d99a2b; --danger: #d1432c; --ok: #2f9e57;
    /* accent (overridden live from the owner's choice) */
    --accent: #ef6a3d; --accent-weak: rgba(239,106,61,.16); --accent-weaker: rgba(239,106,61,.09);
    --accent-fg: #ffffff;
    --radius: 20px; --radius-sm: 13px; --radius-xs: 9px;
    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 20px rgba(60,40,20,.06);
    --shadow-sm: 0 1px 2px rgba(60,40,20,.06);
  }
  /* warm charcoal dark palette, applied by system default or an explicit choice */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f; --surface: #201b16; --surface-2: #2a231d; --raised: #241e18;
      --fg: #efe7dc; --muted: #a99e8d; --line: #322a22; --line-soft: #2a231d;
      --theirs: #2a231d;
      --warn-bg: #2e2413; --warn-line: #b98a2f; --danger: #ef6a5a; --ok: #4bb273;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f; --surface: #201b16; --surface-2: #2a231d; --raised: #241e18;
    --fg: #efe7dc; --muted: #a99e8d; --line: #322a22; --line-soft: #2a231d;
    --theirs: #2a231d;
    --warn-bg: #2e2413; --warn-line: #b98a2f; --danger: #ef6a5a; --ok: #4bb273;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }

  /* ---- top bar ---- */
  header {
    position: sticky; top: 0; z-index: 5;
    padding: .6rem .9rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
    background: linear-gradient(100deg, var(--accent-weak), transparent 55%), var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header .brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; letter-spacing: .01em; }
  header .brand .dot { width: 1.35rem; height: 1.35rem; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-fg); font-size: .9rem; box-shadow: var(--shadow-sm); }
  header .brand h1 { font-size: 1.02rem; margin: 0; font-weight: 700; }
  nav { display: flex; gap: .25rem; background: var(--surface-2); padding: .22rem; border-radius: 999px; }
  nav button {
    font: inherit; font-size: .9rem; padding: .38rem .85rem; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--muted); display: flex; align-items: center; gap: .35rem;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { background: var(--raised); color: var(--fg); box-shadow: var(--shadow-sm); }
  header .spacer { flex: 1; }
  header .who { font-size: .82rem; color: var(--muted); }
  header .state { font-size: .78rem; color: var(--muted); }
  .linkbtn { font: inherit; font-size: .82rem; background: none; border: none; color: var(--accent); cursor: pointer; padding: .2rem .3rem; border-radius: 6px; }
  .linkbtn:hover { background: var(--accent-weaker); }

  main { flex: 1; overflow-y: auto; }
  .panel { display: none; padding: 1.1rem clamp(.8rem, 4vw, 1.4rem) 2.4rem; max-width: 62rem; width: 100%; margin: 0 auto; }
  .panel.active { display: block; }
  #thread.active { display: flex; flex-direction: column; gap: .7rem; max-width: 48rem; }

  h2 { font-size: 1.28rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.1rem; }
  .muted { color: var(--muted); }

  /* ---- chat ---- */
  .msg { padding: .6rem .9rem; border-radius: var(--radius-sm); max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow-sm); }
  .msg.mine { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 5px; }
  .msg.theirs { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .msg.problem { align-self: flex-start; background: transparent; color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
  .msg.thinking { color: var(--muted); font-style: italic; box-shadow: none; background: transparent; border: none; }
  .empty { margin: 3rem auto; text-align: center; color: var(--muted); max-width: 28rem; }
  .empty p { margin: .4rem 0; }
  .empty .examples { font-size: .9rem; }

  .approval { align-self: stretch; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--radius-sm); padding: .85rem .95rem; }
  .approval p { margin: 0 0 .7rem; }
  .approval .what { font-weight: 600; }
  .approval .args { margin: 0 0 .7rem; padding: .5rem .7rem; list-style: none; border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; background: var(--surface); }
  .approval .args li { overflow-wrap: anywhere; }
  .approval .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .approval button { font: inherit; padding: .45rem .95rem; border-radius: var(--radius-xs); border: 1px solid transparent; cursor: pointer; }
  .approval .yes { background: var(--danger); color: #fff; }
  .approval .no { background: transparent; border-color: var(--line); color: var(--fg); }
  .approval .expiry { font-size: .82rem; color: var(--muted); margin-left: auto; align-self: center; }

  footer { border-top: 1px solid var(--line); padding: .7rem .9rem 1rem; background: var(--surface); }
  .composer { display: flex; gap: .5rem; max-width: 48rem; margin: 0 auto; }
  .composer input[type=text] { flex: 1; font: inherit; padding: .7rem .9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
  .composer input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .composer button { font: inherit; padding: .7rem 1rem; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
  .composer .send { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .composer button[disabled] { opacity: .5; cursor: default; }
  .composer .mic.recording { background: var(--danger); color: #fff; border-color: transparent; }
  .hint { max-width: 48rem; margin: .5rem auto 0; font-size: .8rem; color: var(--muted); display: flex; gap: 1rem; }
  .hint label { cursor: pointer; }

  /* ---- generic controls ---- */
  input, textarea, select { font: inherit; padding: .55rem .65rem; border-radius: var(--radius-xs); border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 3rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
  .btn { font: inherit; padding: .55rem .95rem; border-radius: var(--radius-xs); cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; gap: .35rem; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: .3rem .6rem; font-size: .82rem; }
  .btn.danger { color: var(--danger); }
  .row-actions { margin-top: .9rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  .err { color: var(--danger); font-size: .85rem; min-height: 1.1em; }
  .note { font-size: .84rem; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .grid .full { grid-column: 1 / -1; }
  label.field { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; color: var(--muted); font-weight: 600; }
  .items { list-style: none; padding: 0; margin: 0; }
  .items li { display: flex; align-items: center; gap: .6rem; padding: .6rem 0; border-top: 1px solid var(--line-soft); }
  .items li:first-child { border-top: none; }
  .items li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .items .meta { color: var(--muted); font-size: .84rem; }

  /* ---- settings sub-navigation ---- */
  .subnav { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .subtab { font: inherit; font-size: .9rem; padding: .45rem .85rem; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .subtab:hover { color: var(--fg); }
  .subtab.active { background: var(--accent-weak); border-color: transparent; color: var(--fg); font-weight: 600; }

  /* module state badges and per-module config rows */
  .badge { font-size: .7rem; padding: .12rem .5rem; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .badge.ready { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.unconfigured, .badge.degraded, .badge.stopped { color: var(--warn-line); border-color: var(--warn-line); }
  .badge.failed { color: var(--danger); border-color: var(--danger); }
  .cfgrow { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
  .cfgrow .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; min-width: 9rem; overflow-wrap: anywhere; }
  .cfgrow input { flex: 1; min-width: 6rem; }
  .cfgrow .req { color: var(--danger); }
  .modhead { display: flex; align-items: center; gap: .55rem; }
  .modhead .spacer { flex: 1; }

  /* ---- home dashboard ---- */
  .home-head { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; }
  .home-head h2 { margin: 0; }
  .home-head .spacer { flex: 1; }
  .grid-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 1rem; align-items: start; }
  .widget { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .55rem .95rem 1rem; box-shadow: var(--shadow); }
  .widget.wide { grid-column: 1 / -1; }
  .widget.dragging { opacity: .55; outline: 2px dashed var(--accent); }
  .widget-head { display: flex; align-items: center; gap: .5rem; padding: .35rem 0 .5rem; }
  .widget-head .emoji { font-size: 1.05rem; }
  .widget-head h3 { margin: 0; font-size: .84rem; color: var(--fg); font-weight: 700; text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .widget-head .spacer { flex: 1; }
  .grip { cursor: grab; touch-action: none; background: transparent; border: none; color: var(--muted); font-size: 1rem; padding: .15rem .3rem; border-radius: 6px; line-height: 1; }
  .grip:hover { background: var(--surface-2); color: var(--fg); }
  .grip:active { cursor: grabbing; }
  .cardx { background: transparent; border: none; color: var(--muted); font-size: 1.15rem; line-height: 1; padding: .05rem .35rem; border-radius: 6px; cursor: pointer; }
  .cardx:hover { background: var(--accent-weaker); color: var(--danger); }
  .widget-body .big { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .widget-body ul { list-style: none; margin: .1rem 0 0; padding: 0; }
  .widget-body li { padding: .32rem 0; border-top: 1px solid var(--line-soft); overflow-wrap: anywhere; font-size: .92rem; }
  .widget-body li:first-child { border-top: none; }
  .tiles { display: flex; gap: 1.1rem; margin: .1rem 0 .3rem; flex-wrap: wrap; }
  .tiles .tile .n { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; display: block; letter-spacing: -.02em; }
  .tiles .tile .l { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .twoline strong { font-weight: 600; }
  .quickask { display: flex; gap: .4rem; }
  .quickask input { flex: 1; }

  .adder { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
  .adder-title { margin: 0 0 .7rem; font-size: 1rem; }
  .field-label { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: .8rem 0 .4rem; }
  .chiprow { display: flex; gap: .45rem; flex-wrap: wrap; }
  .chip { font: inherit; font-size: .86rem; padding: .35rem .7rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .adder-form { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .3rem; }
  .adder-form .full { grid-column: 1 / -1; }

  /* ---- appearance ---- */
  .swatches { display: flex; gap: .6rem; flex-wrap: wrap; margin: .3rem 0 .2rem; }
  .swatch { width: 2.3rem; height: 2.3rem; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; position: relative; }
  .swatch.active { border-color: var(--fg); }
  .swatch.active::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: .95rem; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .segmented { display: inline-flex; gap: .25rem; background: var(--surface-2); padding: .22rem; border-radius: 999px; }
  .segmented button { font: inherit; font-size: .86rem; padding: .35rem .8rem; border-radius: 999px; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  .segmented button.active { background: var(--raised); color: var(--fg); box-shadow: var(--shadow-sm); }

  /* login / setup overlay */
  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: linear-gradient(160deg, var(--accent-weak), var(--bg) 60%); padding: 1rem; }
  #gate.active { display: flex; }
  #gate .box { width: 100%; max-width: 23rem; }
  #gate h1 { text-align: center; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <header id="topbar" hidden>
    <span class="brand"><span class="dot">◆</span><h1>vahub</h1></span>
    <nav id="nav">
      <button data-tab="home" class="active" type="button">🏠 Home</button>
      <button data-tab="thread" type="button">💬 Chat</button>
      <button data-tab="settings" type="button">⚙️ Settings</button>
    </nav>
    <span class="spacer"></span>
    <span class="state" id="state" role="status" aria-live="polite"></span>
    <span class="who" id="who"></span>
    <button class="linkbtn" id="logout" type="button" hidden>sign out</button>
  </header>

  <main>
    <section class="panel active" id="home" aria-label="Home"></section>
    <div class="panel" id="thread" aria-live="polite">
      <div class="empty" id="empty">
        <p>Ask for something.</p>
        <p class="examples">"what time is it in Tokyo?"<br />"always show me departures from Zürich HB"</p>
      </div>
    </div>
    <section class="panel" id="settings" aria-label="Settings"></section>
  </main>

  <footer id="composerBar" hidden>
    <div class="composer">
      <label class="visually-hidden" for="input">Message</label>
      <input id="input" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Ask something, or say “show me…”" />
      <button id="mic" class="mic" type="button" title="Speak" aria-label="Speak">Speak</button>
      <button id="send" class="send" type="button">Send</button>
    </div>
    <div class="hint">
      <label><input type="checkbox" id="readAloud" checked /> read replies aloud</label>
      <span id="voiceNote"></span>
    </div>
  </footer>

  <div id="gate">
    <div class="box card">
      <h1 id="gateTitle">Sign in</h1>
      <div id="gateBody"></div>
    </div>
  </div>

<script nonce="__CSP_NONCE__">
(function () {
  "use strict";

  // ---- tiny safe DOM helper --------------------------------------------
  // Children are appended as text nodes or elements; nothing is ever set as
  // innerHTML, so module- and model-supplied strings cannot become markup.
  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === "class") node.className = props[k];
        else if (k === "text") node.textContent = props[k];
        else if (k === "type") node.type = props[k];
        else if (k === "hidden") node.hidden = !!props[k];
        else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), props[k]);
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  async function api(method, path, body) {
    const opts = { method: method, headers: {} };
    if (body !== undefined) {
      opts.headers["content-type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    let r;
    try { r = await fetch(path, opts); }
    catch (e) { return { ok: false, status: 0, data: {} }; }   // network / offline
    let data = {};
    try { data = await r.json(); } catch (e) { /* empty body */ }
    return { ok: r.ok, status: r.status, data: data };
  }

  // A guarded GET returning 401 means the session expired mid-use. Send the user
  // to the login screen instead of rendering a misleading empty panel/widget.
  function reauthed(r) {
    if (r && r.status === 401) { dropToLogin(); return true; }
    return false;
  }

  const $ = function (id) { return document.getElementById(id); };
  const thread = $("thread"), empty = $("empty"), input = $("input");
  const sendBtn = $("send"), micBtn = $("mic"), readBox = $("readAloud");
  const stateEl = $("state"), voiceNote = $("voiceNote");

  let sessionId = null;
  let config = { stt_provider: "browser", tts_provider: "browser" };
  const shown = new Set();
  let assistantStarted = false;

  // ---- appearance: accent colour and theme -----------------------------
  const ACCENTS = {
    coral:  "#ef6a3d", amber: "#e29a2b", rose: "#e5508a", violet: "#8b5cf6",
    indigo: "#5b6ef5", blue:  "#3b82f6", teal: "#12a594", green: "#3ea662",
  };
  const DEFAULT_ACCENT = "coral";
  let currentAccent = DEFAULT_ACCENT;
  let currentTheme = "auto";   // auto | light | dark

  function hexToRgba(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }
  function applyAccent(name) {
    const hex = ACCENTS[name] || ACCENTS[DEFAULT_ACCENT];
    currentAccent = ACCENTS[name] ? name : DEFAULT_ACCENT;
    const root = document.documentElement.style;
    root.setProperty("--accent", hex);
    root.setProperty("--accent-weak", hexToRgba(hex, 0.16));
    root.setProperty("--accent-weaker", hexToRgba(hex, 0.09));
  }
  function applyTheme(name) {
    currentTheme = (name === "light" || name === "dark") ? name : "auto";
    if (currentTheme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", currentTheme);
  }

  function atBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60; }
  function scroll(force) { if (force || atBottom()) thread.scrollTop = thread.scrollHeight; }
  function clearEmpty() { if (empty && empty.parentNode) empty.remove(); }
  function bubble(text, kind) {
    clearEmpty();
    const stick = atBottom();
    const node = el("div", { class: "msg " + kind, text: text });
    thread.appendChild(node);
    scroll(stick);
    return node;
  }
  function setState(text) { stateEl.textContent = text || ""; }

  // ---- speaking ---------------------------------------------------------
  function speak(text) {
    if (!text || !readBox.checked) return;
    if (config.tts_provider !== "browser") return;
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  // ---- approvals --------------------------------------------------------
  function describe(p) {
    const what = (p.module || "") + "." + (p.tool || "");
    return p.reason ? what + " (" + p.reason + ")" : what;
  }
  function argLines(p) {
    const args = p && p.args;
    if (!args || typeof args !== "object") return [];
    return Object.keys(args).map(function (k) {
      let v = args[k];
      if (typeof v !== "string") v = JSON.stringify(v);
      if (v.length > 200) v = v.slice(0, 200) + "…";

    });

  function showApproval(p) {
    const id = p.pending_id || p.id;

    shown.add(id);
    clearEmpty();

    const card = el("div", { class: "approval" });
    card.appendChild(el("p", null, [
      el("span", { text: "Needs your approval: " }),
      el("span", { class: "what", text: describe(p) }),
    ]));
    const rows = argLines(p);
    if (rows.length) {
      card.appendChild(el("ul", { class: "args" }, rows.map(function (t) { return el("li", { text: t }); })));
    }

    const yes = el("button", { class: "yes", type: "button", text: "Approve" });
    const no = el("button", { class: "no", type: "button", text: "Dismiss" });
    const expiry = el("span", { class: "expiry" });
    card.appendChild(el("div", { class: "row" }, [yes, no, expiry]));
    thread.appendChild(card);
    scroll(true);

    let countdown = null;
    const expiresAt = p.expires_at || (p.ttl_s ? Date.now() / 1000 + p.ttl_s : null);
    const stopCountdown = function () { if (countdown) { clearInterval(countdown); countdown = null; } };
    if (expiresAt) {

        else expiry.textContent = left + "s left";

      tick();
      countdown = setInterval(tick, 1000);
    }
    const finish = function (text, kind) { stopCountdown(); card.remove(); if (text) bubble(text, kind || "theirs"); };

      stopCountdown();

  // ---- live approvals over the socket -----------------------------------
  let wsBackoff = 1000;
  let signedOut = false;
  let socket = null;
  let reconnectTimer = null;
  function connect() {
    if (signedOut) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (socket) { try { socket.close(); } catch (e) { /* already gone */ } socket = null; }
    let ws;
    try {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws/events");
    } catch (e) { return; }
    socket = ws;
    ws.onopen = function () { setState(""); wsBackoff = 1000; loadPending(); };
    ws.onclose = function () {
      if (ws !== socket || signedOut) return;
      setState("reconnecting");
      reconnectTimer = setTimeout(connect, wsBackoff);
      wsBackoff = Math.min(wsBackoff * 2, 30000);

    const pending = bubble("...", "theirs thinking");

      bubble(r.data.detail || ("Something went wrong (" + r.status + ")."), "problem");
    } else {
      sessionId = r.data.session_id || sessionId;

  // ---- microphone -------------------------------------------------------
  let recognizer = null, recorder = null, recording = false;
  function setRecording(on) { recording = on; micBtn.classList.toggle("recording", on); micBtn.textContent = on ? "Stop" : "Speak"; }
  function useBrowserSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { micBtn.disabled = true; voiceNote.textContent = "Speaking needs Chrome or Edge. Typing works everywhere."; return; }
    recognizer = new SR();
    recognizer.lang = navigator.language || "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = function (e) { send(e.results[0][0].transcript); };

    recognizer.onerror = function (e) { setRecording(false); if (e.error !== "aborted") voiceNote.textContent = "Microphone: " + e.error; };

  function useServerSpeech() {

      catch (e) { voiceNote.textContent = "Microphone unavailable."; return; }
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = async function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        setRecording(false);
        const form = new FormData();
        form.append("audio", new Blob(chunks, { type: recorder.mimeType || "audio/webm" }), "audio.webm");
        if (sessionId) form.append("session_id", sessionId);
        const thinking = bubble("...", "theirs thinking");
        try {
          const resp = await fetch("/api/voice", { method: "POST", body: form });
          const data = await resp.json().catch(function () { return {}; });
          thinking.remove();

  // A pinned card that shows any read tool's result, rendered generically.

  function hashArgs(args) {

  function addWidget(key) {

  // ---- drag to reorder (pointer based, works with mouse and touch) ------
  function nearestCard(grid, exclude, x, y) {
    let best = null, bd = Infinity;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === exclude || !c.dataset || !c.dataset.id) return;
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
      if (d < bd) { bd = d; best = c; }
    });
    return best;
  }
  function commitOrder(grid) {
    const order = Array.prototype.map.call(grid.children, function (c) { return c.dataset.id; }).filter(Boolean);
    const byId = {};
    dashCards.forEach(function (e) { byId[e.id] = e; });
    const next = order.map(function (id) { return byId[id]; }).filter(Boolean);
    if (next.length === dashCards.length) { dashCards = next; saveDash(); }
  }
  function attachDrag(handle, card) {
    handle.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      const grid = $("dashGrid");
      if (!grid) return;
      card.classList.add("dragging");
      try { handle.setPointerCapture(e.pointerId); } catch (_) { /* ok */ }
      const move = function (ev) {
        const target = nearestCard(grid, card, ev.clientX, ev.clientY);
        if (!target) return;
        const r = target.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const sameRow = Math.abs(ev.clientY - cy) < r.height * 0.6;
        const before = sameRow ? (ev.clientX < cx) : (ev.clientY < cy);
        if (before) grid.insertBefore(card, target);
        else grid.insertBefore(card, target.nextSibling);
      };
      const up = function () {
        card.classList.remove("dragging");
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
        try { handle.releasePointerCapture(e.pointerId); } catch (_) { /* ok */ }
        commitOrder(grid);
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });
  }

  function buildCard(entry) {
    const def = entry.type === "widget" ? WIDGETS[entry.widget] : null;

  async function buildAdder(container) {

    container.appendChild(el("h3", { class: "adder-title", text: "Add a card" }));
    const present = {};
    dashCards.forEach(function (e) { if (e.type === "widget") present[e.widget] = true; });
    const chips = el("div", { class: "chiprow" });
    Object.keys(WIDGETS).forEach(function (key) {
      if (present[key]) return;
      chips.appendChild(el("button", { class: "chip", type: "button", text: (EMOJI[key] || "") + " " + WIDGETS[key].title,
        onclick: function () { addWidget(key); } }));

    if (!chips.children.length) chips.appendChild(el("span", { class: "muted", text: "All the built-in cards are on your home." }));
    container.appendChild(el("div", { class: "field-label", text: "Built-in" }));
    container.appendChild(chips);

    container.appendChild(el("div", { class: "field-label", text: "From a module" }));
    const modSel = el("select");
    const toolSel = el("select");
    const argsInp = el("input", { type: "text", placeholder: 'arguments as JSON, e.g. {"station":"Zürich HB"}' });
    const titleInp = el("input", { type: "text", placeholder: "title (optional)" });
    const err = el("div", { class: "err" });
    const addB = el("button", { class: "btn primary small", type: "button", text: "Add module card" });
    modSel.appendChild(el("option", { value: "", text: "choose a module…" }));

    const r = await api("GET", "/api/modules");
    const mods = (r.ok && r.data.modules) || [];
    const readTools = {};
    mods.forEach(function (m) {
      const rt = (m.tools || []).filter(function (t) { return t["class"] === "read"; }).map(function (t) { return t.name; });
      if (!rt.length) return;
      readTools[m.name] = rt;
      modSel.appendChild(el("option", { value: m.name, text: m.name }));
    });
    const fillTools = function () {
      toolSel.textContent = "";
      (readTools[modSel.value] || []).forEach(function (tn) { toolSel.appendChild(el("option", { value: tn, text: tn })); });
    };
    modSel.addEventListener("change", fillTools);
    addB.addEventListener("click", function () {
      err.textContent = "";

      if (!module || !tool) { err.textContent = "Pick a module and a tool."; return; }

  function moduleCard(m) {
    const card = el("div", { class: "card" });
    const rm = el("button", { class: "btn small danger", type: "button", text: "Remove" });
    rm.addEventListener("click", async function () { rm.disabled = true; await api("DELETE", "/api/modules/" + encodeURIComponent(m.name)); renderSettings(); });
    card.appendChild(el("div", { class: "modhead" }, [
      el("span", { class: "emoji", text: EMOJI[m.name] || EMOJI._default }),
      el("strong", { text: m.name }),
      el("span", { class: "badge " + (m.state || ""), text: m.state || "" }),
      el("span", { class: "spacer" }),
      rm,
    ]));
    if (m.description) card.appendChild(el("p", { class: "sub", text: m.description }));
    if (m.tools && m.tools.length) {
      const names = m.tools.map(function (t) { return t.name + " (" + t["class"] + ")"; }).join(", ");
      card.appendChild(el("p", { class: "note", text: "Tools: " + names }));
    }
    if (m.has_policy_rule === false) {
      card.appendChild(el("p", { class: "note", text: "The assistant needs a policy rule for these tools in vahub.yaml before it can use them. A dashboard card can read them now." }));
    }
    const cfg = m.config || { required: [], optional: [], set: [] };
    const setKeys = cfg.set || [];
    const allKeys = (cfg.required || []).concat(cfg.optional || []);
    if (allKeys.length) {
      card.appendChild(el("p", { class: "note", text: "Configuration (values are stored on the hub, never shown back):" }));
      allKeys.forEach(function (key) {
        const isReq = (cfg.required || []).indexOf(key) !== -1;
        const isSet = setKeys.indexOf(key) !== -1;
        const inp = el("input", { type: "password", autocomplete: "off",
          placeholder: isSet ? "•••••• set — type to replace" : (isReq ? "required" : "optional") });
        const save = el("button", { class: "btn small", type: "button", text: "Save" });
        const err = el("div", { class: "err" });
        save.addEventListener("click", async function () {
          err.textContent = "";
          if (!inp.value) { err.textContent = "Enter a value."; return; }
          const res = await api("PUT", "/api/modules/" + encodeURIComponent(m.name) + "/config/" + encodeURIComponent(key), { value: inp.value });
          if (!res.ok || !res.data.ok) { err.textContent = "Could not save: " + ((res.data && (res.data.detail || res.data.error)) || res.status); return; }
          renderSettings();
        });
        const row = el("div", { class: "cfgrow" }, [el("span", { class: "key" + (isReq ? " req" : ""), text: key }), inp, save]);
        if (isSet) {
          const clear = el("button", { class: "btn small danger", type: "button", text: "Clear" });
          clear.addEventListener("click", async function () { await api("DELETE", "/api/modules/" + encodeURIComponent(m.name) + "/config/" + encodeURIComponent(key)); renderSettings(); });
          row.appendChild(clear);
        }
        card.appendChild(row);
        card.appendChild(err);
      });
    }
    if (m.missing_config && m.missing_config.length) card.appendChild(el("p", { class: "err", text: "Needs: " + m.missing_config.join(", ") }));
    return card;
  }

    $("gateTitle").textContent = "Create your account";
    gateBody.textContent = "";
    gateBody.appendChild(el("p", { class: "note", text: "This hub has no account yet. Create the first one, it becomes the owner. Afterwards, more accounts are added on the host with vahub user add." }));
    const user = el("input", { type: "text", placeholder: "username", autocomplete: "username" });
    const pass = el("input", { type: "password", placeholder: "password (8+ characters)", autocomplete: "new-password" });
    const confirm = el("input", { type: "password", placeholder: "confirm password", autocomplete: "new-password" });
    const err = el("div", { class: "err" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Create account" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      el("label", { class: "field" }, ["confirm password", confirm]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      if (pass.value !== confirm.value) { err.textContent = "The passwords do not match."; return; }
      btn.disabled = true;
      const r = await api("POST", "/api/setup", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) { boot(); return; }
      if (r.status === 409) { renderLogin("An account already exists. Sign in instead."); return; }
      err.textContent = (r.data && r.data.detail) || "Could not create the account.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  function renderLogin(message) {
    $("gateTitle").textContent = "Sign in";
    gateBody.textContent = "";
    const user = el("input", { type: "text", placeholder: "username", autocomplete: "username" });
    const pass = el("input", { type: "password", placeholder: "password", autocomplete: "current-password" });
    const err = el("div", { class: "err", text: message || "" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Sign in" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      const r = await api("POST", "/api/login", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) boot();
      else if (r.status === 429) err.textContent = "Too many attempts. Wait a few minutes.";
      else err.textContent = "Wrong username or password.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  $("logout").addEventListener("click", async function () {
    signedOut = true;
    if (socket) { try { socket.close(); } catch (e) { /* gone */ } socket = null; }
    await api("POST", "/api/logout");
    renderLogin();
    showGate();
  });

  async function boot() {
    const r = await api("GET", "/api/me");
    if (!r.ok) { dropToLogin(); return; }
    const me = r.data || {};
    if (me.auth === false || me.authenticated) { showApp(me); return; }
    if (me.setup_required) renderSetup(); else renderLogin();
    showGate();
  }

  applyAccent(DEFAULT_ACCENT);
  boot();
})();
</script>
</body>
</html>
