  // ---- plain words ------------------------------------------------------
  const WORDS = {
    URL: "URL", URLS: "URLs", API: "API", SSL: "SSL", ID: "ID", IMAP: "IMAP", ICS: "Calendar feed",
    TZ: "Time zone", HA: "Home Assistant", NTFY: "ntfy", MR: "MR", RSS: "RSS", HB: "HB",
  };
  function humanizeWords(raw) {
    const parts = String(raw || "").split(/[_\s]+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      const up = parts[i].toUpperCase();
      if (up === "S" && out.length && /timeout/i.test(out[out.length - 1])) { out.push("(seconds)"); continue; }
      if (WORDS[up]) { out.push(WORDS[up]); continue; }
      const lower = parts[i].toLowerCase();
      out.push(out.length ? lower : lower.charAt(0).toUpperCase() + lower.slice(1));
    }
    const text = out.join(" ");
    return text.charAt(0).toUpperCase() + text.slice(1);
  }
  // Apps have names people already know how to spell.
  const APP_NAMES = {
    github: "GitHub", gitlab: "GitLab", homeassistant: "Home Assistant", rss: "News feeds",
    homelab: "Homelab", obsidian: "Obsidian", email: "Email", calendar: "Calendar",
    transit: "Transit", weather: "Weather", calculator: "Calculator", notify: "Notifications",
    time: "Time", core: "Assistant",
  };
  function appName(name) { return APP_NAMES[name] || humanizeWords(name); }
  function humanizeKey(moduleName, key) {
    const prefix = String(moduleName || "").toUpperCase().replace(/-/g, "_") + "_";
    const trimmed = String(key).indexOf(prefix) === 0 ? String(key).slice(prefix.length) : String(key);
    return humanizeWords(trimmed);
  }
  function firstSentence(text, cap) {
    // A tool's description is a docstring: its first line is the summary and the
    // rest documents arguments. Only the summary belongs in a label.
    const s = String(text || "").trim();
    if (!s) return "";
    const line = s.split(/\r?\n/)[0].trim();
    const dot = line.indexOf(". ");
    const one = dot > 0 ? line.slice(0, dot + 1) : line;
    return one.length > (cap || 90) ? one.slice(0, cap || 90).trim() + "…" : one;
  }

  // ---- fields built from a tool's own schema (never raw JSON) -----------
  function fieldsFromSchema(schema) {
    const props = (schema && schema.properties) || {};
    const required = (schema && schema.required) || [];
    const wrap = el("div", { class: "fields" });
    const controls = [];
    Object.keys(props).forEach(function (key) {
      const spec = props[key] || {};
      const isReq = required.indexOf(key) !== -1;
      let input;
      if (Array.isArray(spec.enum)) {
        input = el("select");
        if (!isReq) input.appendChild(el("option", { value: "", text: "—" }));
        spec.enum.forEach(function (v) { input.appendChild(el("option", { value: String(v), text: String(v) })); });
      } else if (spec.type === "boolean") {
        input = el("input", { type: "checkbox" });
        if (spec.default) input.checked = true;
      } else if (spec.type === "number" || spec.type === "integer") {
        input = el("input", { type: "number", step: spec.type === "integer" ? "1" : "any" });
        if (spec.default !== undefined) input.value = String(spec.default);
      } else {
        input = el("input", { type: "text" });
        if (spec.default !== undefined) input.value = String(spec.default);
      }
      wrap.appendChild(el("label", { class: "field" }, [
        humanizeWords(key) + (isReq ? " *" : ""),
        input,
        spec.description ? el("span", { class: "hint", text: firstSentence(spec.description, 80) }) : null,
      ]));
      controls.push({ key: key, input: input, spec: spec, required: isReq });
    });
    return {
      node: wrap,
      empty: controls.length === 0,
      missing: function () {
        return controls.filter(function (c) {
          return c.required && c.spec.type !== "boolean" && !String(c.input.value || "").trim();
        }).map(function (c) { return humanizeWords(c.key); });
      },
      values: function () {
        const out = {};
        controls.forEach(function (c) {
          if (c.spec.type === "boolean") { out[c.key] = !!c.input.checked; return; }
          const raw = String(c.input.value || "").trim();
          if (!raw) return;                       // an untouched optional field is left out
          out[c.key] = (c.spec.type === "number" || c.spec.type === "integer") ? Number(raw) : raw;
        });
        return out;
      },
    };
  }

  // ---- when things run, in words instead of cron -----------------------
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const REPEATS = [
    ["daily", "Every day"], ["weekdays", "Every weekday"], ["weekend", "Every weekend day"],
    ["weekly", "Once a week"], ["monthly", "Once a month"], ["hourly", "Every hour"],
  ];
  function cronFrom(repeat, hhmm, weekday, monthday) {
    const bits = String(hhmm || "08:00").split(":");
    const h = String(parseInt(bits[0], 10) || 0);
    const m = String(parseInt(bits[1], 10) || 0);
    if (repeat === "hourly") return m + " * * * *";
    if (repeat === "weekdays") return m + " " + h + " * * 1-5";
    if (repeat === "weekend") return m + " " + h + " * * 0,6";
    if (repeat === "weekly") return m + " " + h + " * * " + String(weekday);
    if (repeat === "monthly") return m + " " + h + " " + String(monthday) + " * *";
    return m + " " + h + " * * *";
  }
  function clockText(h, m) {
    const hh = parseInt(h, 10), mm = parseInt(m, 10);
    if (isNaN(hh) || isNaN(mm)) return null;
    const pad = function (n) { return (n < 10 ? "0" : "") + n; };
    if (prefs.clock24) return pad(hh) + ":" + pad(mm);
    const suffix = hh < 12 ? "am" : "pm";
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    return h12 + ":" + pad(mm) + " " + suffix;
  }
  function describeCron(cron) {
    const f = String(cron || "").trim().split(/\s+/);
    if (f.length !== 5) return String(cron || "");
    const m = f[0], h = f[1], dom = f[2], mon = f[3], dow = f[4];
    if (h === "*" && /^\d+$/.test(m)) return "Every hour at " + (m.length < 2 ? "0" + m : m) + " past";
    const at = clockText(h, m);
    if (at === null || mon !== "*") return String(cron);      // something unusual: show it as written
    if (dom === "*" && dow === "1-5") return "Every weekday at " + at;
    if (dom === "*" && (dow === "0,6" || dow === "6,0")) return "Every weekend day at " + at;
    if (dom === "*" && /^\d$/.test(dow)) return "Every " + DAYS[Number(dow)] + " at " + at;
    if (dom === "*" && dow === "*") return "Every day at " + at;
    if (/^\d+$/.test(dom) && dow === "*") return "Monthly on day " + dom + " at " + at;
    return String(cron);
  }

  // ======================================================================
  //  HOME DASHBOARD
  // ======================================================================
  let currentUser = null;
  let dashCards = null;      // array of card entries; null until loaded
  let dashDirty = false;     // a chat/voice turn may have changed the cards
  let adderOpen = false;
  let clockTimer = null;

  function iconFor(entry) {
    return icon(iconName(entry.type === "widget" ? entry.widget : entry.module));
  }

  function twoLine(primary, secondary) {
    return el("span", { class: "twoline" }, [
      el("strong", { text: primary || "" }),
      el("span", { class: "muted", text: secondary ? "  " + secondary : "" }),
    ]);
  }

  // A card backed by a module's read `summary` tool: fixed tiles + a recent list.
  function serviceWidget(module, tiles, line) {
    return async function (body) {
      body.appendChild(el("div", { class: "muted", text: "Loading…" }));
      const r = await api("POST", "/api/tools/" + module + "/summary", { args: {} });
      body.textContent = "";
      if (reauthed(r)) return;
      if (!r.ok || !r.data.ok) { body.appendChild(el("div", { class: "muted", text: toolError(r) })); return; }
      const p = r.data.result || {};
      if (p.configured === false) { body.appendChild(el("div", { class: "muted", text: "Add its token in Settings › Modules." })); return; }
      if (p.error) { body.appendChild(el("div", { class: "muted", text: String(p.error) })); return; }
      const row = el("div", { class: "tiles" });
      tiles.forEach(function (t) {
        row.appendChild(el("div", { class: "tile" }, [
          el("span", { class: "n", text: (p[t.key] == null ? "–" : String(p[t.key])) }),
          el("span", { class: "l", text: t.label }),
        ]));
      });
      body.appendChild(row);
      const recent = p.recent || [];
      if (recent.length) {
        const ul = el("ul");
        recent.slice(0, 5).forEach(function (item) { ul.appendChild(el("li", null, [line(item)])); });
        body.appendChild(ul);
      }
    };
  }

  function toolError(r) {
    const why = (r.data && r.data.error) || "";
    if (why === "unknown_module") return "Not installed. Add it in Settings › Modules.";
    if (why === "module_not_ready" || why === "not_readonly") return "Set it up in Settings › Modules.";
    return "Unavailable right now.";
  }

  // A pinned card that shows any read tool's result, rendered generically.
  function itemPrimary(it) {
    if (it == null) return "";
    if (typeof it !== "object") return String(it);
    const line = it.line || it.route || it.number;
    const dest = it.to || it.destination || it.headsign;
    if (line && dest) return String(line) + " → " + String(dest);
    const keys = ["title", "name", "summary", "subject", "label", "to", "destination", "from", "station", "headsign", "key", "query"];
    for (let i = 0; i < keys.length; i++) if (it[keys[i]]) return String(it[keys[i]]);
    return JSON.stringify(it).slice(0, 90);
  }
  function itemSecondary(it) {
    if (it == null || typeof it !== "object") return "";
    const keys = ["departure", "time", "at", "when", "platform", "published", "date", "repo", "project", "subject", "address", "value"];
    const bits = [];
    for (let i = 0; i < keys.length && bits.length < 2; i++) {
      if (it[keys[i]] != null && it[keys[i]] !== "") bits.push(String(it[keys[i]]));
    }
    return bits.join("  ·  ");
  }
  function genericRender(body, result) {
    if (!result || typeof result !== "object") { body.appendChild(el("div", { class: "muted", text: "No data." })); return; }
    if (result.configured === false) { body.appendChild(el("div", { class: "muted", text: "Configure this module in Settings › Modules." })); return; }
    if (result.error) { body.appendChild(el("div", { class: "muted", text: String(result.error) })); return; }
    const tiles = [];
    let arr = null;
    Object.keys(result).forEach(function (k) {
      const v = result[k];
      if (typeof v === "number") tiles.push({ k: k, v: v });
      else if (!arr && Array.isArray(v) && v.length) arr = v;
    });
    if (tiles.length) {
      const row = el("div", { class: "tiles" });
      tiles.slice(0, 4).forEach(function (t) {
        row.appendChild(el("div", { class: "tile" }, [
          el("span", { class: "n", text: String(t.v) }),
          el("span", { class: "l", text: t.k.replace(/_/g, " ") }),
        ]));
      });
      body.appendChild(row);
    }
    if (arr) {
      const ul = el("ul");
      arr.slice(0, 6).forEach(function (item) { ul.appendChild(el("li", null, [twoLine(itemPrimary(item), itemSecondary(item))])); });
      body.appendChild(ul);
    } else if (!tiles.length) {
      body.appendChild(el("div", { class: "muted", text: "Nothing to show right now." }));
    }
  }
  function toolCardRender(card) {
    return async function (body) {
      body.appendChild(el("div", { class: "muted", text: "Loading…" }));
      const r = await api("POST", "/api/tools/" + encodeURIComponent(card.module) + "/" + encodeURIComponent(card.tool), { args: card.args || {} });
      body.textContent = "";
      if (reauthed(r)) return;
      if (!r.ok || !r.data.ok) { body.appendChild(el("div", { class: "muted", text: toolError(r) })); return; }
      genericRender(body, r.data.result || {});
    };
  }

  const WIDGETS = {
    clock:    { title: "Clock", render: renderClock },
    quickask: { title: "Quick ask", wide: true, render: renderQuickAsk },
    places:   { title: "Saved places", render: renderPlacesWidget },
    routines: { title: "Upcoming routines", render: renderRoutinesWidget },
    notes:    { title: "Assistant remembers", render: renderNotesWidget },
    github:   { title: "GitHub", render: serviceWidget("github",
      [{ key: "notifications", label: "Inbox" }, { key: "review_requests", label: "Reviews" }, { key: "assigned_issues", label: "Issues" }],
      function (it) { return twoLine(it.title, it.repo); }) },
    gitlab:   { title: "GitLab", render: serviceWidget("gitlab",
      [{ key: "todos", label: "To-dos" }, { key: "assigned_merge_requests", label: "MRs" }, { key: "assigned_issues", label: "Issues" }],
      function (it) { return twoLine(it.title, it.project); }) },
    email:    { title: "Email", render: serviceWidget("email",
      [{ key: "unread", label: "Unread" }, { key: "total", label: "Total" }],
      function (it) { return twoLine(it.from, it.subject); }) },
  };
  function defaultDash() {
    return [
      { id: "w:clock", type: "widget", widget: "clock" },
      { id: "w:quickask", type: "widget", widget: "quickask" },
      { id: "w:places", type: "widget", widget: "places" },
      { id: "w:routines", type: "widget", widget: "routines" },
    ];
  }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }

  async function loadDash() {
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const settings = (r.ok && r.data && r.data.settings) || {};
    // apply the owner's appearance and preferences while we have them in hand
    if (settings["ui:accent"]) applyAccent(settings["ui:accent"]);
    if (settings["ui:theme"]) applyTheme(settings["ui:theme"]);
    adoptPrefs(settings["ui:prefs"]);
    let cards = settings["ui:dashboard"];
    if (!Array.isArray(cards)) {
      const old = settings["ui:layout:" + (currentUser || "_")];
      if (Array.isArray(old) && old.length) {
        cards = old.filter(function (k) { return WIDGETS[k]; }).map(function (k) { return { id: "w:" + k, type: "widget", widget: k }; });
      } else {
        cards = defaultDash();
      }
    }
    dashCards = cards.filter(function (e) {
      if (!e || typeof e !== "object") return false;
      if (e.type === "widget") return !!WIDGETS[e.widget];
      return e.type === "tool" && !!e.module && !!e.tool;
    }).map(function (e) {
      if (!e.id) e.id = e.type === "widget" ? ("w:" + e.widget) : (e.module + "." + e.tool);
      if (e.type === "tool" && !e.args) e.args = {};
      return e;
    });
    if (!dashCards.length) dashCards = defaultDash();
  }
  async function saveDash() {
    await api("PUT", "/api/settings/" + encodeURIComponent("ui:dashboard"), { value: dashCards });
  }

  function hashArgs(args) {
    const s = JSON.stringify(args);
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(16).slice(0, 8);
  }
  function toolCardTitle(module, tool, args) {
    const words = tool.replace(/_/g, " ");
    const label = words.charAt(0).toUpperCase() + words.slice(1);
    const keys = ["station", "from", "query", "name", "location", "city", "q"];
    for (let i = 0; i < keys.length; i++) {
      if (typeof args[keys[i]] === "string" && args[keys[i]].trim()) return label + " · " + args[keys[i]].trim();
    }
    return label;
  }

  function addWidget(key) {
    if (dashCards.some(function (e) { return e.type === "widget" && e.widget === key; })) return;
    dashCards.push({ id: "w:" + key, type: "widget", widget: key });
    adderOpen = false; saveDash(); renderHome();
  }
  function addToolCard(module, tool, args, title) {
    const id = module + "." + tool + (Object.keys(args).length ? ":" + hashArgs(args) : "");
    dashCards = dashCards.filter(function (e) { return e.id !== id; });
    dashCards.push({ id: id, type: "tool", module: module, tool: tool, args: args, title: title || toolCardTitle(module, tool, args) });
    adderOpen = false; saveDash(); renderHome();
  }
  function removeCard(id) {
    dashCards = dashCards.filter(function (e) { return e.id !== id; });
    saveDash(); renderHome();
  }

  // ---- drag to reorder --------------------------------------------------
  // The card you hold is lifted out of the grid and follows the pointer, a
  // dashed slot shows where it will land, and the cards it displaces slide out
  // of the way (measure, move, invert, play). Dragging only starts after a few
  // pixels of movement, so a tap on the handle is still just a tap.
  const DRAG_THRESHOLD = 4;

  function slideNeighbours(grid, skip, before) {
    if (!animate()) return;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === skip || !before.has(c)) return;
      const now = c.getBoundingClientRect();
      const was = before.get(c);
      const dx = was.left - now.left, dy = was.top - now.top;
      if (!dx && !dy) return;
      c.style.transition = "none";
      c.style.transform = "translate(" + dx + "px," + dy + "px)";
      requestAnimationFrame(function () {
        c.style.transition = "";
        c.style.transform = "";
      });
    });
  }
  function positions(grid) {
    const map = new Map();
    Array.prototype.forEach.call(grid.children, function (c) { map.set(c, c.getBoundingClientRect()); });
    return map;
  }
  function nearestCard(grid, exclude, x, y) {
    let best = null, bd = Infinity;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === exclude || !c.dataset || !c.dataset.id) return;
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
      if (d < bd) { bd = d; best = c; }
    });
    return best;
  }
  function commitOrder(grid) {
    const order = Array.prototype.map.call(grid.children, function (c) { return c.dataset.id; }).filter(Boolean);
    const byId = {};
    dashCards.forEach(function (e) { byId[e.id] = e; });
    const next = order.map(function (id) { return byId[id]; }).filter(Boolean);
    if (next.length === dashCards.length) { dashCards = next; saveDash(); }
  }

  function attachDrag(handle, card) {
    handle.addEventListener("pointerdown", function (down) {
      if (down.button !== undefined && down.button !== 0) return;
      // The header holds the remove button; pressing it is a click, not a grab.
      if (down.target && down.target.closest && down.target.closest(".cardx")) return;
      down.preventDefault();
      const grid = $("dashGrid");
      if (!grid) return;

      let dragging = false, slot = null, rect = null, dx = 0, dy = 0;
      const startX = down.clientX, startY = down.clientY;
      try { handle.setPointerCapture(down.pointerId); } catch (e) { /* fine without capture */ }

      const begin = function () {
        dragging = true;
        rect = card.getBoundingClientRect();
        dx = startX - rect.left;
        dy = startY - rect.top;
        // A slot of exactly the card's size keeps the grid from reflowing the
        // moment the card leaves it.
        slot = el("div", { class: "drop-slot" });
        slot.style.setProperty("height", rect.height + "px");
        if (card.classList.contains("wide")) slot.className = "drop-slot wide";
        grid.insertBefore(slot, card);
        card.style.setProperty("width", rect.width + "px");
        card.style.setProperty("height", rect.height + "px");
        card.style.setProperty("left", rect.left + "px");
        card.style.setProperty("top", rect.top + "px");
        card.classList.add("lifted");
        grid.classList.add("dragging");
        document.body.classList.add("dragging");
      };

      const move = function (ev) {
        if (!dragging) {
          if (Math.abs(ev.clientX - startX) < DRAG_THRESHOLD && Math.abs(ev.clientY - startY) < DRAG_THRESHOLD) return;
          begin();
        }
        card.style.setProperty("left", (ev.clientX - dx) + "px");
        card.style.setProperty("top", (ev.clientY - dy) + "px");
        const target = nearestCard(grid, card, ev.clientX, ev.clientY);
        if (!target || target === slot) return;
        const r = target.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const sameRow = Math.abs(ev.clientY - cy) < r.height * 0.6;
        const before = sameRow ? (ev.clientX < cx) : (ev.clientY < cy);
        const wanted = before ? target : target.nextSibling;
        if (wanted === slot || (before && slot.nextSibling === target && slot === target.previousSibling)) return;
        const was = positions(grid);
        grid.insertBefore(slot, wanted);
        slideNeighbours(grid, card, was);
      };

      const finish = function () {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
        try { handle.releasePointerCapture(down.pointerId); } catch (e) { /* already released */ }
        if (!dragging) return;                       // a click, not a drag
        const landing = slot.getBoundingClientRect();
        const settle = function () {
          card.classList.remove("lifted", "settling");
          ["width", "height", "left", "top", "transform"].forEach(function (prop) { card.style.removeProperty(prop); });
          grid.insertBefore(card, slot);
          slot.remove();
          grid.classList.remove("dragging");
          document.body.classList.remove("dragging");
          commitOrder(grid);
        };
        if (!animate()) { settle(); return; }
        // Drop it into the slot rather than snapping there.
        card.classList.add("settling");
        card.style.setProperty("left", landing.left + "px");
        card.style.setProperty("top", landing.top + "px");
        card.style.setProperty("transform", "none");
        let done = false;
        const once = function () { if (done) return; done = true; card.removeEventListener("transitionend", once); settle(); };
        card.addEventListener("transitionend", once);
        setTimeout(once, 260);                       // in case the transition never fires
      };

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  function buildCard(entry) {
    const def = entry.type === "widget" ? WIDGETS[entry.widget] : null;
    const card = el("div", { class: "widget" + (def && def.wide ? " wide" : "") });
    card.dataset.id = entry.id;
    const title = entry.type === "widget" ? (def ? def.title : entry.widget) : entry.title;
    const grip = el("span", { class: "grip", title: "Drag to move", "aria-hidden": "true" }, [icon("grip", "i-sm")]);
    const rm = el("button", { class: "cardx", type: "button", title: "Remove card", "aria-label": "Remove card",
      onclick: function () { removeCard(entry.id); } }, [icon("x", "i-sm")]);
    const head = el("div", { class: "widget-head" }, [
      iconFor(entry),
      el("h3", { text: title || "Card" }),
      el("span", { class: "spacer" }),
      grip, rm,
    ]);
    card.appendChild(head);
    const body = el("div", { class: "widget-body" });
    card.appendChild(body);
    if (entry.type === "widget" && def) def.render(body);
    else if (entry.type === "tool") toolCardRender(entry)(body);
    else body.appendChild(el("div", { class: "muted", text: "Unknown card." }));
    attachDrag(head, card);   // the whole title bar drags, not just the grip
    return card;
  }

  async function buildAdder(container) {
    container.textContent = "";
    container.appendChild(el("h3", { class: "adder-title", text: "Add a card" }));
    const present = {};
    dashCards.forEach(function (e) { if (e.type === "widget") present[e.widget] = true; });
    const chips = el("div", { class: "chiprow" });
    Object.keys(WIDGETS).forEach(function (key) {
      if (present[key]) return;
      chips.appendChild(el("button", { class: "chip", type: "button", onclick: function () { addWidget(key); } },
        [icon(iconName(key), "i-sm"), WIDGETS[key].title]));
    });
    if (chips.children.length) {
      container.appendChild(el("div", { class: "field-label", text: "Ready made" }));
      container.appendChild(chips);
    }

    container.appendChild(el("div", { class: "field-label", text: "From one of your apps" }));
    const mods = await loadModules();
    // Only read-only tools can back a card, so only those are offered.
    const choices = [];
    mods.forEach(function (m) {
      (m.tools || []).forEach(function (tool) {
        if (tool["class"] !== "read") return;
        choices.push({ module: m.name, tool: tool.name, schema: tool.schema, about: tool.description || "",
          label: appName(m.name) + " · " + humanizeWords(tool.name) });
      });
    });
    if (!choices.length) {
      blank(container, "Add an app and its information can live here.", "Browse apps", function () { openSettings("modules"); });
      container.appendChild(el("div", { class: "row-actions" }, [
        el("button", { class: "btn ghost small", type: "button", text: "Close",
          onclick: function () { adderOpen = false; renderHome(); headerActions(); } }),
      ]));
      return;
    }

    const what = el("select");
    choices.forEach(function (c, i) { what.appendChild(el("option", { value: String(i), text: c.label })); });
    const about = el("p", { class: "note" });
    const fieldsBox = el("div");
    const titleInp = el("input", { type: "text", placeholder: "leave empty and we will name it" });
    const err = el("div", { class: "err" });
    let fields = null;
    const buildFields = function () {
      fieldsBox.textContent = "";
      const choice = choices[Number(what.value) || 0];
      about.textContent = choice ? firstSentence(choice.about, 160) : "";
      fields = fieldsFromSchema(choice && choice.schema);
      if (!fields.empty) fieldsBox.appendChild(fields.node);
    };
    what.addEventListener("change", buildFields);

    const addB = el("button", { class: "btn primary small", type: "button", text: "Add to home" });
    addB.addEventListener("click", function () {
      err.textContent = "";
      const choice = choices[Number(what.value) || 0];
      const short = fields ? fields.missing() : [];
      if (short.length) { err.textContent = "Still needed: " + short.join(", ") + "."; return; }
      addToolCard(choice.module, choice.tool, fields ? fields.values() : {}, titleInp.value.trim());
    });

    container.appendChild(el("div", { class: "adder-form" }, [
      el("label", { class: "field full" }, ["Show me", what]),
    ]));
    container.appendChild(about);
    container.appendChild(fieldsBox);
    container.appendChild(el("div", { class: "adder-form" }, [
      el("label", { class: "field full" }, ["Card title", titleInp]),
    ]));
    container.appendChild(err);
    container.appendChild(el("div", { class: "row-actions" }, [addB,
      el("button", { class: "btn ghost small", type: "button", text: "Close",
        onclick: function () { adderOpen = false; renderHome(); headerActions(); } })]));
    buildFields();
  }

  async function renderHome() {
    const panel = $("home");
    stopClock();
    if (dashCards === null || dashDirty) { dashDirty = false; await loadDash(); }
    panel.textContent = "";
    panel.className = "panel active";
    if (adderOpen) {
      const adder = el("div", { class: "adder" });
      panel.appendChild(adder);
      buildAdder(adder);
    }
    const grid = el("div", { class: "grid-wrap", id: "dashGrid" });
    dashCards.forEach(function (entry) { grid.appendChild(buildCard(entry)); });
    panel.appendChild(grid);
    if (!dashCards.length) {
      panel.appendChild(el("p", { class: "muted", text: "No cards yet. Add one, or just ask the assistant to show you something." }));
    }
  }

  function renderClock(body) {
    const big = el("div", { class: "big" });
    const date = el("div", { class: "muted" });
    body.appendChild(big); body.appendChild(date);
    const tick = function () {
      const now = new Date();
      const opts = { hour: "2-digit", minute: "2-digit", hour12: !prefs.clock24 };
      if (prefs.clockSeconds) opts.second = "2-digit";
      big.textContent = now.toLocaleTimeString(undefined, opts);
      date.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    };
    tick();
    clockTimer = setInterval(tick, prefs.clockSeconds ? 1000 : 15000);
  }
  function renderQuickAsk(body) {
    const box = el("input", { type: "text", placeholder: "Ask the assistant…" });
    const btn = el("button", { class: "btn primary", type: "button", text: "Ask" });
    const go = function () {
      const text = box.value.trim();
      if (!text) return;
      box.value = "";
      selectTab("thread");
      send(text);
    };
    btn.addEventListener("click", go);
    box.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    body.appendChild(el("div", { class: "quickask" }, [box, btn]));
  }
  async function renderPlacesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    const r = await api("GET", "/api/locations");
    if (reauthed(r)) return;
    const places = (r.ok && r.data.locations) || [];
    if (!places.length) {
      ul.remove();
      blank(body, "Add the places you talk about, like home or work.", "Add a place", function () { openSettings("places"); });
      return;
    }
    places.forEach(function (p) {
      const where = (p.latitude != null) ? (p.latitude + ", " + p.longitude) : (p.address || "");
      ul.appendChild(el("li", null, [twoLine(p.label || p.name, where)]));
    });
  }
  async function renderRoutinesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    await loadModules();          // so a step reads as words, not module.tool
    const r = await api("GET", "/api/schedules");
    if (reauthed(r)) return;
    const rows = ((r.ok && r.data.schedules) || []).filter(function (s) { return s.enabled; });
    if (!rows.length) {
      ul.remove();
      blank(body, "Nothing runs automatically yet.", "Set one up", function () { openSettings("schedules"); });
      return;
    }
    rows.slice(0, 6).forEach(function (s) {
      ul.appendChild(el("li", null, [twoLine(describeCron(s.cron), describeSteps(s.steps))]));
    });
  }
  async function renderNotesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const memory = (r.ok && r.data.memory) || {};
    const keys = Object.keys(memory);
    if (!keys.length) {
      ul.remove();
      blank(body, "Tell the assistant something to remember and it appears here.", "Ask it", function () { selectTab("thread"); });
      return;
    }
    keys.forEach(function (k) { ul.appendChild(el("li", null, [twoLine(k, JSON.stringify(memory[k]))])); });
  }

  // ======================================================================
  //  SETTINGS (one tab: places, schedules, modules, preferences, appearance)
  // ======================================================================
  let settingsSection = null;   // null means the list of sections
  let moduleCache = null;              // installed modules, for building friendly choices
  const SECTIONS = [
    ["places", "Places", "pin", "Names for the places you talk about"],
    ["schedules", "Automations", "repeat", "Things that happen on their own"],
    ["modules", "Apps", "grid", "What the assistant can reach"],
    ["prefs", "Preferences", "settings", "How this app looks and behaves"],
  ];
  function openSettings(section) {
    settingsSection = section || null;
    selectTab("settings");
  }
  async function loadModules(force) {
    if (moduleCache && !force) return moduleCache;
    const r = await api("GET", "/api/modules");
    if (reauthed(r)) return [];
    moduleCache = (r.ok && r.data.modules) || [];
    return moduleCache;
  }
  // "transit.next_departures" is not something to show a person. Prefer the
  // tool's own description, fall back to plain words.
  function describeSteps(steps) {
    return (steps || []).map(function (st) {
      const mod = (moduleCache || []).filter(function (m) { return m.name === st.module; })[0];
      const tool = mod && (mod.tools || []).filter(function (x) { return x.name === st.tool; })[0];
      const words = (tool && tool.description) ? firstSentence(tool.description, 70) : humanizeWords(st.tool);
      const args = Object.keys(st.args || {}).map(function (k) { return String(st.args[k]); }).join(", ");
      return args ? words + " (" + args + ")" : words;
    }).join(", ");
  }
  function sectionDef(key) {
    return SECTIONS.filter(function (s) { return s[0] === key; })[0] || null;
  }
  function renderSettings() {
    const panel = $("settings");
    panel.textContent = "";
    const layout = el("div", { class: "settings-layout" });
    layout.dataset.open = settingsSection ? "section" : "list";

    // On a phone this list is the Settings screen and tapping opens one; on a
    // desk it stays beside the section as a table of contents.
    const list = el("nav", { class: "seclist", "aria-label": "Settings sections" });
    SECTIONS.forEach(function (s) {
      const item = el("button", { class: "secitem" + (settingsSection === s[0] ? " active" : ""), type: "button",
        onclick: function () { settingsSection = s[0]; renderSettings(); syncChrome(); } }, [
        icon(s[2]),
        el("span", { class: "grow" }, [s[1]]),
        icon("chevronRight", "i-sm"),
      ]);
      list.appendChild(item);
    });
    layout.appendChild(list);

    const body = el("div", { class: "secbody" });
    layout.appendChild(body);
    panel.appendChild(layout);
    if (settingsSection) {
      ({ places: renderPlaces, schedules: renderSchedules, modules: renderModules, prefs: renderPreferences }[settingsSection] || renderPlaces)(body);
    }
    syncChrome();
  }

  async function renderPlaces(root) {
    root.appendChild(el("p", { class: "sub", text: "Give the places you talk about a name, so you can just say “home”." }));
    const list = el("ul", { class: "items" });
    const r = await api("GET", "/api/locations");
    if (reauthed(r)) return;
    (r.data.locations || []).forEach(function (loc) {
      const bits = [];
      if (loc.latitude != null && loc.longitude != null) bits.push(loc.latitude + ", " + loc.longitude);
      if (loc.address) bits.push(loc.address);
      const del = el("button", { class: "btn small danger", type: "button", text: "Delete" });
      del.addEventListener("click", async function () { await api("DELETE", "/api/locations/" + encodeURIComponent(loc.name)); renderSettings(); });
      list.appendChild(el("li", null, [
        el("span", { class: "grow" }, [el("strong", { text: loc.label || loc.name }), el("span", { class: "meta", text: "  " + bits.join("  ·  ") })]),
        del,
      ]));
    });
    const hasPlaces = (r.data.locations || []).length > 0;

    const name = el("input", { type: "text", placeholder: "home" });
    const label = el("input", { type: "text", placeholder: "Home" });
    const lat = el("input", { type: "number", step: "any", placeholder: "latitude" });
    const lon = el("input", { type: "number", step: "any", placeholder: "longitude" });
    const address = el("input", { type: "text", placeholder: "Bahnhofstrasse 1, Zürich" });
    const err = el("div", { class: "err" });
    const save = el("button", { class: "btn primary", type: "button", text: "Save place" });
    save.addEventListener("click", async function () {
      err.textContent = "";
      const n = name.value.trim();
      if (!n) { err.textContent = "Give it a name first."; return; }
      const body = { label: label.value.trim() || null, address: address.value.trim() || null };
      if (lat.value !== "") body.latitude = Number(lat.value);
      if (lon.value !== "") body.longitude = Number(lon.value);
      const res = await api("PUT", "/api/locations/" + encodeURIComponent(n), body);
      if (!res.ok) { err.textContent = "Could not save that. If you entered coordinates, check them."; return; }
      renderSettings();
    });
    // An empty list is not worth a card of its own; the form below is the point.
    if (hasPlaces) root.appendChild(el("div", { class: "card" }, [list]));
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: hasPlaces ? "Add another place" : "Add your first place" }),
      el("div", { class: "grid" }, [
        el("label", { class: "field" }, ["What do you call it?", name]),
        el("label", { class: "field" }, ["Full name (optional)", label]),
        el("label", { class: "field full" }, ["Address (optional)", address]),
      ]),
      // Coordinates are what a weather or transit app actually wants, but nobody
      // should have to meet them first.
      el("details", { class: "advanced" }, [
        el("summary", { text: "Advanced: exact coordinates" }),
        el("div", { class: "grid" }, [
          el("label", { class: "field" }, ["Latitude", lat]),
          el("label", { class: "field" }, ["Longitude", lon]),
        ]),
      ]),
      err,
      el("div", { class: "row-actions" }, [save]),
    ]));
  }

  async function renderSchedules(root) {
    root.appendChild(el("p", { class: "sub", text: "Things that happen on their own, at a time you choose." }));

    await loadModules();
    const r = await api("GET", "/api/schedules");
    if (reauthed(r)) return;
    const rows = r.data.schedules || [];

    if (rows.length) {
      const list = el("div", { class: "card" });
      rows.forEach(function (s) {
        const actions = [];
        if (s.editable) {
          const toggle = el("button", { class: "btn small", type: "button", text: s.enabled ? "Pause" : "Resume" });
          toggle.addEventListener("click", async function () {
            await api("POST", "/api/schedules/" + encodeURIComponent(s.id) + "/enabled", { enabled: !s.enabled });
            renderSettings();
          });
          const del = el("button", { class: "btn small danger", type: "button", text: "Delete" });
          del.addEventListener("click", async function () {
            await api("DELETE", "/api/schedules/" + encodeURIComponent(s.id));
            renderSettings();
          });
          actions.push(toggle, del);
        } else {
          actions.push(el("span", { class: "meta", text: "set up on the hub" }));
        }
        list.appendChild(el("div", { class: "sched" }, [
          el("span", { class: "grow" }, [
            el("div", { class: "when", text: describeCron(s.cron) + (s.enabled ? "" : "  (paused)") }),
            el("div", { class: "what", text: s.description || describeSteps(s.steps) }),
          ]),
        ].concat(actions)));
      });
      root.appendChild(list);
    }

    // ---- the builder: an action, its own fields, and a time ----------------
    const choices = [];
    (moduleCache || []).forEach(function (m) {
      (m.tools || []).forEach(function (tool) {
        // A routine runs unattended, so a destructive tool is never offered here.
        if (tool["class"] === "destructive") return;
        choices.push({ module: m.name, tool: tool.name, schema: tool.schema, ready: m.state === "ready",
          about: tool.description || "",
          label: appName(m.name) + " · " + humanizeWords(tool.name) });
      });
    });

    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { text: rows.length ? "Add another" : "Create your first automation" }));
    if (!choices.length) {
      blank(card, "Install an app first, then you can automate what it does.", "Browse apps", function () { openSettings("modules"); });
      root.appendChild(card);
      return;
    }

    const what = el("select");
    choices.forEach(function (c, i) {
      what.appendChild(el("option", { value: String(i), text: c.label + (c.ready ? "" : " (not set up yet)") }));
    });
    const about = el("p", { class: "note" });
    const fieldsBox = el("div");
    let fields = null;
    const buildFields = function () {
      fieldsBox.textContent = "";
      const choice = choices[Number(what.value) || 0];
      about.textContent = choice ? firstSentence(choice.about, 160) : "";
      fields = fieldsFromSchema(choice && choice.schema);
      if (!fields.empty) fieldsBox.appendChild(fields.node);
    };
    what.addEventListener("change", buildFields);

    const repeat = el("select");
    REPEATS.forEach(function (rp) { repeat.appendChild(el("option", { value: rp[0], text: rp[1] })); });
    const at = el("input", { type: "time", value: "08:00" });
    const weekday = el("select");
    DAYS.forEach(function (d, i) { weekday.appendChild(el("option", { value: String(i), text: d })); });
    weekday.value = "1";
    const monthday = el("input", { type: "number", min: "1", max: "28", value: "1" });
    const atField = el("label", { class: "field" }, ["Time", at]);
    const dayField = el("label", { class: "field" }, ["Day", weekday]);
    const dateField = el("label", { class: "field" }, ["Day of the month", monthday]);
    const syncWhen = function () {
      dayField.hidden = repeat.value !== "weekly";
      dateField.hidden = repeat.value !== "monthly";
      atField.hidden = repeat.value === "hourly";
    };
    repeat.addEventListener("change", syncWhen);

    const err = el("div", { class: "err" });
    const save = el("button", { class: "btn primary", type: "button", text: "Create automation" });
    const cronBox = el("input", { type: "text", placeholder: "leave empty unless you know cron" });

    save.addEventListener("click", async function () {
      err.textContent = "";
      const choice = choices[Number(what.value) || 0];
      const short = fields ? fields.missing() : [];
      if (short.length) { err.textContent = "Still needed: " + short.join(", ") + "."; return; }
      const cron = cronBox.value.trim() || cronFrom(repeat.value, at.value, weekday.value, monthday.value);
      const res = await api("POST", "/api/schedules", {
        cron: cron,
        steps: [{ module: choice.module, tool: choice.tool, args: fields ? fields.values() : {} }],
        description: firstSentence(choice.about, 110) || choice.label.replace(/^\S+\s/, ""),
      });
      if (!res.ok) { err.textContent = "Could not create it: " + (res.data.detail || res.data.error || res.status); return; }
      renderSettings();
    });

    card.appendChild(el("div", { class: "builder" }, [
      el("label", { class: "field" }, ["What should happen?", what]),
      about,
      fieldsBox,
      el("div", { class: "when-row" }, [el("label", { class: "field" }, ["How often?", repeat]), atField, dayField, dateField]),
    ]));
    card.appendChild(el("details", { class: "advanced" }, [
      el("summary", { text: "Advanced: write the schedule as cron" }),
      el("label", { class: "field" }, ["cron expression", cronBox]),
    ]));
    card.appendChild(err);
    card.appendChild(el("div", { class: "row-actions" }, [save]));
    card.appendChild(el("p", { class: "note", text: "An automation runs by itself, so it can only do what the hub already allows without a person present." }));
    root.appendChild(card);
    buildFields();
    syncWhen();
  }

  async function doInstall(body, errBox, btn) {
    errBox.textContent = "";
    if (body.source !== undefined && !body.source) { errBox.textContent = "Enter a source."; return; }
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Installing…";
    const r = await api("POST", "/api/modules", body);
    btn.disabled = false; btn.textContent = label;
    if (!r.ok || !r.data.ok) { errBox.textContent = "That did not work: " + ((r.data && (r.data.detail || r.data.error)) || r.status); return; }
    moduleCache = null;
    renderSettings();
  }
  const STATE_WORDS = { ready: "Working", unconfigured: "Needs setup", failed: "Not working", stopped: "Off", degraded: "Having trouble", starting: "Starting" };
  function moduleCard(m) {
    const card = el("div", { class: "card" });
    const rm = el("button", { class: "btn small danger", type: "button", text: "Remove" });
    rm.addEventListener("click", async function () {
      rm.disabled = true;
      await api("DELETE", "/api/modules/" + encodeURIComponent(m.name));
      moduleCache = null;
      renderSettings();
    });
    card.appendChild(el("div", { class: "modhead" }, [
      icon(iconName(m.name)),
      el("strong", { text: appName(m.name) }),
      el("span", { class: "badge " + (m.state || ""), text: STATE_WORDS[m.state] || m.state || "" }),
      el("span", { class: "spacer" }),
      rm,
    ]));
    if (m.description) card.appendChild(el("p", { class: "sub", text: m.description }));
    if (m.tools && m.tools.length) {
      const names = m.tools.map(function (tool) { return humanizeWords(tool.name); }).slice(0, 5).join(" · ");
      card.appendChild(el("p", { class: "note", text: "Can: " + names }));
    }
    if (m.has_policy_rule === false) {
      card.appendChild(el("p", { class: "note", text: "You can put this on your home screen now. Letting the assistant use it on its own has to be allowed by whoever runs the hub." }));
    }
    const cfg = m.config || { required: [], optional: [], set: [] };
    const setKeys = cfg.set || [];
    const allKeys = (cfg.required || []).concat(cfg.optional || []);
    if (allKeys.length) {
      card.appendChild(el("p", { class: "note", text: "Details it needs. They are kept on the hub and never shown back to you." }));
      allKeys.forEach(function (key) {
        const isReq = (cfg.required || []).indexOf(key) !== -1;
        const isSet = setKeys.indexOf(key) !== -1;
        const inp = el("input", { type: "password", autocomplete: "off",
          placeholder: isSet ? "•••••• saved — type to replace" : (isReq ? "needed" : "optional") });
        const save = el("button", { class: "btn small", type: "button", text: "Save" });
        const err = el("div", { class: "err" });
        save.addEventListener("click", async function () {
          err.textContent = "";
          if (!inp.value) { err.textContent = "Enter a value."; return; }
          const res = await api("PUT", "/api/modules/" + encodeURIComponent(m.name) + "/config/" + encodeURIComponent(key), { value: inp.value });
          if (!res.ok || !res.data.ok) { err.textContent = "Could not save that: " + ((res.data && (res.data.detail || res.data.error)) || res.status); return; }
          moduleCache = null;
          renderSettings();
        });
        const row = el("div", { class: "cfgrow" }, [
          el("span", { class: "key" + (isReq ? " req" : ""), text: humanizeKey(m.name, key) }),
          inp, save,
        ]);
        if (isSet) {
          const clear = el("button", { class: "btn small danger", type: "button", text: "Clear" });
          clear.addEventListener("click", async function () {
            await api("DELETE", "/api/modules/" + encodeURIComponent(m.name) + "/config/" + encodeURIComponent(key));
            moduleCache = null;
            renderSettings();
          });
          row.appendChild(clear);
        }
        card.appendChild(row);
        card.appendChild(err);
      });
    }
    if (m.missing_config && m.missing_config.length) {
      const needed = m.missing_config.map(function (k) { return humanizeKey(m.name, k); }).join(", ");
      card.appendChild(el("p", { class: "err", text: "Fill in " + needed + " to switch it on." }));
    }
    return card;
  }
  async function renderModules(root) {
    root.appendChild(el("p", { class: "sub", text: "Add what the assistant can reach: your mail, your calendar, your lights. Each one only gets the details you give it." }));
    const mods = await loadModules(true);
    if (!mods.length) {
      const first = el("div", { class: "card" });
      blank(first, "Nothing added yet. Pick one below to get started.", null, null);
      root.appendChild(first);
    }
    mods.forEach(function (m) { root.appendChild(moduleCard(m)); });

    const avList = el("div");
    const src = el("input", { type: "text", placeholder: "git+https://…@tag#subdir=…, pypi:…, or ./path" });
    const srcErr = el("div", { class: "err" });
    const srcBtn = el("button", { class: "btn", type: "button", text: "Install from source" });
    srcBtn.addEventListener("click", function () { doInstall({ source: src.value.trim() }, srcErr, srcBtn); });
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: "Add an app" }),
      avList,
      // Installing from an arbitrary link is a power-user escape hatch, so it is
      // folded away rather than being the second thing a person sees.
      el("details", { class: "advanced" }, [
        el("summary", { text: "Advanced: install from a link or folder" }),
        el("div", { class: "grid" }, [el("label", { class: "field full" }, ["source", src])]),
        srcErr,
        el("div", { class: "row-actions" }, [srcBtn]),
      ]),
    ]));

    const a = await api("GET", "/api/modules/available");
    if (a.data && a.data.error) { avList.appendChild(el("p", { class: "note", text: "The app list could not be reached right now." })); return; }
    const notInstalled = ((a.ok && a.data.available) || []).filter(function (it) { return !it.installed; });
    if (!notInstalled.length) { avList.appendChild(el("p", { class: "note", text: "You already have every app on the list." })); return; }
    const ul = el("ul", { class: "items" });
    notInstalled.forEach(function (it) {
      const btn = el("button", { class: "btn small primary", type: "button", text: "Install" });
      const err = el("div", { class: "err" });
      btn.addEventListener("click", function () { doInstall({ name: it.name }, err, btn); });
      ul.appendChild(el("li", null, [
        icon(iconName(it.name)),
        el("span", { class: "grow" }, [
          el("div", null, [el("strong", { text: appName(it.name) })]),
          el("div", { class: "meta", text: it.description || "" }),
        ]),
        btn,
      ]));
      ul.appendChild(err);
    });
    avList.appendChild(ul);
  }

  async function renderPreferences(root) {
    root.appendChild(el("p", { class: "sub", text: "How this app looks and behaves. Everything here takes effect straight away." }));

    // ---- look ------------------------------------------------------------
    const swatches = el("div", { class: "swatches" });
    Object.keys(ACCENTS).forEach(function (name) {
      const sw = el("button", { class: "swatch" + (currentAccent === name ? " active" : ""), type: "button",
        title: humanizeWords(name), "aria-label": humanizeWords(name) });
      sw.style.setProperty("background", ACCENTS[name]);   // CSSOM write, not a style attribute
      sw.addEventListener("click", async function () {
        applyAccent(name);
        await api("PUT", "/api/settings/" + encodeURIComponent("ui:accent"), { value: name });
        renderSettings();
      });
      swatches.appendChild(sw);
    });
    const look = el("div", { class: "card" }, [
      segmentedRow("Theme", "Follow the system, or pick one.", [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]], currentTheme,
        async function (v) { applyTheme(v); await api("PUT", "/api/settings/" + encodeURIComponent("ui:theme"), { value: v }); renderSettings(); }),
      el("div", { class: "setrow" }, [
        el("div", { class: "text" }, [el("div", { class: "name", text: "Colour" }), el("div", { class: "why", text: "Used for buttons and highlights." })]),
      ]),
      swatches,
    ]);
    root.appendChild(el("div", { class: "grouplabel", text: "Look" }));
    root.appendChild(look);

    // ---- behaviour -------------------------------------------------------
    const keep = async function () { await savePrefs(); renderSettings(); };
    const behaviour = el("div", { class: "card" }, [
      segmentedRow("Start on", "The page you see when you open the app.", [["home", "Home"], ["thread", "Chat"]], prefs.startPage,
        function (v) { prefs.startPage = v; keep(); }),
      switchRow("Read replies aloud", "Speak the assistant's answers.", prefs.readAloud,
        function (on) { prefs.readAloud = on; readBox.checked = on; keep(); }),
      switchRow("24-hour clock", "Show 14:00 instead of 2:00 pm.", prefs.clock24,
        function (on) { prefs.clock24 = on; keep(); }),
      switchRow("Show seconds", "On the clock card.", prefs.clockSeconds,
        function (on) { prefs.clockSeconds = on; keep(); }),
      switchRow("Animations", "Cards glide when you move them. Turn off for less motion.", prefs.motion,
        function (on) { prefs.motion = on; keep(); }),
    ]);
    root.appendChild(el("div", { class: "grouplabel", text: "Behaviour" }));
    root.appendChild(behaviour);

    // ---- what the assistant remembers ------------------------------------
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const memory = r.data.memory || {};
    const keys = Object.keys(memory);
    root.appendChild(el("div", { class: "grouplabel", text: "What the assistant remembers" }));
    const memCard = el("div", { class: "card" });
    if (!keys.length) {
      blank(memCard, "Nothing yet. Say “remember that I live in Zürich” and it shows up here.", "Say it", function () { selectTab("thread"); });
    } else {
      const memList = el("ul", { class: "items" });
      keys.forEach(function (k) {
        memList.appendChild(el("li", null, [
          el("span", { class: "grow" }, [
            el("strong", { text: humanizeWords(k) }),
            el("span", { class: "meta", text: "  " + String(memory[k]) }),
          ]),
        ]));
      });
      memCard.appendChild(memList);
      memCard.appendChild(el("p", { class: "note", text: "Ask the assistant to forget one to remove it." }));
    }
    root.appendChild(memCard);

    // Raw key/value settings still exist for anyone who wants them, but they are
    // not the thing a person is shown first.
    const prefs_raw = r.data.settings || {};
    const rawKeys = Object.keys(prefs_raw).filter(function (k) { return k.indexOf("ui:") !== 0; });
    const adv = el("details", { class: "advanced" }, [el("summary", { text: "Advanced: stored values" })]);
    const list = el("ul", { class: "items" });
    rawKeys.forEach(function (k) {
      const del = el("button", { class: "btn small danger", type: "button", text: "Delete" });
      del.addEventListener("click", async function () { await api("DELETE", "/api/settings/" + encodeURIComponent(k)); renderSettings(); });
      list.appendChild(el("li", null, [
        el("span", { class: "grow" }, [el("strong", { text: k }), el("span", { class: "meta", text: "  " + JSON.stringify(prefs_raw[k]) })]),
        del,
      ]));
    });
    if (!rawKeys.length) list.appendChild(el("li", { class: "note", text: "Nothing stored beyond the settings above." }));
    adv.appendChild(el("div", { class: "card" }, [list]));
    root.appendChild(adv);
  }

  // ---- navigation -------------------------------------------------------
  // One set of views, drawn twice: as a rail beside the content on a desk, and
  // as a bar under the thumb on a phone. Never both at once, never two rows.
  const VIEWS = [["home", "Home", "home"], ["thread", "Chat", "chat"], ["settings", "Settings", "settings"]];
  let currentView = "home";
  const renderers = { home: renderHome, settings: renderSettings };

  function buildNav() {
    const rail = $("railnav"), bar = $("tabbar");
    rail.textContent = ""; bar.textContent = "";
    VIEWS.forEach(function (v) {
      rail.appendChild(el("button", { class: "navitem", type: "button", "data-view": v[0],
        onclick: function () { selectTab(v[0]); } }, [icon(v[2]), v[1]]));
      bar.appendChild(el("button", { class: "tab", type: "button", "data-view": v[0],
        onclick: function () { selectTab(v[0]); } }, [icon(v[2], "i-lg"), el("span", { text: v[1] })]));
    });
    $("backBtn").appendChild(icon("chevronLeft"));
    $("backBtn").addEventListener("click", function () { settingsSection = null; renderSettings(); });
    $("mic").appendChild(icon("mic"));
    $("send").appendChild(icon("send"));
  }

  // The header title and the back arrow depend on where you are, so they are
  // set in one place rather than by whoever rendered last.
  function headerActions() {
    const box = $("headActions");
    box.textContent = "";
    if (currentView !== "home") return;
    box.appendChild(el("button", { class: "btn small", type: "button",
      onclick: function () { adderOpen = !adderOpen; renderHome(); headerActions(); } },
      [icon(adderOpen ? "x" : "plus", "i-sm"), adderOpen ? "Close" : "Add card"]));
  }
  function syncChrome() {
    const view = VIEWS.filter(function (v) { return v[0] === currentView; })[0];
    const section = currentView === "settings" && settingsSection ? sectionDef(settingsSection) : null;
    $("viewTitle").textContent = section ? section[1] : (view ? view[1] : "");
    $("backBtn").dataset.show = section ? "1" : "0";
    document.querySelectorAll("[data-view]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === currentView);
    });
    headerActions();
  }

  function selectTab(name) {
    currentView = name;
    document.querySelectorAll("main .panel").forEach(function (p) { p.classList.toggle("active", p.id === name); });
    $("composerBar").hidden = name !== "thread";
    if (name !== "home") stopClock();
    if (renderers[name]) renderers[name]();
    syncChrome();
    if (name === "thread") input.focus();
  }

  // ---- auth gate --------------------------------------------------------
  const gate = $("gate"), gateBody = $("gateBody");
  async function showApp(me) {
    signedOut = false;
    currentUser = (me && me.username) || null;
    dashCards = null; adderOpen = false; settingsSection = null; moduleCache = null;
    gate.classList.remove("active");
    $("shell").hidden = false;
    buildNav();
    if (me && me.username) { $("who").textContent = me.username; $("logout").hidden = false; }
    // Load the saved look and preferences before painting, so the first frame is
    // already the right theme and the right starting page.
    await loadDash();
    if (signedOut) return;
    selectTab(prefs.startPage === "thread" ? "thread" : "home");
    startAssistant();
    connect();
  }
  function showGate() { $("shell").hidden = true; gate.classList.add("active"); }
  function dropToLogin() {
    if (signedOut) return;
    signedOut = true;
    if (socket) { try { socket.close(); } catch (e) { /* gone */ } socket = null; }
    renderLogin();
    showGate();
  }
  function renderSetup() {
    $("gateTitle").textContent = "Create your account";
    gateBody.textContent = "";
    gateBody.appendChild(el("p", { class: "note", text: "This hub has no account yet. Create the first one, it becomes the owner. Afterwards, more accounts are added on the host with vahub user add." }));
    const user = el("input", { type: "text", placeholder: "username", autocomplete: "username" });
    const pass = el("input", { type: "password", placeholder: "password (8+ characters)", autocomplete: "new-password" });
    const confirm = el("input", { type: "password", placeholder: "confirm password", autocomplete: "new-password" });
    const err = el("div", { class: "err" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Create account" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      el("label", { class: "field" }, ["confirm password", confirm]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      if (pass.value !== confirm.value) { err.textContent = "The passwords do not match."; return; }
      btn.disabled = true;
      const r = await api("POST", "/api/setup", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) { boot(); return; }
      if (r.status === 409) { renderLogin("An account already exists. Sign in instead."); return; }
      err.textContent = (r.data && r.data.detail) || "Could not create the account.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  function renderLogin(message) {
    $("gateTitle").textContent = "Sign in";
    gateBody.textContent = "";
    const user = el("input", { type: "text", placeholder: "username", autocomplete: "username" });
    const pass = el("input", { type: "password", placeholder: "password", autocomplete: "current-password" });
    const err = el("div", { class: "err", text: message || "" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Sign in" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      const r = await api("POST", "/api/login", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) boot();
      else if (r.status === 429) err.textContent = "Too many attempts. Wait a few minutes.";
      else err.textContent = "Wrong username or password.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  $("logout").addEventListener("click", async function () {
    signedOut = true;
    if (socket) { try { socket.close(); } catch (e) { /* gone */ } socket = null; }
    await api("POST", "/api/logout");
    renderLogin();
    showGate();
  });

  async function boot() {
    const r = await api("GET", "/api/me");
    if (!r.ok) { dropToLogin(); return; }
    const me = r.data || {};
    if (me.auth === false || me.authenticated) { showApp(me); return; }
    if (me.setup_required) renderSetup(); else renderLogin();
    showGate();
  }

  applyAccent(DEFAULT_ACCENT);
  boot();
})();
</script>
</body>
</html>
