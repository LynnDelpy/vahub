<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="referrer" content="no-referrer" />
<title>Assistant</title>
<style nonce="__CSP_NONCE__">
  /*
   * The assistant, plus a signed-in owner's own things: a home dashboard of
   * cards they arrange, and one Settings tab that holds saved places, routines,
   * modules, preferences and appearance. It is not an operator console; module
   * stderr, the tool catalogue and the audit log are for whoever runs the
   * service, who has the CLI. Everything a module or the model produced is
   * inserted as text, never as markup.
   *
   * No external fonts, scripts or images, so it works on a network with no route
   * to the internet and leaks nothing to a third party. The accent colour and
   * light/dark choice are set by the owner and stored on the hub.
   */
  :root {
    color-scheme: light dark;
    /* warm, cozy light palette */
    --bg: #f6f1ea; --surface: #fffdfa; --surface-2: #f0e9df; --raised: #fffefb;
    --fg: #2a2621; --muted: #857b6c; --line: #e7ddd0; --line-soft: #efe7db;
    --theirs: #f0e9df; --mine-fg: #ffffff;
    --warn-bg: #fdf1dc; --warn-line: #d99a2b; --danger: #d1432c; --ok: #2f9e57;
    /* accent (overridden live from the owner's choice) */
    --accent: #ef6a3d; --accent-weak: rgba(239,106,61,.16); --accent-weaker: rgba(239,106,61,.09);
    --accent-fg: #ffffff;
    --radius: 20px; --radius-sm: 13px; --radius-xs: 9px;
    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 20px rgba(60,40,20,.06);
    --shadow-sm: 0 1px 2px rgba(60,40,20,.06);
  }
  /* warm charcoal dark palette, applied by system default or an explicit choice */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f; --surface: #201b16; --surface-2: #2a231d; --raised: #241e18;
      --fg: #efe7dc; --muted: #a99e8d; --line: #322a22; --line-soft: #2a231d;
      --theirs: #2a231d;
      --warn-bg: #2e2413; --warn-line: #b98a2f; --danger: #ef6a5a; --ok: #4bb273;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f; --surface: #201b16; --surface-2: #2a231d; --raised: #241e18;
    --fg: #efe7dc; --muted: #a99e8d; --line: #322a22; --line-soft: #2a231d;
    --theirs: #2a231d;
    --warn-bg: #2e2413; --warn-line: #b98a2f; --danger: #ef6a5a; --ok: #4bb273;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }

  /* ---- top bar ---- */
  header {
    position: sticky; top: 0; z-index: 5;
    padding: .6rem .9rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
    background: linear-gradient(100deg, var(--accent-weak), transparent 55%), var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header .brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; letter-spacing: .01em; }
  header .brand .dot { width: 1.35rem; height: 1.35rem; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-fg); font-size: .9rem; box-shadow: var(--shadow-sm); }
  header .brand h1 { font-size: 1.02rem; margin: 0; font-weight: 700; }
  nav { display: flex; gap: .25rem; background: var(--surface-2); padding: .22rem; border-radius: 999px; }
  nav button {
    font: inherit; font-size: .9rem; padding: .38rem .85rem; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--muted); display: flex; align-items: center; gap: .35rem;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { background: var(--raised); color: var(--fg); box-shadow: var(--shadow-sm); }
  header .spacer { flex: 1; }
  header .who { font-size: .82rem; color: var(--muted); }
  header .state { font-size: .78rem; color: var(--muted); }
  .linkbtn { font: inherit; font-size: .82rem; background: none; border: none; color: var(--accent); cursor: pointer; padding: .2rem .3rem; border-radius: 6px; }
  .linkbtn:hover { background: var(--accent-weaker); }

  main { flex: 1; overflow-y: auto; }
  .panel { display: none; padding: 1.1rem clamp(.8rem, 4vw, 1.4rem) 2.4rem; max-width: 62rem; width: 100%; margin: 0 auto; }
  .panel.active { display: block; }
  #thread.active { display: flex; flex-direction: column; gap: .7rem; max-width: 48rem; }

  h2 { font-size: 1.28rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.1rem; }
  .muted { color: var(--muted); }

  /* ---- chat ---- */
  .msg { padding: .6rem .9rem; border-radius: var(--radius-sm); max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow-sm); }
  .msg.mine { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 5px; }
  .msg.theirs { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .msg.problem { align-self: flex-start; background: transparent; color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
  .msg.thinking { color: var(--muted); font-style: italic; box-shadow: none; background: transparent; border: none; }
  .empty { margin: 3rem auto; text-align: center; color: var(--muted); max-width: 28rem; }
  .empty p { margin: .4rem 0; }
  .empty .examples { font-size: .9rem; }

  .approval { align-self: stretch; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--radius-sm); padding: .85rem .95rem; }
  .approval p { margin: 0 0 .7rem; }
  .approval .what { font-weight: 600; }
  .approval .args { margin: 0 0 .7rem; padding: .5rem .7rem; list-style: none; border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; background: var(--surface); }
  .approval .args li { overflow-wrap: anywhere; }
  .approval .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .approval button { font: inherit; padding: .45rem .95rem; border-radius: var(--radius-xs); border: 1px solid transparent; cursor: pointer; }
  .approval .yes { background: var(--danger); color: #fff; }
  .approval .no { background: transparent; border-color: var(--line); color: var(--fg); }
  .approval .expiry { font-size: .82rem; color: var(--muted); margin-left: auto; align-self: center; }

  footer { border-top: 1px solid var(--line); padding: .7rem .9rem 1rem; background: var(--surface); }
  .composer { display: flex; gap: .5rem; max-width: 48rem; margin: 0 auto; }
  .composer input[type=text] { flex: 1; font: inherit; padding: .7rem .9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
  .composer input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .composer button { font: inherit; padding: .7rem 1rem; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
  .composer .send { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .composer button[disabled] { opacity: .5; cursor: default; }
  .composer .mic.recording { background: var(--danger); color: #fff; border-color: transparent; }
  .hint { max-width: 48rem; margin: .5rem auto 0; font-size: .8rem; color: var(--muted); display: flex; gap: 1rem; }
  .hint label { cursor: pointer; }

  /* ---- generic controls ---- */
  input, textarea, select { font: inherit; padding: .55rem .65rem; border-radius: var(--radius-xs); border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 3rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
  .btn { font: inherit; padding: .55rem .95rem; border-radius: var(--radius-xs); cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; gap: .35rem; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: .3rem .6rem; font-size: .82rem; }
  .btn.danger { color: var(--danger); }
  .row-actions { margin-top: .9rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  .err { color: var(--danger); font-size: .85rem; min-height: 1.1em; }
  .note { font-size: .84rem; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .grid .full { grid-column: 1 / -1; }
  label.field { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; color: var(--muted); font-weight: 600; }
  .items { list-style: none; padding: 0; margin: 0; }
  .items li { display: flex; align-items: center; gap: .6rem; padding: .6rem 0; border-top: 1px solid var(--line-soft); }
  .items li:first-child { border-top: none; }
  .items li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .items .meta { color: var(--muted); font-size: .84rem; }

  /* ---- settings sub-navigation ---- */
  .subnav { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .subtab { font: inherit; font-size: .9rem; padding: .45rem .85rem; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .subtab:hover { color: var(--fg); }
  .subtab.active { background: var(--accent-weak); border-color: transparent; color: var(--fg); font-weight: 600; }

  /* module state badges and per-module config rows */
  .badge { font-size: .7rem; padding: .12rem .5rem; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .badge.ready { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.unconfigured, .badge.degraded, .badge.stopped { color: var(--warn-line); border-color: var(--warn-line); }
  .badge.failed { color: var(--danger); border-color: var(--danger); }
  .cfgrow { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
  .cfgrow .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; min-width: 9rem; overflow-wrap: anywhere; }
  .cfgrow input { flex: 1; min-width: 6rem; }
  .cfgrow .req { color: var(--danger); }
  .modhead { display: flex; align-items: center; gap: .55rem; }
  .modhead .spacer { flex: 1; }

  /* ---- home dashboard ---- */
  .home-head { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; }
  .home-head h2 { margin: 0; }
  .home-head .spacer { flex: 1; }
  .grid-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 1rem; align-items: start; }
  .widget { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .55rem .95rem 1rem; box-shadow: var(--shadow); }
  .widget.wide { grid-column: 1 / -1; }
  .widget.dragging { opacity: .55; outline: 2px dashed var(--accent); }
  .widget-head { display: flex; align-items: center; gap: .5rem; padding: .35rem 0 .5rem; }
  .widget-head .emoji { font-size: 1.05rem; }
  .widget-head h3 { margin: 0; font-size: .84rem; color: var(--fg); font-weight: 700; text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .widget-head .spacer { flex: 1; }
  .grip { cursor: grab; touch-action: none; background: transparent; border: none; color: var(--muted); font-size: 1rem; padding: .15rem .3rem; border-radius: 6px; line-height: 1; }
  .grip:hover { background: var(--surface-2); color: var(--fg); }
  .grip:active { cursor: grabbing; }
  .cardx { background: transparent; border: none; color: var(--muted); font-size: 1.15rem; line-height: 1; padding: .05rem .35rem; border-radius: 6px; cursor: pointer; }
  .cardx:hover { background: var(--accent-weaker); color: var(--danger); }
  .widget-body .big { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .widget-body ul { list-style: none; margin: .1rem 0 0; padding: 0; }
  .widget-body li { padding: .32rem 0; border-top: 1px solid var(--line-soft); overflow-wrap: anywhere; font-size: .92rem; }
  .widget-body li:first-child { border-top: none; }
  .tiles { display: flex; gap: 1.1rem; margin: .1rem 0 .3rem; flex-wrap: wrap; }
  .tiles .tile .n { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; display: block; letter-spacing: -.02em; }
  .tiles .tile .l { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .twoline strong { font-weight: 600; }
  .quickask { display: flex; gap: .4rem; }
  .quickask input { flex: 1; }

  .adder { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
  .adder-title { margin: 0 0 .7rem; font-size: 1rem; }
  .field-label { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: .8rem 0 .4rem; }
  .chiprow { display: flex; gap: .45rem; flex-wrap: wrap; }
  .chip { font: inherit; font-size: .86rem; padding: .35rem .7rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .adder-form { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .3rem; }
  .adder-form .full { grid-column: 1 / -1; }

  /* ---- appearance ---- */
  .swatches { display: flex; gap: .6rem; flex-wrap: wrap; margin: .3rem 0 .2rem; }
  .swatch { width: 2.3rem; height: 2.3rem; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; position: relative; }
  .swatch.active { border-color: var(--fg); }
  .swatch.active::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: .95rem; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .segmented { display: inline-flex; gap: .25rem; background: var(--surface-2); padding: .22rem; border-radius: 999px; }
  .segmented button { font: inherit; font-size: .86rem; padding: .35rem .8rem; border-radius: 999px; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  .segmented button.active { background: var(--raised); color: var(--fg); box-shadow: var(--shadow-sm); }

  /* ---- settings rows: a label, an explanation, and one control ---- */
  .setrow { display: flex; align-items: center; gap: 1rem; padding: .85rem 0; border-top: 1px solid var(--line-soft); }
  .setrow:first-child { border-top: none; }
  .setrow .text { flex: 1; min-width: 0; }
  .setrow .text .name { font-weight: 600; }
  .setrow .text .why { color: var(--muted); font-size: .85rem; }

  /* an accessible switch built from a checkbox, so it is keyboard operable */
  .switch { position: relative; width: 3rem; height: 1.75rem; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); transition: background .18s ease, border-color .18s ease; pointer-events: none; }
  .switch .knob { position: absolute; top: 50%; left: .22rem; width: 1.3rem; height: 1.3rem; margin-top: -.65rem; border-radius: 50%; background: var(--raised); box-shadow: var(--shadow-sm); transition: transform .18s ease; pointer-events: none; }
  .switch input:checked ~ .track { background: var(--accent); border-color: transparent; }
  .switch input:checked ~ .knob { transform: translateX(1.24rem); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- friendly empty states: one line and a way to fix it ---- */
  .blank { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; color: var(--muted); font-size: .9rem; padding: .2rem 0; }
  .blank .btn { margin-left: auto; }

  /* ---- schedule builder ---- */
  .builder { display: grid; gap: .9rem; }
  .when-row { display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap; }
  .when-row label.field { flex: 1; min-width: 9rem; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .6rem; }
  .fields .hint { font-size: .78rem; color: var(--muted); font-weight: 400; }
  details.advanced { margin-top: .3rem; }
  details.advanced summary { cursor: pointer; color: var(--muted); font-size: .86rem; padding: .3rem 0; }
  .sched { display: flex; align-items: center; gap: .6rem; padding: .7rem 0; border-top: 1px solid var(--line-soft); }
  .sched:first-child { border-top: none; }
  .sched .grow { flex: 1; min-width: 0; }
  .sched .when { font-weight: 600; }
  .sched .what { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }

  /* ---- dragging: a lifted card, a gap where it lands, neighbours sliding ---- */
  .widget { transition: box-shadow .18s ease; }
  .widget.lifted {
    position: fixed; margin: 0; z-index: 50; pointer-events: none; cursor: grabbing;
    box-shadow: 0 18px 45px rgba(40,25,10,.28), 0 3px 10px rgba(40,25,10,.18);
    transform: rotate(.6deg) scale(1.02); transition: none; will-change: transform, top, left;
  }
  .widget.settling { transition: top .2s cubic-bezier(.2,.9,.3,1), left .2s cubic-bezier(.2,.9,.3,1), transform .2s ease, box-shadow .2s ease; }
  .drop-slot { border: 2px dashed var(--accent); border-radius: var(--radius); background: var(--accent-weaker); }
  .grid-wrap.dragging .widget:not(.lifted) { transition: transform .22s cubic-bezier(.2,.9,.3,1); }
  body.dragging, body.dragging * { user-select: none; -webkit-user-select: none; }
  @media (prefers-reduced-motion: reduce) {
    .grid-wrap.dragging .widget:not(.lifted), .widget.settling, .switch .track, .switch .knob { transition: none; }
  }

  /* login / setup overlay */
  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: linear-gradient(160deg, var(--accent-weak), var(--bg) 60%); padding: 1rem; }
  #gate.active { display: flex; }
  #gate .box { width: 100%; max-width: 23rem; }
  #gate h1 { text-align: center; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <header id="topbar" hidden>
    <span class="brand"><span class="dot">◆</span><h1>vahub</h1></span>
    <nav id="nav">
      <button data-tab="home" class="active" type="button">🏠 Home</button>
      <button data-tab="thread" type="button">💬 Chat</button>
      <button data-tab="settings" type="button">⚙️ Settings</button>
    </nav>
    <span class="spacer"></span>
    <span class="state" id="state" role="status" aria-live="polite"></span>
    <span class="who" id="who"></span>
    <button class="linkbtn" id="logout" type="button" hidden>sign out</button>
  </header>

  <main>
    <section class="panel active" id="home" aria-label="Home"></section>
    <div class="panel" id="thread" aria-live="polite">
      <div class="empty" id="empty">
        <p>Ask for something.</p>
        <p class="examples">"what time is it in Tokyo?"<br />"always show me departures from Zürich HB"</p>
      </div>
    </div>
    <section class="panel" id="settings" aria-label="Settings"></section>
  </main>

  <footer id="composerBar" hidden>
    <div class="composer">
      <label class="visually-hidden" for="input">Message</label>
      <input id="input" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Ask something, or say “show me…”" />
      <button id="mic" class="mic" type="button" title="Speak" aria-label="Speak">Speak</button>
      <button id="send" class="send" type="button">Send</button>
    </div>
    <div class="hint">
      <label><input type="checkbox" id="readAloud" checked /> read replies aloud</label>
      <span id="voiceNote"></span>
    </div>
  </footer>

  <div id="gate">
    <div class="box card">
      <h1 id="gateTitle">Sign in</h1>
      <div id="gateBody"></div>
    </div>
  </div>

<script nonce="__CSP_NONCE__">
(function () {
  "use strict";

  // ---- tiny safe DOM helper --------------------------------------------
  // Children are appended as text nodes or elements; nothing is ever set as
  // innerHTML, so module- and model-supplied strings cannot become markup.
  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === "class") node.className = props[k];
        else if (k === "text") node.textContent = props[k];
        else if (k === "type") node.type = props[k];
        else if (k === "hidden") node.hidden = !!props[k];
        else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), props[k]);
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  async function api(method, path, body) {
    const opts = { method: method, headers: {} };
    if (body !== undefined) {
      opts.headers["content-type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    let r;
    try { r = await fetch(path, opts); }
    catch (e) { return { ok: false, status: 0, data: {} }; }   // network / offline
    let data = {};
    try { data = await r.json(); } catch (e) { /* empty body */ }
    return { ok: r.ok, status: r.status, data: data };
  }

  // A guarded GET returning 401 means the session expired mid-use. Send the user
  // to the login screen instead of rendering a misleading empty panel/widget.
  function reauthed(r) {
    if (r && r.status === 401) { dropToLogin(); return true; }
    return false;
  }

  const $ = function (id) { return document.getElementById(id); };
  const thread = $("thread"), empty = $("empty"), input = $("input");
  const sendBtn = $("send"), micBtn = $("mic"), readBox = $("readAloud");
  const stateEl = $("state"), voiceNote = $("voiceNote");

  let sessionId = null;
  let config = { stt_provider: "browser", tts_provider: "browser" };
  const shown = new Set();
  let assistantStarted = false;

  // ---- appearance: accent colour and theme -----------------------------
  const ACCENTS = {
    coral:  "#ef6a3d", amber: "#e29a2b", rose: "#e5508a", violet: "#8b5cf6",
    indigo: "#5b6ef5", blue:  "#3b82f6", teal: "#12a594", green: "#3ea662",
  };
  const DEFAULT_ACCENT = "coral";
  let currentAccent = DEFAULT_ACCENT;
  let currentTheme = "auto";   // auto | light | dark

  function hexToRgba(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }
  function applyAccent(name) {
    const hex = ACCENTS[name] || ACCENTS[DEFAULT_ACCENT];
    currentAccent = ACCENTS[name] ? name : DEFAULT_ACCENT;
    const root = document.documentElement.style;
    root.setProperty("--accent", hex);
    root.setProperty("--accent-weak", hexToRgba(hex, 0.16));
    root.setProperty("--accent-weaker", hexToRgba(hex, 0.09));
  }
  function applyTheme(name) {
    currentTheme = (name === "light" || name === "dark") ? name : "auto";
    if (currentTheme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", currentTheme);
  }

  function atBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60; }
  function scroll(force) { if (force || atBottom()) thread.scrollTop = thread.scrollHeight; }
  function clearEmpty() { if (empty && empty.parentNode) empty.remove(); }
  function bubble(text, kind) {
    clearEmpty();
    const stick = atBottom();
    const node = el("div", { class: "msg " + kind, text: text });
    thread.appendChild(node);
    scroll(stick);
    return node;
  }
  function setState(text) { stateEl.textContent = text || ""; }

  // ---- speaking ---------------------------------------------------------
  function speak(text) {
    if (!text || !readBox.checked) return;
    if (config.tts_provider !== "browser") return;
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  // ---- approvals --------------------------------------------------------
  function describe(p) {
    const what = (p.module || "") + "." + (p.tool || "");
    return p.reason ? what + " (" + p.reason + ")" : what;
  }
  function argLines(p) {
    const args = p && p.args;
    if (!args || typeof args !== "object") return [];
    return Object.keys(args).map(function (k) {
      let v = args[k];
      if (typeof v !== "string") v = JSON.stringify(v);
      if (v.length > 200) v = v.slice(0, 200) + "…";
      return k + ": " + v;
    });
  }
  function showApproval(p) {
    const id = p.pending_id || p.id;
    if (!id || shown.has(id)) return;
    shown.add(id);
    clearEmpty();

    const card = el("div", { class: "approval" });
    card.appendChild(el("p", null, [
      el("span", { text: "Needs your approval: " }),
      el("span", { class: "what", text: describe(p) }),
    ]));
    const rows = argLines(p);
    if (rows.length) {
      card.appendChild(el("ul", { class: "args" }, rows.map(function (t) { return el("li", { text: t }); })));
    }

    const yes = el("button", { class: "yes", type: "button", text: "Approve" });
    const no = el("button", { class: "no", type: "button", text: "Dismiss" });
    const expiry = el("span", { class: "expiry" });
    card.appendChild(el("div", { class: "row" }, [yes, no, expiry]));
    thread.appendChild(card);
    scroll(true);

    let countdown = null;
    const expiresAt = p.expires_at || (p.ttl_s ? Date.now() / 1000 + p.ttl_s : null);
    const stopCountdown = function () { if (countdown) { clearInterval(countdown); countdown = null; } };
    if (expiresAt) {
      const tick = function () {
        const left = Math.round(expiresAt - Date.now() / 1000);
        if (left <= 0) { stopCountdown(); card.remove(); bubble("That approval expired. Ask again if you still want it.", "theirs"); }
        else expiry.textContent = left + "s left";
      };
      tick();
      countdown = setInterval(tick, 1000);
    }
    const finish = function (text, kind) { stopCountdown(); card.remove(); if (text) bubble(text, kind || "theirs"); };
    yes.addEventListener("click", async function () {
      stopCountdown();
      yes.disabled = no.disabled = true;
      const r = await api("POST", "/api/confirm/" + encodeURIComponent(id));
      if (r.ok && r.data.ok) finish("Done.");
      else finish("It did not go through: " + (r.data.detail || r.data.error || r.status), "problem");
    });
    no.addEventListener("click", function () { finish("Left alone."); });
  }
  async function loadPending() {
    const r = await api("GET", "/api/pending");
    if (r.ok && Array.isArray(r.data)) r.data.forEach(showApproval);
  }

  // ---- live approvals over the socket -----------------------------------
  let wsBackoff = 1000;
  let signedOut = false;
  let socket = null;
  let reconnectTimer = null;
  function connect() {
    if (signedOut) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (socket) { try { socket.close(); } catch (e) { /* already gone */ } socket = null; }
    let ws;
    try {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws/events");
    } catch (e) { return; }
    socket = ws;
    ws.onopen = function () { setState(""); wsBackoff = 1000; loadPending(); };
    ws.onclose = function () {
      if (ws !== socket || signedOut) return;
      setState("reconnecting");
      reconnectTimer = setTimeout(connect, wsBackoff);
      wsBackoff = Math.min(wsBackoff * 2, 30000);
    };
    ws.onmessage = function (ev) {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg && msg.type === "confirm" && msg.data) showApproval(msg.data);
    };
  }

  // ---- sending ----------------------------------------------------------
  async function send(text) {
    const message = (text !== undefined ? text : input.value).trim();
    if (!message) return;
    input.value = "";
    sendBtn.disabled = true;
    bubble(message, "mine");
    const pending = bubble("...", "theirs thinking");
    const r = await api("POST", "/api/chat", { message: message, session_id: sessionId });
    pending.remove();
    if (!r.ok) {
      if (r.status === 401) { sendBtn.disabled = false; dropToLogin(); return; }
      bubble(r.data.detail || ("Something went wrong (" + r.status + ")."), "problem");
    } else {
      sessionId = r.data.session_id || sessionId;
      if (r.data.reply) { bubble(r.data.reply, "theirs"); speak(r.data.reply); }
      loadPending();
      // A turn may have pinned or removed a card ("show me departures from here").
      dashDirty = true;
    }
    sendBtn.disabled = false;
    input.focus();
  }
  sendBtn.addEventListener("click", function () { send(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ---- microphone -------------------------------------------------------
  let recognizer = null, recorder = null, recording = false;
  function setRecording(on) { recording = on; micBtn.classList.toggle("recording", on); micBtn.textContent = on ? "Stop" : "Speak"; }
  function useBrowserSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { micBtn.disabled = true; voiceNote.textContent = "Speaking needs Chrome or Edge. Typing works everywhere."; return; }
    recognizer = new SR();
    recognizer.lang = navigator.language || "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = function (e) { send(e.results[0][0].transcript); };
    recognizer.onend = function () { setRecording(false); };
    recognizer.onerror = function (e) { setRecording(false); if (e.error !== "aborted") voiceNote.textContent = "Microphone: " + e.error; };
    micBtn.addEventListener("click", function () {
      if (recording) { recognizer.stop(); return; }
      setRecording(true);
      try { recognizer.start(); } catch (e) { setRecording(false); }
    });
  }
  function useServerSpeech() {
    micBtn.addEventListener("click", async function () {
      if (recording) { if (recorder) recorder.stop(); return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { voiceNote.textContent = "Microphone unavailable."; return; }
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = async function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        setRecording(false);
        const form = new FormData();
        form.append("audio", new Blob(chunks, { type: recorder.mimeType || "audio/webm" }), "audio.webm");
        if (sessionId) form.append("session_id", sessionId);
        const thinking = bubble("...", "theirs thinking");
        try {
          const resp = await fetch("/api/voice", { method: "POST", body: form });
          const data = await resp.json().catch(function () { return {}; });
          thinking.remove();
          if (resp.status === 401) { dropToLogin(); return; }
          if (data.ok === false) { bubble(data.detail || data.error || "That did not work.", "problem"); return; }
          if (data.transcript) bubble(data.transcript, "mine");
          sessionId = data.session_id || sessionId;
          if (data.reply) bubble(data.reply, "theirs");
          if (data.audio && readBox.checked) new Audio("data:" + (data.audio_mime || "audio/mpeg") + ";base64," + data.audio).play();
          else speak(data.reply || "");
          loadPending();
          dashDirty = true;
        } catch (e) { thinking.remove(); bubble("Could not send the recording.", "problem"); }
      };
      recorder.start();
      setRecording(true);
    });
  }

  function startAssistant() {
    if (assistantStarted) return;
    assistantStarted = true;
    (async function () {
      const r = await api("GET", "/api/client-config");
      if (r.ok) config = r.data;
      if (config.stt_provider === "openai_compat") useServerSpeech();
      else useBrowserSpeech();
    })();
  }

  // ======================================================================
  //  SHARED: preferences, small controls, and plain language
  // ======================================================================
  // Preferences are only worth offering if they do something, so every one of
  // these changes the app you are looking at. They live in one setting.
  const PREF_DEFAULTS = { clock24: true, clockSeconds: false, startPage: "home", readAloud: true, motion: true };
  let prefs = Object.assign({}, PREF_DEFAULTS);

  function adoptPrefs(value) {
    prefs = Object.assign({}, PREF_DEFAULTS);
    if (value && typeof value === "object") {
      Object.keys(PREF_DEFAULTS).forEach(function (k) {
        if (typeof value[k] === typeof PREF_DEFAULTS[k]) prefs[k] = value[k];
      });
    }
    readBox.checked = !!prefs.readAloud;
  }
  async function savePrefs() { await api("PUT", "/api/settings/" + encodeURIComponent("ui:prefs"), { value: prefs }); }
  function animate() {
    if (!prefs.motion) return false;
    return !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  // Flipping the composer's own toggle is the same choice, so it is remembered.
  readBox.addEventListener("change", function () { prefs.readAloud = readBox.checked; savePrefs(); });

  // ---- small controls ---------------------------------------------------
  function switchRow(name, why, checked, onchange) {
    const box = el("input", { type: "checkbox", "aria-label": name });
    box.checked = !!checked;
    box.addEventListener("change", function () { onchange(box.checked); });
    return el("div", { class: "setrow" }, [
      el("div", { class: "text" }, [el("div", { class: "name", text: name }), why ? el("div", { class: "why", text: why }) : null]),
      el("span", { class: "switch" }, [box, el("span", { class: "track" }), el("span", { class: "knob" })]),
    ]);
  }
  function segmentedRow(name, why, options, current, onchange) {
    const seg = el("div", { class: "segmented" });
    options.forEach(function (o) {
      const b = el("button", { class: (current === o[0] ? "active" : ""), type: "button", text: o[1] });
      b.addEventListener("click", function () { onchange(o[0]); });
      seg.appendChild(b);
    });
    return el("div", { class: "setrow" }, [
      el("div", { class: "text" }, [el("div", { class: "name", text: name }), why ? el("div", { class: "why", text: why }) : null]),
      seg,
    ]);
  }
  // An empty list should offer the way out of being empty, not just say it is empty.
  function blank(parent, text, actionLabel, onclick) {
    const row = el("div", { class: "blank" }, [el("span", { text: text })]);
    if (actionLabel) row.appendChild(el("button", { class: "btn small", type: "button", text: actionLabel, onclick: onclick }));
    parent.appendChild(row);
  }

  // ---- plain words ------------------------------------------------------
  const WORDS = {
    URL: "URL", URLS: "URLs", API: "API", SSL: "SSL", ID: "ID", IMAP: "IMAP", ICS: "Calendar feed",
    TZ: "Time zone", HA: "Home Assistant", NTFY: "ntfy", MR: "MR", RSS: "RSS", HB: "HB",
  };
  function humanizeWords(raw) {
    const parts = String(raw || "").split(/[_\s]+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      const up = parts[i].toUpperCase();
      if (up === "S" && out.length && /timeout/i.test(out[out.length - 1])) { out.push("(seconds)"); continue; }
      if (WORDS[up]) { out.push(WORDS[up]); continue; }
      const lower = parts[i].toLowerCase();
      out.push(out.length ? lower : lower.charAt(0).toUpperCase() + lower.slice(1));
    }
    const text = out.join(" ");
    return text.charAt(0).toUpperCase() + text.slice(1);
  }
  // Apps have names people already know how to spell.
  const APP_NAMES = {
    github: "GitHub", gitlab: "GitLab", homeassistant: "Home Assistant", rss: "News feeds",
    homelab: "Homelab", obsidian: "Obsidian", email: "Email", calendar: "Calendar",
    transit: "Transit", weather: "Weather", calculator: "Calculator", notify: "Notifications",
    time: "Time", core: "Assistant",
  };
  function appName(name) { return APP_NAMES[name] || humanizeWords(name); }
  function humanizeKey(moduleName, key) {
    const prefix = String(moduleName || "").toUpperCase().replace(/-/g, "_") + "_";
    const trimmed = String(key).indexOf(prefix) === 0 ? String(key).slice(prefix.length) : String(key);
    return humanizeWords(trimmed);
  }
  function firstSentence(text, cap) {
    // A tool's description is a docstring: its first line is the summary and the
    // rest documents arguments. Only the summary belongs in a label.
    const s = String(text || "").trim();
    if (!s) return "";
    const line = s.split(/\r?\n/)[0].trim();
    const dot = line.indexOf(". ");
    const one = dot > 0 ? line.slice(0, dot + 1) : line;
    return one.length > (cap || 90) ? one.slice(0, cap || 90).trim() + "…" : one;
  }

  // ---- fields built from a tool's own schema (never raw JSON) -----------
  function fieldsFromSchema(schema) {
    const props = (schema && schema.properties) || {};
    const required = (schema && schema.required) || [];
    const wrap = el("div", { class: "fields" });
    const controls = [];
    Object.keys(props).forEach(function (key) {
      const spec = props[key] || {};
      const isReq = required.indexOf(key) !== -1;
      let input;
      if (Array.isArray(spec.enum)) {
        input = el("select");
        if (!isReq) input.appendChild(el("option", { value: "", text: "—" }));
        spec.enum.forEach(function (v) { input.appendChild(el("option", { value: String(v), text: String(v) })); });
      } else if (spec.type === "boolean") {
        input = el("input", { type: "checkbox" });
        if (spec.default) input.checked = true;
      } else if (spec.type === "number" || spec.type === "integer") {
        input = el("input", { type: "number", step: spec.type === "integer" ? "1" : "any" });
        if (spec.default !== undefined) input.value = String(spec.default);
      } else {
        input = el("input", { type: "text" });
        if (spec.default !== undefined) input.value = String(spec.default);
      }
      wrap.appendChild(el("label", { class: "field" }, [
        humanizeWords(key) + (isReq ? " *" : ""),
        input,
        spec.description ? el("span", { class: "hint", text: firstSentence(spec.description, 80) }) : null,
      ]));
      controls.push({ key: key, input: input, spec: spec, required: isReq });
    });
    return {
      node: wrap,
      empty: controls.length === 0,
      missing: function () {
        return controls.filter(function (c) {
          return c.required && c.spec.type !== "boolean" && !String(c.input.value || "").trim();
        }).map(function (c) { return humanizeWords(c.key); });
      },
      values: function () {
        const out = {};
        controls.forEach(function (c) {
          if (c.spec.type === "boolean") { out[c.key] = !!c.input.checked; return; }
          const raw = String(c.input.value || "").trim();
          if (!raw) return;                       // an untouched optional field is left out
          out[c.key] = (c.spec.type === "number" || c.spec.type === "integer") ? Number(raw) : raw;
        });
        return out;
      },
    };
  }

  // ---- when things run, in words instead of cron -----------------------
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const REPEATS = [
    ["daily", "Every day"], ["weekdays", "Every weekday"], ["weekend", "Every weekend day"],
    ["weekly", "Once a week"], ["monthly", "Once a month"], ["hourly", "Every hour"],
  ];
  function cronFrom(repeat, hhmm, weekday, monthday) {
    const bits = String(hhmm || "08:00").split(":");
    const h = String(parseInt(bits[0], 10) || 0);
    const m = String(parseInt(bits[1], 10) || 0);
    if (repeat === "hourly") return m + " * * * *";
    if (repeat === "weekdays") return m + " " + h + " * * 1-5";
    if (repeat === "weekend") return m + " " + h + " * * 0,6";
    if (repeat === "weekly") return m + " " + h + " * * " + String(weekday);
    if (repeat === "monthly") return m + " " + h + " " + String(monthday) + " * *";
    return m + " " + h + " * * *";
  }
  function clockText(h, m) {
    const hh = parseInt(h, 10), mm = parseInt(m, 10);
    if (isNaN(hh) || isNaN(mm)) return null;
    const pad = function (n) { return (n < 10 ? "0" : "") + n; };
    if (prefs.clock24) return pad(hh) + ":" + pad(mm);
    const suffix = hh < 12 ? "am" : "pm";
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    return h12 + ":" + pad(mm) + " " + suffix;
  }
  function describeCron(cron) {
    const f = String(cron || "").trim().split(/\s+/);
    if (f.length !== 5) return String(cron || "");
    const m = f[0], h = f[1], dom = f[2], mon = f[3], dow = f[4];
    if (h === "*" && /^\d+$/.test(m)) return "Every hour at " + (m.length < 2 ? "0" + m : m) + " past";
    const at = clockText(h, m);
    if (at === null || mon !== "*") return String(cron);      // something unusual: show it as written
    if (dom === "*" && dow === "1-5") return "Every weekday at " + at;
    if (dom === "*" && (dow === "0,6" || dow === "6,0")) return "Every weekend day at " + at;
    if (dom === "*" && /^\d$/.test(dow)) return "Every " + DAYS[Number(dow)] + " at " + at;
    if (dom === "*" && dow === "*") return "Every day at " + at;
    if (/^\d+$/.test(dom) && dow === "*") return "Monthly on day " + dom + " at " + at;
    return String(cron);
  }

  // ======================================================================
  //  HOME DASHBOARD
  // ======================================================================
  let currentUser = null;
  let dashCards = null;      // array of card entries; null until loaded
  let dashDirty = false;     // a chat/voice turn may have changed the cards
  let adderOpen = false;
  let clockTimer = null;

  const EMOJI = {
    clock: "⏰", quickask: "💬", places: "📍", routines: "🔁", notes: "🧠",
    github: "🐙", gitlab: "🦊", email: "✉️", transit: "🚆", weather: "🌤️",
    rss: "📰", calendar: "📅", obsidian: "🗒️", homelab: "🖥️", homeassistant: "💡",
    core: "⭐", calculator: "🧮", notify: "🔔", time: "🕰️", _default: "📌",
  };
  function emojiFor(entry) {
    if (entry.type === "widget") return EMOJI[entry.widget] || EMOJI._default;
    return EMOJI[entry.module] || EMOJI._default;
  }

  function twoLine(primary, secondary) {
    return el("span", { class: "twoline" }, [
      el("strong", { text: primary || "" }),
      el("span", { class: "muted", text: secondary ? "  " + secondary : "" }),
    ]);
  }

  // A card backed by a module's read `summary` tool: fixed tiles + a recent list.
  function serviceWidget(module, tiles, line) {
    return async function (body) {
      body.appendChild(el("div", { class: "muted", text: "Loading…" }));
      const r = await api("POST", "/api/tools/" + module + "/summary", { args: {} });
      body.textContent = "";
      if (reauthed(r)) return;
      if (!r.ok || !r.data.ok) { body.appendChild(el("div", { class: "muted", text: toolError(r) })); return; }
      const p = r.data.result || {};
      if (p.configured === false) { body.appendChild(el("div", { class: "muted", text: "Add its token in Settings › Modules." })); return; }
      if (p.error) { body.appendChild(el("div", { class: "muted", text: String(p.error) })); return; }
      const row = el("div", { class: "tiles" });
      tiles.forEach(function (t) {
        row.appendChild(el("div", { class: "tile" }, [
          el("span", { class: "n", text: (p[t.key] == null ? "–" : String(p[t.key])) }),
          el("span", { class: "l", text: t.label }),
        ]));
      });
      body.appendChild(row);
      const recent = p.recent || [];
      if (recent.length) {
        const ul = el("ul");
        recent.slice(0, 5).forEach(function (item) { ul.appendChild(el("li", null, [line(item)])); });
        body.appendChild(ul);
      }
    };
  }

  function toolError(r) {
    const why = (r.data && r.data.error) || "";
    if (why === "unknown_module") return "Not installed. Add it in Settings › Modules.";
    if (why === "module_not_ready" || why === "not_readonly") return "Set it up in Settings › Modules.";
    return "Unavailable right now.";
  }

  // A pinned card that shows any read tool's result, rendered generically.
  function itemPrimary(it) {
    if (it == null) return "";
    if (typeof it !== "object") return String(it);
    const line = it.line || it.route || it.number;
    const dest = it.to || it.destination || it.headsign;
    if (line && dest) return String(line) + " → " + String(dest);
    const keys = ["title", "name", "summary", "subject", "label", "to", "destination", "from", "station", "headsign", "key", "query"];
    for (let i = 0; i < keys.length; i++) if (it[keys[i]]) return String(it[keys[i]]);
    return JSON.stringify(it).slice(0, 90);
  }
  function itemSecondary(it) {
    if (it == null || typeof it !== "object") return "";
    const keys = ["departure", "time", "at", "when", "platform", "published", "date", "repo", "project", "subject", "address", "value"];
    const bits = [];
    for (let i = 0; i < keys.length && bits.length < 2; i++) {
      if (it[keys[i]] != null && it[keys[i]] !== "") bits.push(String(it[keys[i]]));
    }
    return bits.join("  ·  ");
  }
  function genericRender(body, result) {
    if (!result || typeof result !== "object") { body.appendChild(el("div", { class: "muted", text: "No data." })); return; }
    if (result.configured === false) { body.appendChild(el("div", { class: "muted", text: "Configure this module in Settings › Modules." })); return; }
    if (result.error) { body.appendChild(el("div", { class: "muted", text: String(result.error) })); return; }
    const tiles = [];
    let arr = null;
    Object.keys(result).forEach(function (k) {
      const v = result[k];
      if (typeof v === "number") tiles.push({ k: k, v: v });
      else if (!arr && Array.isArray(v) && v.length) arr = v;
    });
    if (tiles.length) {
      const row = el("div", { class: "tiles" });
      tiles.slice(0, 4).forEach(function (t) {
        row.appendChild(el("div", { class: "tile" }, [
          el("span", { class: "n", text: String(t.v) }),
          el("span", { class: "l", text: t.k.replace(/_/g, " ") }),
        ]));
      });
      body.appendChild(row);
    }
    if (arr) {
      const ul = el("ul");
      arr.slice(0, 6).forEach(function (item) { ul.appendChild(el("li", null, [twoLine(itemPrimary(item), itemSecondary(item))])); });
      body.appendChild(ul);
    } else if (!tiles.length) {
      body.appendChild(el("div", { class: "muted", text: "Nothing to show right now." }));
    }
  }
  function toolCardRender(card) {
    return async function (body) {
      body.appendChild(el("div", { class: "muted", text: "Loading…" }));
      const r = await api("POST", "/api/tools/" + encodeURIComponent(card.module) + "/" + encodeURIComponent(card.tool), { args: card.args || {} });
      body.textContent = "";
      if (reauthed(r)) return;
      if (!r.ok || !r.data.ok) { body.appendChild(el("div", { class: "muted", text: toolError(r) })); return; }
      genericRender(body, r.data.result || {});
    };
  }

  const WIDGETS = {
    clock:    { title: "Clock", render: renderClock },
    quickask: { title: "Quick ask", wide: true, render: renderQuickAsk },
    places:   { title: "Saved places", render: renderPlacesWidget },
    routines: { title: "Upcoming routines", render: renderRoutinesWidget },
    notes:    { title: "Assistant remembers", render: renderNotesWidget },
    github:   { title: "GitHub", render: serviceWidget("github",
      [{ key: "notifications", label: "Inbox" }, { key: "review_requests", label: "Reviews" }, { key: "assigned_issues", label: "Issues" }],
      function (it) { return twoLine(it.title, it.repo); }) },
    gitlab:   { title: "GitLab", render: serviceWidget("gitlab",
      [{ key: "todos", label: "To-dos" }, { key: "assigned_merge_requests", label: "MRs" }, { key: "assigned_issues", label: "Issues" }],
      function (it) { return twoLine(it.title, it.project); }) },
    email:    { title: "Email", render: serviceWidget("email",
      [{ key: "unread", label: "Unread" }, { key: "total", label: "Total" }],
      function (it) { return twoLine(it.from, it.subject); }) },
  };
  function defaultDash() {
    return [
      { id: "w:clock", type: "widget", widget: "clock" },
      { id: "w:quickask", type: "widget", widget: "quickask" },
      { id: "w:places", type: "widget", widget: "places" },
      { id: "w:routines", type: "widget", widget: "routines" },
    ];
  }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }

  async function loadDash() {
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const settings = (r.ok && r.data && r.data.settings) || {};
    // apply the owner's appearance and preferences while we have them in hand
    if (settings["ui:accent"]) applyAccent(settings["ui:accent"]);
    if (settings["ui:theme"]) applyTheme(settings["ui:theme"]);
    adoptPrefs(settings["ui:prefs"]);
    let cards = settings["ui:dashboard"];
    if (!Array.isArray(cards)) {
      const old = settings["ui:layout:" + (currentUser || "_")];
      if (Array.isArray(old) && old.length) {
        cards = old.filter(function (k) { return WIDGETS[k]; }).map(function (k) { return { id: "w:" + k, type: "widget", widget: k }; });
      } else {
        cards = defaultDash();
      }
    }
    dashCards = cards.filter(function (e) {
      if (!e || typeof e !== "object") return false;
      if (e.type === "widget") return !!WIDGETS[e.widget];
      return e.type === "tool" && !!e.module && !!e.tool;
    }).map(function (e) {
      if (!e.id) e.id = e.type === "widget" ? ("w:" + e.widget) : (e.module + "." + e.tool);
      if (e.type === "tool" && !e.args) e.args = {};
      return e;
    });
    if (!dashCards.length) dashCards = defaultDash();
  }
  async function saveDash() {
    await api("PUT", "/api/settings/" + encodeURIComponent("ui:dashboard"), { value: dashCards });
  }

  function hashArgs(args) {
    const s = JSON.stringify(args);
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(16).slice(0, 8);
  }
  function toolCardTitle(module, tool, args) {
    const words = tool.replace(/_/g, " ");
    const label = words.charAt(0).toUpperCase() + words.slice(1);
    const keys = ["station", "from", "query", "name", "location", "city", "q"];
    for (let i = 0; i < keys.length; i++) {
      if (typeof args[keys[i]] === "string" && args[keys[i]].trim()) return label + " · " + args[keys[i]].trim();
    }
    return label;
  }

  function addWidget(key) {
    if (dashCards.some(function (e) { return e.type === "widget" && e.widget === key; })) return;
    dashCards.push({ id: "w:" + key, type: "widget", widget: key });
    adderOpen = false; saveDash(); renderHome();
  }
  function addToolCard(module, tool, args, title) {
    const id = module + "." + tool + (Object.keys(args).length ? ":" + hashArgs(args) : "");
    dashCards = dashCards.filter(function (e) { return e.id !== id; });
    dashCards.push({ id: id, type: "tool", module: module, tool: tool, args: args, title: title || toolCardTitle(module, tool, args) });
    adderOpen = false; saveDash(); renderHome();
  }
  function removeCard(id) {
    dashCards = dashCards.filter(function (e) { return e.id !== id; });
    saveDash(); renderHome();
  }

  // ---- drag to reorder --------------------------------------------------
  // The card you hold is lifted out of the grid and follows the pointer, a
  // dashed slot shows where it will land, and the cards it displaces slide out
  // of the way (measure, move, invert, play). Dragging only starts after a few
  // pixels of movement, so a tap on the handle is still just a tap.
  const DRAG_THRESHOLD = 4;

  function slideNeighbours(grid, skip, before) {
    if (!animate()) return;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === skip || !before.has(c)) return;
      const now = c.getBoundingClientRect();
      const was = before.get(c);
      const dx = was.left - now.left, dy = was.top - now.top;
      if (!dx && !dy) return;
      c.style.transition = "none";
      c.style.transform = "translate(" + dx + "px," + dy + "px)";
      requestAnimationFrame(function () {
        c.style.transition = "";
        c.style.transform = "";
      });
    });
  }
  function positions(grid) {
    const map = new Map();
    Array.prototype.forEach.call(grid.children, function (c) { map.set(c, c.getBoundingClientRect()); });
    return map;
  }
  function nearestCard(grid, exclude, x, y) {
    let best = null, bd = Infinity;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === exclude || !c.dataset || !c.dataset.id) return;
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
      if (d < bd) { bd = d; best = c; }
    });
    return best;
  }
  function commitOrder(grid) {
    const order = Array.prototype.map.call(grid.children, function (c) { return c.dataset.id; }).filter(Boolean);
    const byId = {};
    dashCards.forEach(function (e) { byId[e.id] = e; });
    const next = order.map(function (id) { return byId[id]; }).filter(Boolean);
    if (next.length === dashCards.length) { dashCards = next; saveDash(); }
  }

  function attachDrag(handle, card) {
    handle.addEventListener("pointerdown", function (down) {
      if (down.button !== undefined && down.button !== 0) return;
      // The header holds the remove button; pressing it is a click, not a grab.
      if (down.target && down.target.closest && down.target.closest(".cardx")) return;
      down.preventDefault();
      const grid = $("dashGrid");
      if (!grid) return;

      let dragging = false, slot = null, rect = null, dx = 0, dy = 0;
      const startX = down.clientX, startY = down.clientY;
      try { handle.setPointerCapture(down.pointerId); } catch (e) { /* fine without capture */ }

      const begin = function () {
        dragging = true;
        rect = card.getBoundingClientRect();
        dx = startX - rect.left;
        dy = startY - rect.top;
        // A slot of exactly the card's size keeps the grid from reflowing the
        // moment the card leaves it.
        slot = el("div", { class: "drop-slot" });
        slot.style.setProperty("height", rect.height + "px");
        if (card.classList.contains("wide")) slot.className = "drop-slot wide";
        grid.insertBefore(slot, card);
        card.style.setProperty("width", rect.width + "px");
        card.style.setProperty("height", rect.height + "px");
        card.style.setProperty("left", rect.left + "px");
        card.style.setProperty("top", rect.top + "px");
        card.classList.add("lifted");
        grid.classList.add("dragging");
        document.body.classList.add("dragging");
      };

      const move = function (ev) {
        if (!dragging) {
          if (Math.abs(ev.clientX - startX) < DRAG_THRESHOLD && Math.abs(ev.clientY - startY) < DRAG_THRESHOLD) return;
          begin();
        }
        card.style.setProperty("left", (ev.clientX - dx) + "px");
        card.style.setProperty("top", (ev.clientY - dy) + "px");
        const target = nearestCard(grid, card, ev.clientX, ev.clientY);
        if (!target || target === slot) return;
        const r = target.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const sameRow = Math.abs(ev.clientY - cy) < r.height * 0.6;
        const before = sameRow ? (ev.clientX < cx) : (ev.clientY < cy);
        const wanted = before ? target : target.nextSibling;
        if (wanted === slot || (before && slot.nextSibling === target && slot === target.previousSibling)) return;
        const was = positions(grid);
        grid.insertBefore(slot, wanted);
        slideNeighbours(grid, card, was);
      };

      const finish = function () {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
        try { handle.releasePointerCapture(down.pointerId); } catch (e) { /* already released */ }
        if (!dragging) return;                       // a click, not a drag
        const landing = slot.getBoundingClientRect();
        const settle = function () {
          card.classList.remove("lifted", "settling");
          ["width", "height", "left", "top", "transform"].forEach(function (prop) { card.style.removeProperty(prop); });
          grid.insertBefore(card, slot);
          slot.remove();
          grid.classList.remove("dragging");
          document.body.classList.remove("dragging");
          commitOrder(grid);
        };
        if (!animate()) { settle(); return; }
        // Drop it into the slot rather than snapping there.
        card.classList.add("settling");
        card.style.setProperty("left", landing.left + "px");
        card.style.setProperty("top", landing.top + "px");
        card.style.setProperty("transform", "none");
        let done = false;
        const once = function () { if (done) return; done = true; card.removeEventListener("transitionend", once); settle(); };
        card.addEventListener("transitionend", once);
        setTimeout(once, 260);                       // in case the transition never fires
      };

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  function buildCard(entry) {
    const def = entry.type === "widget" ? WIDGETS[entry.widget] : null;
    const card = el("div", { class: "widget" + (def && def.wide ? " wide" : "") });
    card.dataset.id = entry.id;
    const title = entry.type === "widget" ? (def ? def.title : entry.widget) : entry.title;
    const grip = el("span", { class: "grip", title: "Drag to move", "aria-hidden": "true", text: "⠿" });
    const rm = el("button", { class: "cardx", type: "button", title: "Remove card", "aria-label": "Remove card", text: "×",
      onclick: function () { removeCard(entry.id); } });
    const head = el("div", { class: "widget-head" }, [
      el("span", { class: "emoji", text: emojiFor(entry) }),
      el("h3", { text: title || "Card" }),
      el("span", { class: "spacer" }),
      grip, rm,
    ]);
    card.appendChild(head);
    const body = el("div", { class: "widget-body" });
    card.appendChild(body);
    if (entry.type === "widget" && def) def.render(body);
    else if (entry.type === "tool") toolCardRender(entry)(body);
    else body.appendChild(el("div", { class: "muted", text: "Unknown card." }));
    attachDrag(head, card);   // the whole title bar drags, not just the grip
    return card;
  }

  async function buildAdder(container) {
    container.textContent = "";
    container.appendChild(el("h3", { class: "adder-title", text: "Add a card" }));
    const present = {};
    dashCards.forEach(function (e) { if (e.type === "widget") present[e.widget] = true; });
    const chips = el("div", { class: "chiprow" });
    Object.keys(WIDGETS).forEach(function (key) {
      if (present[key]) return;
      chips.appendChild(el("button", { class: "chip", type: "button", text: (EMOJI[key] || "") + " " + WIDGETS[key].title,
        onclick: function () { addWidget(key); } }));
    });
    if (chips.children.length) {
      container.appendChild(el("div", { class: "field-label", text: "Ready made" }));
      container.appendChild(chips);
    }

    container.appendChild(el("div", { class: "field-label", text: "From one of your apps" }));
    const mods = await loadModules();
    // Only read-only tools can back a card, so only those are offered.
    const choices = [];
    mods.forEach(function (m) {
      (m.tools || []).forEach(function (tool) {
        if (tool["class"] !== "read") return;
        choices.push({ module: m.name, tool: tool.name, schema: tool.schema, about: tool.description || "",
          label: (EMOJI[m.name] || EMOJI._default) + " " + appName(m.name) + " · " + humanizeWords(tool.name) });
      });
    });
    if (!choices.length) {
      blank(container, "Add an app and its information can live here.", "Browse apps", function () { openSettings("modules"); });
      container.appendChild(el("div", { class: "row-actions" }, [
        el("button", { class: "btn ghost small", type: "button", text: "Close", onclick: function () { adderOpen = false; renderHome(); } }),
      ]));
      return;
    }

    const what = el("select");
    choices.forEach(function (c, i) { what.appendChild(el("option", { value: String(i), text: c.label })); });
    const about = el("p", { class: "note" });
    const fieldsBox = el("div");
    const titleInp = el("input", { type: "text", placeholder: "leave empty and we will name it" });
    const err = el("div", { class: "err" });
    let fields = null;
    const buildFields = function () {
      fieldsBox.textContent = "";
      const choice = choices[Number(what.value) || 0];
      about.textContent = choice ? firstSentence(choice.about, 160) : "";
      fields = fieldsFromSchema(choice && choice.schema);
      if (!fields.empty) fieldsBox.appendChild(fields.node);
    };
    what.addEventListener("change", buildFields);

    const addB = el("button", { class: "btn primary small", type: "button", text: "Add to home" });
    addB.addEventListener("click", function () {
      err.textContent = "";
      const choice = choices[Number(what.value) || 0];
      const short = fields ? fields.missing() : [];
      if (short.length) { err.textContent = "Still needed: " + short.join(", ") + "."; return; }
      addToolCard(choice.module, choice.tool, fields ? fields.values() : {}, titleInp.value.trim());
    });

    container.appendChild(el("div", { class: "adder-form" }, [
      el("label", { class: "field full" }, ["Show me", what]),
    ]));
    container.appendChild(about);
    container.appendChild(fieldsBox);
    container.appendChild(el("div", { class: "adder-form" }, [
      el("label", { class: "field full" }, ["Card title", titleInp]),
    ]));
    container.appendChild(err);
    container.appendChild(el("div", { class: "row-actions" }, [addB,
      el("button", { class: "btn ghost small", type: "button", text: "Close", onclick: function () { adderOpen = false; renderHome(); } })]));
    buildFields();
  }

  async function renderHome() {
    const panel = $("home");
    stopClock();
    if (dashCards === null || dashDirty) { dashDirty = false; await loadDash(); }
    panel.textContent = "";
    panel.className = "panel active";
    panel.appendChild(el("div", { class: "home-head" }, [
      el("h2", { text: "Home" }),
      el("span", { class: "spacer" }),
      el("button", { class: "btn ghost small", type: "button", text: adderOpen ? "Close" : "＋ Add card",
        onclick: function () { adderOpen = !adderOpen; renderHome(); } }),
    ]));
    if (adderOpen) {
      const adder = el("div", { class: "adder" });
      panel.appendChild(adder);
      buildAdder(adder);
    }
    const grid = el("div", { class: "grid-wrap", id: "dashGrid" });
    dashCards.forEach(function (entry) { grid.appendChild(buildCard(entry)); });
    panel.appendChild(grid);
    if (!dashCards.length) {
      panel.appendChild(el("p", { class: "muted", text: "No cards yet. Add one, or just ask the assistant to show you something." }));
    }
  }

  function renderClock(body) {
    const big = el("div", { class: "big" });
    const date = el("div", { class: "muted" });
    body.appendChild(big); body.appendChild(date);
    const tick = function () {
      const now = new Date();
      const opts = { hour: "2-digit", minute: "2-digit", hour12: !prefs.clock24 };
      if (prefs.clockSeconds) opts.second = "2-digit";
      big.textContent = now.toLocaleTimeString(undefined, opts);
      date.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    };
    tick();
    clockTimer = setInterval(tick, prefs.clockSeconds ? 1000 : 15000);
  }
  function renderQuickAsk(body) {
    const box = el("input", { type: "text", placeholder: "Ask the assistant…" });
    const btn = el("button", { class: "btn primary", type: "button", text: "Ask" });
    const go = function () {
      const text = box.value.trim();
      if (!text) return;
      box.value = "";
      selectTab("thread");
      send(text);
    };
    btn.addEventListener("click", go);
    box.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    body.appendChild(el("div", { class: "quickask" }, [box, btn]));
  }
  async function renderPlacesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    const r = await api("GET", "/api/locations");
    if (reauthed(r)) return;
    const places = (r.ok && r.data.locations) || [];
    if (!places.length) {
      ul.remove();
      blank(body, "Add the places you talk about, like home or work.", "Add a place", function () { openSettings("places"); });
      return;
    }
    places.forEach(function (p) {
      const where = (p.latitude != null) ? (p.latitude + ", " + p.longitude) : (p.address || "");
      ul.appendChild(el("li", null, [twoLine(p.label || p.name, where)]));
    });
  }
  async function renderRoutinesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    await loadModules();          // so a step reads as words, not module.tool
    const r = await api("GET", "/api/schedules");
    if (reauthed(r)) return;
    const rows = ((r.ok && r.data.schedules) || []).filter(function (s) { return s.enabled; });
    if (!rows.length) {
      ul.remove();
      blank(body, "Nothing runs automatically yet.", "Set one up", function () { openSettings("schedules"); });
      return;
    }
    rows.slice(0, 6).forEach(function (s) {
      ul.appendChild(el("li", null, [twoLine(describeCron(s.cron), describeSteps(s.steps))]));
    });
  }
  async function renderNotesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const memory = (r.ok && r.data.memory) || {};
    const keys = Object.keys(memory);
    if (!keys.length) {
      ul.remove();
      blank(body, "Tell the assistant something to remember and it appears here.", "Ask it", function () { selectTab("thread"); });
      return;
    }
    keys.forEach(function (k) { ul.appendChild(el("li", null, [twoLine(k, JSON.stringify(memory[k]))])); });
  }

  // ======================================================================
  //  SETTINGS (one tab: places, schedules, modules, preferences, appearance)
  // ======================================================================
  let settingsSection = "places";
  let moduleCache = null;              // installed modules, for building friendly choices
  const SECTIONS = [
    ["places", "Places", "📍"],
    ["schedules", "Automations", "🔁"],
    ["modules", "Apps", "🧩"],
    ["prefs", "Preferences", "⚙️"],
  ];
  function openSettings(section) {
    settingsSection = section || "places";
    selectTab("settings");
  }
  async function loadModules(force) {
    if (moduleCache && !force) return moduleCache;
    const r = await api("GET", "/api/modules");
    if (reauthed(r)) return [];
    moduleCache = (r.ok && r.data.modules) || [];
    return moduleCache;
  }
  // "transit.next_departures" is not something to show a person. Prefer the
  // tool's own description, fall back to plain words.
  function describeSteps(steps) {
    return (steps || []).map(function (st) {
      const mod = (moduleCache || []).filter(function (m) { return m.name === st.module; })[0];
      const tool = mod && (mod.tools || []).filter(function (x) { return x.name === st.tool; })[0];
      const words = (tool && tool.description) ? firstSentence(tool.description, 70) : humanizeWords(st.tool);
      const args = Object.keys(st.args || {}).map(function (k) { return String(st.args[k]); }).join(", ");
      return args ? words + " (" + args + ")" : words;
    }).join(", ");
  }
  function renderSettings() {
    const panel = $("settings");
    panel.textContent = "";
    const nav = el("div", { class: "subnav" });
    SECTIONS.forEach(function (s) {
      nav.appendChild(el("button", { class: "subtab" + (settingsSection === s[0] ? " active" : ""), type: "button",
        text: s[2] + " " + s[1], onclick: function () { settingsSection = s[0]; renderSettings(); } }));
    });
    panel.appendChild(nav);
    const body = el("div", { class: "settings-body" });
    panel.appendChild(body);

          toggle.addEventListener("click", async function () {

    }

    // ---- the builder: an action, its own fields, and a time ----------------
    const choices = [];
    (moduleCache || []).forEach(function (m) {
      (m.tools || []).forEach(function (tool) {
        // A routine runs unattended, so a destructive tool is never offered here.
        if (tool["class"] === "destructive") return;
        choices.push({ module: m.name, tool: tool.name, schema: tool.schema, ready: m.state === "ready",

    const card = el("div", { class: "card" });

    const what = el("select");

      const cron = cronBox.value.trim() || cronFrom(repeat.value, at.value, weekday.value, monthday.value);
      const res = await api("POST", "/api/schedules", {
        cron: cron,

  async function doInstall(body, errBox, btn) {

    const pass = el("input", { type: "password", placeholder: "password", autocomplete: "current-password" });
    const err = el("div", { class: "err", text: message || "" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Sign in" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      const r = await api("POST", "/api/login", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) boot();
      else if (r.status === 429) err.textContent = "Too many attempts. Wait a few minutes.";
      else err.textContent = "Wrong username or password.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  $("logout").addEventListener("click", async function () {
    signedOut = true;
    if (socket) { try { socket.close(); } catch (e) { /* gone */ } socket = null; }
    await api("POST", "/api/logout");
    renderLogin();
    showGate();
  });

  async function boot() {
    const r = await api("GET", "/api/me");
    if (!r.ok) { dropToLogin(); return; }
    const me = r.data || {};
    if (me.auth === false || me.authenticated) { showApp(me); return; }
    if (me.setup_required) renderSetup(); else renderLogin();
    showGate();
  }

  applyAccent(DEFAULT_ACCENT);
  boot();
})();
</script>
</body>
</html>
