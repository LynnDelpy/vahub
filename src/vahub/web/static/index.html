<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="referrer" content="no-referrer" />
<title>Assistant</title>
<style nonce="__CSP_NONCE__">
  /*
   * One assistant, three places to be: Home, Chat, Settings.
   *
   * The rules this stylesheet holds itself to, because the last version had
   * none and looked like it:
   *   - One type scale, one spacing scale (4px), three radii. No stray values.
   *   - Icons are line drawings on a 24px grid, never emoji.
   *   - Hairlines and whitespace carry the structure. Shadows are for things
   *     that genuinely float: a dragged card, the sign-in sheet.
   *   - One accent, chosen by the owner, used for what is selected or primary.
   *   - The phone gets a bottom bar and one screen at a time; the desktop gets
   *     a side rail. Neither gets two rows of navigation.
   *
   * No external fonts, scripts or images, so it works on a network with no
   * route to the internet and leaks nothing to a third party.
   */
  :root {
    color-scheme: light dark;

    /* type: 13 / 15 / 17 / 20 / 28, plus an 11px label */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --fs-label: .6875rem; --fs-meta: .8125rem; --fs-body: .9375rem;
    --fs-lead: 1.0625rem; --fs-title: 1.25rem; --fs-display: 1.75rem;

    /* spacing, 4px base */
    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem; --s7: 3rem;

    /* shape */
    --r-control: .5rem; --r-card: .875rem; --r-pill: 999px;
    --rail: 232px; --rail-collapsed: 4.25rem; --tabbar: 3.5rem; --header: 3.25rem; --tap: 2.75rem;

    /* warm neutrals, light */
    --bg: #faf9f7; --surface: #ffffff; --sunken: #f2efeb; --raised: #ffffff;
    --line: #e7e2db; --line-strong: #d6cfc5;
    --text: #191816; --text-2: #5b564f; --text-3: #767068;
    --danger: #c0392b; --ok: #2f8f57; --warn: #b7791f;
    --accent: #d1552b; --accent-fill: #c14a22; --accent-text: #b8461f; --accent-weak: rgba(209,85,43,.14); --accent-weaker: rgba(209,85,43,.07); --accent-fg: #ffffff;
    --shadow-lift: 0 16px 40px rgba(30,20,10,.18), 0 2px 8px rgba(30,20,10,.10);
    --shadow-sheet: 0 24px 60px rgba(30,20,10,.20);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121110; --surface: #1a1918; --sunken: #232120; --raised: #201f1d;
      --line: #2c2a28; --line-strong: #3d3a37;
      --text: #f1efec; --text-2: #b0a9a1; --text-3: #948d84;
      --danger: #e8705f; --ok: #4fb37a; --warn: #d6a34a;
      --shadow-lift: 0 16px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
      --shadow-sheet: 0 24px 60px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121110; --surface: #1a1918; --sunken: #232120; --raised: #201f1d;
    --line: #2c2a28; --line-strong: #3d3a37;
    --text: #f1efec; --text-2: #b0a9a1; --text-3: #948d84;
    --danger: #e8705f; --ok: #4fb37a; --warn: #d6a34a;
    --shadow-lift: 0 16px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
    --shadow-sheet: 0 24px 60px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 var(--fs-body)/1.5 var(--font);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  svg.i { width: 1.25rem; height: 1.25rem; flex: none; display: block; }
  svg.i-sm { width: 1rem; height: 1rem; }
  svg.i-lg { width: 1.5rem; height: 1.5rem; }

  /* ---------- shell ---------- */
  #shell { display: flex; min-height: 100%; }
  #shell[hidden] { display: none; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100dvh; }

  /* side rail (desktop) ---------------------------------------------------
   * It holds where you can go: the two places the assistant lives, then your
   * apps. It collapses to a strip of icons, because a hub you leave open all
   * day should be able to get out of the way. Your name sits at the bottom,
   * and everything about you and the household hangs off it.
   */
  #rail { display: none; width: var(--rail); flex: none; border-right: 1px solid var(--line); background: var(--surface); padding: var(--s4) var(--s3) var(--s3); flex-direction: column; gap: var(--s2); position: sticky; top: 0; height: 100dvh; transition: width .16s cubic-bezier(.2,.9,.3,1); }
  .brand { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s1) var(--s4); min-height: var(--tap); }
  .brand .mark { width: 1.5rem; height: 1.5rem; border-radius: 7px; background: var(--accent-fill); flex: none; margin-left: calc(var(--s1) + 1px); }
  .brand .name { font-size: var(--fs-lead); font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; }
  .railtoggle { margin-left: 0; width: 2rem; height: 2rem; flex: none; }
  .railtoggle svg { width: 1.125rem; height: 1.125rem; }

  #railnav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .navitem { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--tap); padding: 0 var(--s3); border: none; border-radius: var(--r-control); background: transparent; color: var(--text-2); font: 500 var(--fs-body)/1 var(--font); cursor: pointer; text-align: left; }
  .navitem:hover { background: var(--sunken); color: var(--text); }
  .navitem.active { background: var(--accent-weak); color: var(--text); font-weight: 600; }
  .navitem.active > svg { color: var(--accent-text); }
  .navitem svg { flex: none; }
  .navitem .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navitem.add { color: var(--text-3); }
  .navitem.add:hover { color: var(--accent-text); }

  .railgroup { display: flex; flex-direction: column; gap: 2px; margin-top: var(--s4); }
  .railnote { margin: 0; padding: 0 var(--s3) var(--s2); font-size: var(--fs-meta); color: var(--text-3); }

  /* A module's state, small enough to ignore and specific enough to notice. */
  .statedot { width: .4375rem; height: .4375rem; border-radius: 50%; flex: none; background: var(--text-3); }
  .statedot.ready { background: var(--ok); }
  .statedot.failed { background: var(--danger); }
  .statedot.unconfigured, .statedot.degraded, .statedot.starting { background: var(--warn); }
  .statedot.stopped { background: var(--line-strong); }

  /* the account button and the menu that hangs above it */
  .rail-foot { position: relative; margin-top: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--line); }
  .accountbtn { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--tap); padding: 0 var(--s2); border: none; border-radius: var(--r-control); background: transparent; color: var(--text); font: 500 var(--fs-body)/1 var(--font); cursor: pointer; text-align: left; }
  .accountbtn:hover { background: var(--sunken); }
  .accountbtn[aria-expanded="true"] { background: var(--sunken); }
  .accountbtn .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .accountbtn svg { color: var(--text-3); }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 1.75rem; height: 1.75rem; flex: none; border-radius: 50%; background: var(--accent-fill); color: var(--accent-fg); font: 600 var(--fs-meta)/1 var(--font); text-transform: uppercase; }
  .avatar.lg { width: 2.5rem; height: 2.5rem; font-size: var(--fs-body); }

  .menu { position: absolute; bottom: calc(100% + var(--s1)); left: 0; min-width: 13.5rem; padding: var(--s1); background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-card); box-shadow: var(--shadow-lift); z-index: 40; }
  .menu[hidden] { display: none; }
  .menuhead { padding: var(--s2) var(--s3) var(--s2); border-bottom: 1px solid var(--line); margin-bottom: var(--s1); }
  .menuhead .n { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menuhead .r { display: block; font-size: var(--fs-meta); color: var(--text-3); }
  .menuitem { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 2.5rem; padding: 0 var(--s3); border: none; border-radius: var(--r-control); background: transparent; color: var(--text); font: 500 var(--fs-meta)/1 var(--font); cursor: pointer; text-align: left; }
  .menuitem:hover { background: var(--sunken); }
  .menuitem svg { color: var(--text-3); }
  .menuitem.leave { color: var(--danger); }
  .menuitem.leave svg { color: var(--danger); }
  .menusep { height: 1px; margin: var(--s1) var(--s2); background: var(--line); }

  /* collapsed: icons only, and nothing that needs width */
  #shell[data-rail="collapsed"] #rail { width: var(--rail-collapsed); padding-left: var(--s2); padding-right: var(--s2); }
  #shell[data-rail="collapsed"] .brand { flex-direction: column; gap: var(--s3); padding-bottom: var(--s3); }
  #shell[data-rail="collapsed"] .brand .name,
  #shell[data-rail="collapsed"] .navitem .label,
  #shell[data-rail="collapsed"] .railnote,
  #shell[data-rail="collapsed"] .accountbtn .who,
  #shell[data-rail="collapsed"] .accountbtn > svg { display: none; }
  #shell[data-rail="collapsed"] .navitem,
  #shell[data-rail="collapsed"] .accountbtn { justify-content: center; padding: 0; gap: 0; position: relative; }
  #shell[data-rail="collapsed"] .navitem .statedot { position: absolute; right: .5rem; bottom: .55rem; box-shadow: 0 0 0 2px var(--surface); }
  #shell[data-rail="collapsed"] .railgroup { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
  #shell[data-rail="collapsed"] .menu { left: 0; right: auto; }
  @media (prefers-reduced-motion: reduce) { #rail { transition: none; } }

  /* header */
  #topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--s2); min-height: var(--header); padding: 0 var(--s4); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  #viewTitle { margin: 0; font-size: var(--fs-lead); font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); margin-left: calc(var(--s2) * -1); border: none; background: transparent; color: var(--text-2); border-radius: var(--r-control); cursor: pointer; }
  .iconbtn:hover { background: var(--sunken); color: var(--text); }
  #backBtn { display: none; }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--warn); flex: none; }
  #state:empty { display: none; }
  #state { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-meta); color: var(--text-3); }

  /* content */
  main { flex: 1; min-height: 0; overflow-y: auto; }
  .panel { display: none; padding: var(--s5) var(--s4) var(--s7); max-width: 60rem; margin: 0 auto; width: 100%; }
  .panel.active { display: block; }
  #thread.active { display: flex; flex-direction: column; gap: var(--s3); max-width: 46rem; }

  h2 { font-size: var(--fs-title); font-weight: 600; letter-spacing: -.01em; margin: 0 0 var(--s1); }
  .sub { color: var(--text-2); font-size: var(--fs-body); margin: 0 0 var(--s5); max-width: 46ch; }
  .grouplabel { font-size: var(--fs-label); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: var(--s5) 0 var(--s2); }
  .grouplabel:first-child { margin-top: 0; }
  .note { font-size: var(--fs-meta); color: var(--text-3); margin: var(--s2) 0 0; }
  .err { color: var(--danger); font-size: var(--fs-meta); min-height: 1.1em; }
  .meta { color: var(--text-3); font-size: var(--fs-meta); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s4); margin-bottom: var(--s4); }
  .card > h2 { margin-bottom: var(--s3); }

  /* ---------- controls ---------- */
  input, textarea, select { font: 400 var(--fs-body)/1.4 var(--font); width: 100%; padding: .625rem var(--s3); min-height: var(--tap); color: var(--text); background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-control); }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: var(--text-3); }
  textarea { min-height: 4rem; resize: vertical; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 49%, var(--text-3) 50%), linear-gradient(-45deg, transparent 49%, var(--text-3) 50%); background-position: calc(100% - 1rem) 55%, calc(100% - .6rem) 55%; background-size: .35rem .35rem; background-repeat: no-repeat; padding-right: var(--s6); }
  label.field { display: flex; flex-direction: column; gap: var(--s1); font-size: var(--fs-meta); font-weight: 500; color: var(--text-2); }
  label.field .hint { font-weight: 400; color: var(--text-3); font-size: var(--fs-meta); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: var(--s3); }
  .grid .full { grid-column: 1 / -1; }
  .row-actions { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--tap); padding: 0 var(--s4); font: 500 var(--fs-body)/1 var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-control); cursor: pointer; }
  .btn:hover { background: var(--sunken); }
  .btn.primary { background: var(--accent-fill); border-color: transparent; color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--sunken); color: var(--text); }
  .btn.small { min-height: 2rem; padding: 0 var(--s3); font-size: var(--fs-meta); }
  .btn.danger { color: var(--danger); }
  .btn[disabled] { opacity: .5; cursor: default; }

  /* rows: label, explanation, one control */
  .setrow { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) 0; border-top: 1px solid var(--line); }
  .setrow:first-child { border-top: none; padding-top: 0; }
  .setrow .text { flex: 1; min-width: 0; }
  .setrow .name { font-weight: 500; }
  .setrow .why { color: var(--text-3); font-size: var(--fs-meta); }

  .switch { position: relative; width: 3rem; height: 1.75rem; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: var(--r-pill); background: var(--sunken); border: 1px solid var(--line-strong); transition: background .16s ease, border-color .16s ease; pointer-events: none; }
  .switch .knob { position: absolute; top: 50%; left: .1875rem; width: 1.25rem; height: 1.25rem; margin-top: -.625rem; border-radius: 50%; background: var(--raised); border: 1px solid var(--line); transition: transform .16s ease; pointer-events: none; }
  .switch input:checked ~ .track { background: var(--accent-fill); border-color: transparent; }
  .switch input:checked ~ .knob { transform: translateX(1.25rem); border-color: transparent; }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .segmented { display: inline-flex; padding: 2px; gap: 2px; background: var(--sunken); border-radius: var(--r-control); }
  .segmented button { min-height: 2.25rem; padding: 0 var(--s3); border: none; border-radius: 6px; background: transparent; color: var(--text-2); font: 500 var(--fs-meta)/1 var(--font); cursor: pointer; }
  .segmented button.active { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .swatches { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .swatch { width: 2rem; height: 2rem; padding: 0; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); cursor: pointer; position: relative; }
  .swatch.active { border-color: var(--text); }

  details.advanced { border-top: 1px solid var(--line); margin-top: var(--s3); }
  details.advanced summary { display: flex; align-items: center; gap: var(--s2); min-height: var(--tap); color: var(--text-3); font-size: var(--fs-meta); cursor: pointer; list-style: none; }
  details.advanced summary::-webkit-details-marker { display: none; }
  details.advanced summary::before { content: "＋"; font-size: .8em; }
  details.advanced[open] summary::before { content: "−"; }

  /* lists */
  .items { list-style: none; margin: 0; padding: 0; }
  .items li { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); }
  .items li:first-child { border-top: none; }
  .items li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .blank { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-body); }
  .blank .btn { margin-left: auto; }

  /* ---------- settings ---------- */
  .settings-layout { display: grid; gap: var(--s5); }
  .seclist { display: flex; flex-direction: column; }
  .secitem { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 3.25rem; padding: 0 var(--s2); border: none; border-top: 1px solid var(--line); background: transparent; color: var(--text); font: 500 var(--fs-body)/1 var(--font); cursor: pointer; text-align: left; }
  .secitem:first-child { border-top: none; }
  .secitem .grow { flex: 1; min-width: 0; }
  .secitem svg { color: var(--text-3); }
  .secitem:hover { color: var(--accent-text); }
  .secitem.active { color: var(--text); }
  .secitem.active svg:first-child { color: var(--accent-text); }

  /* ---------- apps ---------- */
  .approw { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 3.5rem; padding: var(--s2) var(--s2); border: none; border-top: 1px solid var(--line); background: transparent; color: var(--text); font: 400 var(--fs-body)/1.4 var(--font); cursor: pointer; text-align: left; }
  .approw:first-child { border-top: none; }
  .approw:hover { color: var(--accent-text); }
  .approw .grow { flex: 1; min-width: 0; }
  .approw .n { display: block; font-weight: 600; }
  .approw .d { display: block; font-size: var(--fs-meta); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .approw > svg:first-child { color: var(--text-3); }
  .apphead { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
  .apphead .grow { flex: 1; min-width: 0; }
  .apphead h2 { margin: 0; }
  .toolrow { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); }
  .toolrow:first-child { border-top: none; }
  .toolrow .grow { flex: 1; min-width: 0; }
  .toolrow .n { font-weight: 500; }
  .toolrow .d { font-size: var(--fs-meta); color: var(--text-3); }

  .checkline { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-meta); color: var(--text-2); cursor: pointer; }
  .checkline input { width: auto; min-height: 0; }

  /* ---------- people ---------- */
  .person { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .person:first-child { border-top: none; padding-top: 0; }
  .person .grow { flex: 1; min-width: 8rem; }
  .person .n { font-weight: 600; }
  .person .d { font-size: var(--fs-meta); color: var(--text-3); }
  .person .acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .tag { font-size: var(--fs-label); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: .15rem .4rem; border-radius: 5px; color: var(--text-3); background: var(--sunken); }
  .tag.admin { color: var(--accent-text); background: var(--accent-weak); }
  .tag.off { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .tag.you { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }

  /* ---------- home ---------- */
  .home-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); }
  .home-head .spacer { flex: 1; }
  .grid-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: var(--s4); align-items: start; }
  .widget { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--s3) var(--s4) var(--s4); }
  .widget.wide { grid-column: 1 / -1; }
  .widget-head { display: flex; align-items: center; gap: var(--s2); min-height: var(--tap); margin: 0 0 var(--s2); color: var(--text-3); }
  .widget-head h3 { margin: 0; font-size: var(--fs-meta); font-weight: 600; color: var(--text-2); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .widget-head .spacer { flex: 1; }
  .widget-head .grip { cursor: grab; touch-action: none; color: var(--text-3); opacity: 0; transition: opacity .12s ease; }
  .widget:hover .widget-head .grip, .widget-head:focus-within .grip { opacity: 1; }
  .cardx { display: inline-flex; align-items: center; justify-content: center; width: 1.75rem; height: 1.75rem; border: none; border-radius: var(--r-control); background: transparent; color: var(--text-3); cursor: pointer; }
  .cardx:hover { background: var(--sunken); color: var(--danger); }

        <section class="panel" id="settings" aria-label="Settings"></section>

      <footer id="composerBar" hidden>
        <div class="composer">

          <input id="input" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Ask something" />
          <button id="mic" class="btn mic" type="button" aria-label="Speak"></button>

  function towards(rgb, target, amount) {
    return rgb.map(function (v, i) { return Math.round(v + (target[i] - v) * amount); });
  }
  // An accent that looks right as a button fill can be unreadable as text on the
  // page behind it. Rather than hand-tune eight colours twice, walk the chosen
  // one toward the far end of the theme until it clears 4.5:1.
  function readableOn(rgb, bg, target) {
    const end = luminance(bg) < 0.5 ? [255, 255, 255] : [0, 0, 0];
    let out = rgb;
    for (let i = 0; i < 24 && contrast(out, bg) < target; i++) out = towards(out, end, 0.07);
    return out;
  }
  function css(rgb) { return "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")"; }
  function rgba(rgb, a) { return "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + a + ")"; }

  function refreshAccent() {
    const hex = ACCENTS[currentAccent] || ACCENTS[DEFAULT_ACCENT];
    const base = hexToRgb(hex);
    const bg = parseRgb(getComputedStyle(document.body).backgroundColor);
    const light = [255, 255, 255], dark = [23, 20, 17];
    const fg = contrast(light, base) >= contrast(dark, base) ? light : dark;
    // A solid button has to carry a label. Deepen (or lighten) the fill until
    // that label is legible on it, instead of shipping 4.3:1 and calling it done.
    let fill = base;
    const away = fg === light ? [0, 0, 0] : [255, 255, 255];
    for (let i = 0; i < 24 && contrast(fg, fill) < 4.5; i++) fill = towards(fill, away, 0.05);
    const root = document.documentElement.style;
    root.setProperty("--accent", hex);
    root.setProperty("--accent-fill", css(fill));
    root.setProperty("--accent-text", css(readableOn(base, bg, 4.5)));
    root.setProperty("--accent-fg", css(fg));
    root.setProperty("--accent-weak", rgba(base, 0.16));
    root.setProperty("--accent-weaker", rgba(base, 0.08));
  }

  function applyAccent(name) {
    currentAccent = ACCENTS[name] ? name : DEFAULT_ACCENT;
    refreshAccent();
  }
  function applyTheme(name) {
    currentTheme = (name === "light" || name === "dark") ? name : "auto";
    if (currentTheme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", currentTheme);
    refreshAccent();          // the readable shade depends on what is behind it
  }

  function atBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60; }
  function scroll(force) { if (force || atBottom()) thread.scrollTop = thread.scrollHeight; }
  function clearEmpty() { if (empty && empty.parentNode) empty.remove(); }

  // Everything the last person's conversation left behind. A hub gets used on a
  // shared tablet in a hallway, so signing out has to take the transcript with
  // it: the bubbles are on screen, and `sessionId` would otherwise be sent with
  // the next person's first message and append their turn to the previous
  // account's history (a session is not bound to who created it).
  function resetConversation() {
    sessionId = null;
    shown.clear();
    thread.textContent = "";
    if (empty) thread.appendChild(empty);
    input.value = "";
    setState("");
  }
  function bubble(text, kind) {
    clearEmpty();
    const stick = atBottom();
    const node = el("div", { class: "msg " + kind, text: text });
    thread.appendChild(node);
    scroll(stick);
    return node;
  }
  function setState(text) {
    stateEl.textContent = "";
    if (!text) return;
    stateEl.appendChild(el("span", { class: "dot" }));
    stateEl.appendChild(el("span", { text: text }));
  }

  // ---- speaking ---------------------------------------------------------
  function speak(text) {
    if (!text || !readBox.checked) return;
    if (config.tts_provider !== "browser") return;
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  // ---- approvals --------------------------------------------------------
  function describe(p) {
    const what = (p.module || "") + "." + (p.tool || "");
    return p.reason ? what + " (" + p.reason + ")" : what;
  }
  function argLines(p) {
    const args = p && p.args;
    if (!args || typeof args !== "object") return [];
    return Object.keys(args).map(function (k) {
      let v = args[k];
      if (typeof v !== "string") v = JSON.stringify(v);
      if (v.length > 200) v = v.slice(0, 200) + "…";
      return k + ": " + v;
    });
  }
  function showApproval(p) {
    const id = p.pending_id || p.id;
    if (!id || shown.has(id)) return;
    shown.add(id);
    clearEmpty();

    const card = el("div", { class: "approval" });
    card.appendChild(el("p", null, [
      el("span", { text: "Needs your approval: " }),
      el("span", { class: "what", text: describe(p) }),
    ]));
    const rows = argLines(p);
    if (rows.length) {
      card.appendChild(el("ul", { class: "args" }, rows.map(function (t) { return el("li", { text: t }); })));
    }

    const yes = el("button", { class: "yes", type: "button", text: "Approve" });
    const no = el("button", { class: "no", type: "button", text: "Dismiss" });
    const expiry = el("span", { class: "expiry" });
    card.appendChild(el("div", { class: "row" }, [yes, no, expiry]));
    thread.appendChild(card);
    scroll(true);

    let countdown = null;
    const expiresAt = p.expires_at || (p.ttl_s ? Date.now() / 1000 + p.ttl_s : null);
    const stopCountdown = function () { if (countdown) { clearInterval(countdown); countdown = null; } };
    if (expiresAt) {
      const tick = function () {
        const left = Math.round(expiresAt - Date.now() / 1000);
        if (left <= 0) { stopCountdown(); card.remove(); bubble("That approval expired. Ask again if you still want it.", "theirs"); }
        else expiry.textContent = left + "s left";
      };
      tick();
      countdown = setInterval(tick, 1000);
    }
    const finish = function (text, kind) { stopCountdown(); card.remove(); if (text) bubble(text, kind || "theirs"); };
    yes.addEventListener("click", async function () {
      stopCountdown();
      yes.disabled = no.disabled = true;
      const r = await api("POST", "/api/confirm/" + encodeURIComponent(id));
      if (r.ok && r.data.ok) finish("Done.");
      else finish("It did not go through: " + (r.data.detail || r.data.error || r.status), "problem");
    });
    no.addEventListener("click", function () { finish("Left alone."); });
  }
  async function loadPending() {
    const r = await api("GET", "/api/pending");
    if (r.ok && Array.isArray(r.data)) r.data.forEach(showApproval);
  }

  // ---- live approvals over the socket -----------------------------------
  let wsBackoff = 1000;
  let signedOut = false;
  let socket = null;
  let reconnectTimer = null;
  function connect() {
    if (signedOut) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (socket) { try { socket.close(); } catch (e) { /* already gone */ } socket = null; }
    let ws;
    try {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws/events");
    } catch (e) { return; }
    socket = ws;
    ws.onopen = function () { setState(""); wsBackoff = 1000; loadPending(); };
    ws.onclose = function () {
      if (ws !== socket || signedOut) return;
      setState("reconnecting");
      reconnectTimer = setTimeout(connect, wsBackoff);
      wsBackoff = Math.min(wsBackoff * 2, 30000);
    };
    ws.onmessage = function (ev) {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg && msg.type === "confirm" && msg.data) showApproval(msg.data);
    };
  }

  // ---- sending ----------------------------------------------------------
  async function send(text) {
    const message = (text !== undefined ? text : input.value).trim();
    if (!message) return;
    input.value = "";
    sendBtn.disabled = true;
    bubble(message, "mine");
    const pending = bubble("...", "theirs thinking");
    const r = await api("POST", "/api/chat", { message: message, session_id: sessionId });
    pending.remove();
    if (!r.ok) {
      if (r.status === 401) { sendBtn.disabled = false; dropToLogin(); return; }
      bubble(r.data.detail || ("Something went wrong (" + r.status + ")."), "problem");
    } else {
      sessionId = r.data.session_id || sessionId;
      if (r.data.reply) { bubble(r.data.reply, "theirs"); speak(r.data.reply); }
      loadPending();
      // A turn may have pinned or removed a card ("show me departures from here").
      dashDirty = true;
    }
    sendBtn.disabled = false;
    input.focus();
  }
  sendBtn.addEventListener("click", function () { send(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ---- microphone -------------------------------------------------------
  let recognizer = null, recorder = null, recording = false;
  function setRecording(on) {
    recording = on;
    micBtn.classList.toggle("recording", on);
    micBtn.textContent = "";
    micBtn.appendChild(icon(on ? "stop" : "mic"));
    micBtn.setAttribute("aria-label", on ? "Stop" : "Speak");
  }
  function useBrowserSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { micBtn.disabled = true; voiceNote.textContent = "Speaking needs Chrome or Edge. Typing works everywhere."; return; }
    recognizer = new SR();
    recognizer.lang = navigator.language || "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = function (e) { send(e.results[0][0].transcript); };
    recognizer.onend = function () { setRecording(false); };
    recognizer.onerror = function (e) { setRecording(false); if (e.error !== "aborted") voiceNote.textContent = "Microphone: " + e.error; };
    micBtn.addEventListener("click", function () {
      if (recording) { recognizer.stop(); return; }
      setRecording(true);
      try { recognizer.start(); } catch (e) { setRecording(false); }
    });
  }
  function useServerSpeech() {
    micBtn.addEventListener("click", async function () {
      if (recording) { if (recorder) recorder.stop(); return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { voiceNote.textContent = "Microphone unavailable."; return; }
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = async function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        setRecording(false);
        const form = new FormData();
        form.append("audio", new Blob(chunks, { type: recorder.mimeType || "audio/webm" }), "audio.webm");
        if (sessionId) form.append("session_id", sessionId);
        const thinking = bubble("...", "theirs thinking");
        try {
          const resp = await fetch("/api/voice", { method: "POST", body: form });
          const data = await resp.json().catch(function () { return {}; });
          thinking.remove();
          if (resp.status === 401) { dropToLogin(); return; }
          if (data.ok === false) { bubble(data.detail || data.error || "That did not work.", "problem"); return; }
          if (data.transcript) bubble(data.transcript, "mine");
          sessionId = data.session_id || sessionId;
          if (data.reply) bubble(data.reply, "theirs");
          if (data.audio && readBox.checked) new Audio("data:" + (data.audio_mime || "audio/mpeg") + ";base64," + data.audio).play();
          else speak(data.reply || "");
          loadPending();
          dashDirty = true;
        } catch (e) { thinking.remove(); bubble("Could not send the recording.", "problem"); }
      };
      recorder.start();
      setRecording(true);
    });
  }

  function startAssistant() {
    if (assistantStarted) return;
    assistantStarted = true;
    (async function () {
      const r = await api("GET", "/api/client-config");
      if (r.ok) config = r.data;
      if (config.stt_provider === "openai_compat") useServerSpeech();
      else useBrowserSpeech();
    })();
  }

  // ======================================================================
  //  SHARED: preferences, small controls, and plain language
  // ======================================================================
  // Preferences are only worth offering if they do something, so every one of
  // these changes the app you are looking at. They live in one setting.
  const PREF_DEFAULTS = { clock24: true, clockSeconds: false, startPage: "home", readAloud: true, motion: true };
  let prefs = Object.assign({}, PREF_DEFAULTS);

  function adoptPrefs(value) {
    prefs = Object.assign({}, PREF_DEFAULTS);
    if (value && typeof value === "object") {
      Object.keys(PREF_DEFAULTS).forEach(function (k) {
        if (typeof value[k] === typeof PREF_DEFAULTS[k]) prefs[k] = value[k];
      });
    }
    readBox.checked = !!prefs.readAloud;
  }
  async function savePrefs() { await api("PUT", "/api/settings/" + encodeURIComponent("ui:prefs"), { value: prefs }); }
  function animate() {
    if (!prefs.motion) return false;
    return !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  // Flipping the composer's own toggle is the same choice, so it is remembered.
  readBox.addEventListener("change", function () { prefs.readAloud = readBox.checked; savePrefs(); });

  // ---- small controls ---------------------------------------------------
  function switchRow(name, why, checked, onchange) {
    const box = el("input", { type: "checkbox", "aria-label": name });
    box.checked = !!checked;
    box.addEventListener("change", function () { onchange(box.checked); });
    return el("div", { class: "setrow" }, [
      el("div", { class: "text" }, [el("div", { class: "name", text: name }), why ? el("div", { class: "why", text: why }) : null]),
      el("span", { class: "switch" }, [box, el("span", { class: "track" }), el("span", { class: "knob" })]),
    ]);
  }
  function segmentedRow(name, why, options, current, onchange) {
    const seg = el("div", { class: "segmented" });
    options.forEach(function (o) {
      const b = el("button", { class: (current === o[0] ? "active" : ""), type: "button", text: o[1] });
      b.addEventListener("click", function () { onchange(o[0]); });
      seg.appendChild(b);
    });
    return el("div", { class: "setrow" }, [
      el("div", { class: "text" }, [el("div", { class: "name", text: name }), why ? el("div", { class: "why", text: why }) : null]),
      seg,
    ]);
  }
  // An empty list should offer the way out of being empty, not just say it is empty.
  function blank(parent, text, actionLabel, onclick) {
    const row = el("div", { class: "blank" }, [el("span", { text: text })]);
    if (actionLabel) row.appendChild(el("button", { class: "btn small", type: "button", text: actionLabel, onclick: onclick }));
    parent.appendChild(row);
  }

  // ---- plain words ------------------------------------------------------
  const WORDS = {
    URL: "URL", URLS: "URLs", API: "API", SSL: "SSL", ID: "ID", IMAP: "IMAP", ICS: "Calendar feed",
    TZ: "Time zone", HA: "Home Assistant", NTFY: "ntfy", MR: "MR", RSS: "RSS", HB: "HB",
  };
  function humanizeWords(raw) {
    const parts = String(raw || "").split(/[_\s]+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      const up = parts[i].toUpperCase();
      if (up === "S" && out.length && /timeout/i.test(out[out.length - 1])) { out.push("(seconds)"); continue; }
      if (WORDS[up]) { out.push(WORDS[up]); continue; }
      const lower = parts[i].toLowerCase();
      out.push(out.length ? lower : lower.charAt(0).toUpperCase() + lower.slice(1));
    }
    const text = out.join(" ");
    return text.charAt(0).toUpperCase() + text.slice(1);
  }
  // Apps have names people already know how to spell.
  const APP_NAMES = {
    github: "GitHub", gitlab: "GitLab", homeassistant: "Home Assistant", rss: "News feeds",
    homelab: "Homelab", obsidian: "Obsidian", email: "Email", calendar: "Calendar",
    transit: "Transit", weather: "Weather", calculator: "Calculator", notify: "Notifications",
    time: "Time", core: "Assistant",
  };
  function appName(name) { return APP_NAMES[name] || humanizeWords(name); }
  function humanizeKey(moduleName, key) {
    const prefix = String(moduleName || "").toUpperCase().replace(/-/g, "_") + "_";
    const trimmed = String(key).indexOf(prefix) === 0 ? String(key).slice(prefix.length) : String(key);
    return humanizeWords(trimmed);
  }
  function firstSentence(text, cap) {
    // A tool's description is a docstring: its first line is the summary and the
    // rest documents arguments. Only the summary belongs in a label.
    const s = String(text || "").trim();
    if (!s) return "";
    const line = s.split(/\r?\n/)[0].trim();
    const dot = line.indexOf(". ");
    const one = dot > 0 ? line.slice(0, dot + 1) : line;
    return one.length > (cap || 90) ? one.slice(0, cap || 90).trim() + "…" : one;
  }

  // ---- fields built from a tool's own schema (never raw JSON) -----------
  function fieldsFromSchema(schema) {
    const props = (schema && schema.properties) || {};
    const required = (schema && schema.required) || [];
    const wrap = el("div", { class: "fields" });
    const controls = [];
    Object.keys(props).forEach(function (key) {
      const spec = props[key] || {};
      const isReq = required.indexOf(key) !== -1;
      let input;
      if (Array.isArray(spec.enum)) {
        input = el("select");
        if (!isReq) input.appendChild(el("option", { value: "", text: "—" }));
        spec.enum.forEach(function (v) { input.appendChild(el("option", { value: String(v), text: String(v) })); });
      } else if (spec.type === "boolean") {
        input = el("input", { type: "checkbox" });
        if (spec.default) input.checked = true;
      } else if (spec.type === "number" || spec.type === "integer") {
        input = el("input", { type: "number", step: spec.type === "integer" ? "1" : "any" });
        if (spec.default !== undefined) input.value = String(spec.default);
      } else {
        input = el("input", { type: "text" });
        if (spec.default !== undefined) input.value = String(spec.default);
      }
      wrap.appendChild(el("label", { class: "field" }, [
        humanizeWords(key) + (isReq ? " *" : ""),
        input,
        spec.description ? el("span", { class: "hint", text: firstSentence(spec.description, 80) }) : null,
      ]));
      controls.push({ key: key, input: input, spec: spec, required: isReq });
    });
    return {
      node: wrap,
      empty: controls.length === 0,
      missing: function () {
        return controls.filter(function (c) {
          return c.required && c.spec.type !== "boolean" && !String(c.input.value || "").trim();
        }).map(function (c) { return humanizeWords(c.key); });
      },
      values: function () {
        const out = {};
        controls.forEach(function (c) {
          if (c.spec.type === "boolean") { out[c.key] = !!c.input.checked; return; }
          const raw = String(c.input.value || "").trim();
          if (!raw) return;                       // an untouched optional field is left out
          out[c.key] = (c.spec.type === "number" || c.spec.type === "integer") ? Number(raw) : raw;
        });
        return out;
      },
    };
  }

  // ---- when things run, in words instead of cron -----------------------
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const REPEATS = [
    ["daily", "Every day"], ["weekdays", "Every weekday"], ["weekend", "Every weekend day"],
    ["weekly", "Once a week"], ["monthly", "Once a month"], ["hourly", "Every hour"],
  ];
  function cronFrom(repeat, hhmm, weekday, monthday) {
    const bits = String(hhmm || "08:00").split(":");
    const h = String(parseInt(bits[0], 10) || 0);
    const m = String(parseInt(bits[1], 10) || 0);
    if (repeat === "hourly") return m + " * * * *";
    if (repeat === "weekdays") return m + " " + h + " * * 1-5";
    if (repeat === "weekend") return m + " " + h + " * * 0,6";
    if (repeat === "weekly") return m + " " + h + " * * " + String(weekday);
    if (repeat === "monthly") return m + " " + h + " " + String(monthday) + " * *";
    return m + " " + h + " * * *";
  }
  function clockText(h, m) {
    const hh = parseInt(h, 10), mm = parseInt(m, 10);
    if (isNaN(hh) || isNaN(mm)) return null;
    const pad = function (n) { return (n < 10 ? "0" : "") + n; };
    if (prefs.clock24) return pad(hh) + ":" + pad(mm);
    const suffix = hh < 12 ? "am" : "pm";
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    return h12 + ":" + pad(mm) + " " + suffix;
  }
  function describeCron(cron) {
    const f = String(cron || "").trim().split(/\s+/);
    if (f.length !== 5) return String(cron || "");
    const m = f[0], h = f[1], dom = f[2], mon = f[3], dow = f[4];
    if (h === "*" && /^\d+$/.test(m)) return "Every hour at " + (m.length < 2 ? "0" + m : m) + " past";
    const at = clockText(h, m);
    if (at === null || mon !== "*") return String(cron);      // something unusual: show it as written
    if (dom === "*" && dow === "1-5") return "Every weekday at " + at;
    if (dom === "*" && (dow === "0,6" || dow === "6,0")) return "Every weekend day at " + at;
    if (dom === "*" && /^\d$/.test(dow)) return "Every " + DAYS[Number(dow)] + " at " + at;
    if (dom === "*" && dow === "*") return "Every day at " + at;
    if (/^\d+$/.test(dom) && dow === "*") return "Monthly on day " + dom + " at " + at;
    return String(cron);
  }

  // ======================================================================
  //  HOME DASHBOARD
  // ======================================================================
  let currentUser = null;
  let dashCards = null;      // array of card entries; null until loaded
  let dashDirty = false;     // a chat/voice turn may have changed the cards
  let adderOpen = false;
  let clockTimer = null;

  function iconFor(entry) {
    return icon(iconName(entry.type === "widget" ? entry.widget : entry.module));
  }

  function twoLine(primary, secondary) {
    return el("span", { class: "twoline" }, [
      el("strong", { text: primary || "" }),
      el("span", { class: "muted", text: secondary ? "  " + secondary : "" }),
    ]);
  }

  // A card backed by a module's read `summary` tool: fixed tiles + a recent list.
  function serviceWidget(module, tiles, line) {
    return async function (body) {
      body.appendChild(el("div", { class: "muted", text: "Loading…" }));
      const r = await api("POST", "/api/tools/" + module + "/summary", { args: {} });
      body.textContent = "";
      if (reauthed(r)) return;
      if (!r.ok || !r.data.ok) { body.appendChild(el("div", { class: "muted", text: toolError(r) })); return; }
      const p = r.data.result || {};
      if (p.configured === false) { body.appendChild(el("div", { class: "muted", text: "This app still needs its details, on its page under Apps." })); return; }
      if (p.error) { body.appendChild(el("div", { class: "muted", text: String(p.error) })); return; }
      const row = el("div", { class: "tiles" });
      tiles.forEach(function (t) {
        row.appendChild(el("div", { class: "tile" }, [
          el("span", { class: "n", text: (p[t.key] == null ? "–" : String(p[t.key])) }),
          el("span", { class: "l", text: t.label }),
        ]));
      });
      body.appendChild(row);
      const recent = p.recent || [];
      if (recent.length) {
        const ul = el("ul");
        recent.slice(0, 5).forEach(function (item) { ul.appendChild(el("li", null, [line(item)])); });
        body.appendChild(ul);
      }
    };
  }

  function toolError(r) {
    const why = (r.data && r.data.error) || "";
    if (why === "unknown_module") return "Not installed. Add it under Apps.";
    if (why === "module_not_ready" || why === "not_readonly") return "Set it up on its page under Apps.";
    return "Unavailable right now.";
  }

  // A pinned card that shows any read tool's result, rendered generically.
  function itemPrimary(it) {
    if (it == null) return "";
    if (typeof it !== "object") return String(it);
    const line = it.line || it.route || it.number;
    const dest = it.to || it.destination || it.headsign;
    if (line && dest) return String(line) + " → " + String(dest);
    const keys = ["title", "name", "summary", "subject", "label", "to", "destination", "from", "station", "headsign", "key", "query"];
    for (let i = 0; i < keys.length; i++) if (it[keys[i]]) return String(it[keys[i]]);
    return JSON.stringify(it).slice(0, 90);
  }
  function itemSecondary(it) {
    if (it == null || typeof it !== "object") return "";
    const keys = ["departure", "time", "at", "when", "platform", "published", "date", "repo", "project", "subject", "address", "value"];
    const bits = [];
    for (let i = 0; i < keys.length && bits.length < 2; i++) {
      if (it[keys[i]] != null && it[keys[i]] !== "") bits.push(String(it[keys[i]]));
    }
    return bits.join("  ·  ");
  }
  function genericRender(body, result) {
    if (!result || typeof result !== "object") { body.appendChild(el("div", { class: "muted", text: "No data." })); return; }
    if (result.configured === false) { body.appendChild(el("div", { class: "muted", text: "This app still needs its details, on its page under Apps." })); return; }
    if (result.error) { body.appendChild(el("div", { class: "muted", text: String(result.error) })); return; }
    const tiles = [];
    let arr = null;
    Object.keys(result).forEach(function (k) {
      const v = result[k];
      if (typeof v === "number") tiles.push({ k: k, v: v });
      else if (!arr && Array.isArray(v) && v.length) arr = v;
    });
    if (tiles.length) {
      const row = el("div", { class: "tiles" });
      tiles.slice(0, 4).forEach(function (t) {
        row.appendChild(el("div", { class: "tile" }, [
          el("span", { class: "n", text: String(t.v) }),
          el("span", { class: "l", text: t.k.replace(/_/g, " ") }),
        ]));
      });
      body.appendChild(row);
    }
    if (arr) {
      const ul = el("ul");
      arr.slice(0, 6).forEach(function (item) { ul.appendChild(el("li", null, [twoLine(itemPrimary(item), itemSecondary(item))])); });
      body.appendChild(ul);
    } else if (!tiles.length) {
      body.appendChild(el("div", { class: "muted", text: "Nothing to show right now." }));
    }
  }
  function toolCardRender(card) {
    return async function (body) {
      body.appendChild(el("div", { class: "muted", text: "Loading…" }));
      const r = await api("POST", "/api/tools/" + encodeURIComponent(card.module) + "/" + encodeURIComponent(card.tool), { args: card.args || {} });
      body.textContent = "";
      if (reauthed(r)) return;
      if (!r.ok || !r.data.ok) { body.appendChild(el("div", { class: "muted", text: toolError(r) })); return; }
      genericRender(body, r.data.result || {});
    };
  }

  const WIDGETS = {
    clock:    { title: "Clock", render: renderClock },
    quickask: { title: "Quick ask", wide: true, render: renderQuickAsk },
    places:   { title: "Saved places", render: renderPlacesWidget },
    routines: { title: "Upcoming routines", render: renderRoutinesWidget },
    notes:    { title: "Assistant remembers", render: renderNotesWidget },
    github:   { title: "GitHub", render: serviceWidget("github",
      [{ key: "notifications", label: "Inbox" }, { key: "review_requests", label: "Reviews" }, { key: "assigned_issues", label: "Issues" }],
      function (it) { return twoLine(it.title, it.repo); }) },
    gitlab:   { title: "GitLab", render: serviceWidget("gitlab",
      [{ key: "todos", label: "To-dos" }, { key: "assigned_merge_requests", label: "MRs" }, { key: "assigned_issues", label: "Issues" }],
      function (it) { return twoLine(it.title, it.project); }) },
    email:    { title: "Email", render: serviceWidget("email",
      [{ key: "unread", label: "Unread" }, { key: "total", label: "Total" }],
      function (it) { return twoLine(it.from, it.subject); }) },
  };
  function defaultDash() {
    return [
      { id: "w:clock", type: "widget", widget: "clock" },
      { id: "w:quickask", type: "widget", widget: "quickask" },
      { id: "w:places", type: "widget", widget: "places" },
      { id: "w:routines", type: "widget", widget: "routines" },
    ];
  }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }

  async function loadDash() {
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const settings = (r.ok && r.data && r.data.settings) || {};
    // apply the owner's appearance and preferences while we have them in hand
    if (settings["ui:accent"]) applyAccent(settings["ui:accent"]);
    if (settings["ui:theme"]) applyTheme(settings["ui:theme"]);
    adoptPrefs(settings["ui:prefs"]);
    let cards = settings["ui:dashboard"];
    if (!Array.isArray(cards)) {
      const old = settings["ui:layout:" + (currentUser || "_")];
      if (Array.isArray(old) && old.length) {
        cards = old.filter(function (k) { return WIDGETS[k]; }).map(function (k) { return { id: "w:" + k, type: "widget", widget: k }; });
      } else {
        cards = defaultDash();
      }
    }
    dashCards = cards.filter(function (e) {
      if (!e || typeof e !== "object") return false;
      if (e.type === "widget") return !!WIDGETS[e.widget];
      return e.type === "tool" && !!e.module && !!e.tool;
    }).map(function (e) {
      if (!e.id) e.id = e.type === "widget" ? ("w:" + e.widget) : (e.module + "." + e.tool);
      if (e.type === "tool" && !e.args) e.args = {};
      return e;
    });
    if (!dashCards.length) dashCards = defaultDash();
  }
  async function saveDash() {
    await api("PUT", "/api/settings/" + encodeURIComponent("ui:dashboard"), { value: dashCards });
  }

  function hashArgs(args) {
    const s = JSON.stringify(args);
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(16).slice(0, 8);
  }
  function toolCardTitle(module, tool, args) {
    const words = tool.replace(/_/g, " ");
    const label = words.charAt(0).toUpperCase() + words.slice(1);
    const keys = ["station", "from", "query", "name", "location", "city", "q"];
    for (let i = 0; i < keys.length; i++) {
      if (typeof args[keys[i]] === "string" && args[keys[i]].trim()) return label + " · " + args[keys[i]].trim();
    }
    return label;
  }

  function addWidget(key) {
    if (dashCards.some(function (e) { return e.type === "widget" && e.widget === key; })) return;
    dashCards.push({ id: "w:" + key, type: "widget", widget: key });
    adderOpen = false; saveDash(); renderHome();
  }
  function addToolCard(module, tool, args, title) {
    const id = module + "." + tool + (Object.keys(args).length ? ":" + hashArgs(args) : "");
    dashCards = dashCards.filter(function (e) { return e.id !== id; });
    dashCards.push({ id: id, type: "tool", module: module, tool: tool, args: args, title: title || toolCardTitle(module, tool, args) });
    adderOpen = false; saveDash(); renderHome();
  }
  function removeCard(id) {
    dashCards = dashCards.filter(function (e) { return e.id !== id; });
    saveDash(); renderHome();
  }

  // ---- drag to reorder --------------------------------------------------
  // The card you hold is lifted out of the grid and follows the pointer, a
  // dashed slot shows where it will land, and the cards it displaces slide out
  // of the way (measure, move, invert, play). Dragging only starts after a few
  // pixels of movement, so a tap on the handle is still just a tap.
  const DRAG_THRESHOLD = 4;

  function slideNeighbours(grid, skip, before) {
    if (!animate()) return;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === skip || !before.has(c)) return;
      const now = c.getBoundingClientRect();
      const was = before.get(c);
      const dx = was.left - now.left, dy = was.top - now.top;
      if (!dx && !dy) return;
      c.style.transition = "none";
      c.style.transform = "translate(" + dx + "px," + dy + "px)";
      requestAnimationFrame(function () {
        c.style.transition = "";
        c.style.transform = "";
      });
    });
  }
  function positions(grid) {
    const map = new Map();
    Array.prototype.forEach.call(grid.children, function (c) { map.set(c, c.getBoundingClientRect()); });
    return map;
  }
  function nearestCard(grid, exclude, x, y) {
    let best = null, bd = Infinity;
    Array.prototype.forEach.call(grid.children, function (c) {
      if (c === exclude || !c.dataset || !c.dataset.id) return;
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
      if (d < bd) { bd = d; best = c; }
    });
    return best;
  }
  function commitOrder(grid) {
    const order = Array.prototype.map.call(grid.children, function (c) { return c.dataset.id; }).filter(Boolean);
    const byId = {};
    dashCards.forEach(function (e) { byId[e.id] = e; });
    const next = order.map(function (id) { return byId[id]; }).filter(Boolean);
    if (next.length === dashCards.length) { dashCards = next; saveDash(); }
  }

  function attachDrag(handle, card) {
    handle.addEventListener("pointerdown", function (down) {
      if (down.button !== undefined && down.button !== 0) return;
      // The header holds the remove button; pressing it is a click, not a grab.
      if (down.target && down.target.closest && down.target.closest(".cardx")) return;
      down.preventDefault();
      const grid = $("dashGrid");
      if (!grid) return;

      let dragging = false, slot = null, rect = null, dx = 0, dy = 0;
      const startX = down.clientX, startY = down.clientY;
      try { handle.setPointerCapture(down.pointerId); } catch (e) { /* fine without capture */ }

      const begin = function () {
        dragging = true;
        rect = card.getBoundingClientRect();
        dx = startX - rect.left;
        dy = startY - rect.top;
        // A slot of exactly the card's size keeps the grid from reflowing the
        // moment the card leaves it.
        slot = el("div", { class: "drop-slot" });
        slot.style.setProperty("height", rect.height + "px");
        if (card.classList.contains("wide")) slot.className = "drop-slot wide";
        grid.insertBefore(slot, card);
        card.style.setProperty("width", rect.width + "px");
        card.style.setProperty("height", rect.height + "px");
        card.style.setProperty("left", rect.left + "px");
        card.style.setProperty("top", rect.top + "px");
        card.classList.add("lifted");
        grid.classList.add("dragging");
        document.body.classList.add("dragging");
      };

      const move = function (ev) {
        if (!dragging) {
          if (Math.abs(ev.clientX - startX) < DRAG_THRESHOLD && Math.abs(ev.clientY - startY) < DRAG_THRESHOLD) return;
          begin();
        }
        card.style.setProperty("left", (ev.clientX - dx) + "px");
        card.style.setProperty("top", (ev.clientY - dy) + "px");
        const target = nearestCard(grid, card, ev.clientX, ev.clientY);
        if (!target || target === slot) return;
        const r = target.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const sameRow = Math.abs(ev.clientY - cy) < r.height * 0.6;
        const before = sameRow ? (ev.clientX < cx) : (ev.clientY < cy);
        const wanted = before ? target : target.nextSibling;
        if (wanted === slot || (before && slot.nextSibling === target && slot === target.previousSibling)) return;
        const was = positions(grid);
        grid.insertBefore(slot, wanted);
        slideNeighbours(grid, card, was);
      };

      const finish = function () {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
        try { handle.releasePointerCapture(down.pointerId); } catch (e) { /* already released */ }
        if (!dragging) return;                       // a click, not a drag
        const landing = slot.getBoundingClientRect();
        const settle = function () {
          card.classList.remove("lifted", "settling");
          ["width", "height", "left", "top", "transform"].forEach(function (prop) { card.style.removeProperty(prop); });
          grid.insertBefore(card, slot);
          slot.remove();
          grid.classList.remove("dragging");
          document.body.classList.remove("dragging");
          commitOrder(grid);
        };
        if (!animate()) { settle(); return; }
        // Drop it into the slot rather than snapping there.
        card.classList.add("settling");
        card.style.setProperty("left", landing.left + "px");
        card.style.setProperty("top", landing.top + "px");
        card.style.setProperty("transform", "none");
        let done = false;
        const once = function () { if (done) return; done = true; card.removeEventListener("transitionend", once); settle(); };
        card.addEventListener("transitionend", once);
        setTimeout(once, 260);                       // in case the transition never fires
      };

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  function buildCard(entry) {
    const def = entry.type === "widget" ? WIDGETS[entry.widget] : null;
    const card = el("div", { class: "widget" + (def && def.wide ? " wide" : "") });
    card.dataset.id = entry.id;
    const title = entry.type === "widget" ? (def ? def.title : entry.widget) : entry.title;
    const grip = el("span", { class: "grip", title: "Drag to move", "aria-hidden": "true" }, [icon("grip", "i-sm")]);
    const rm = el("button", { class: "cardx", type: "button", title: "Remove card", "aria-label": "Remove card",
      onclick: function () { removeCard(entry.id); } }, [icon("x", "i-sm")]);
    const head = el("div", { class: "widget-head" }, [
      iconFor(entry),
      el("h3", { text: title || "Card" }),
      el("span", { class: "spacer" }),
      grip, rm,
    ]);
    card.appendChild(head);
    const body = el("div", { class: "widget-body" });
    card.appendChild(body);
    if (entry.type === "widget" && def) def.render(body);
    else if (entry.type === "tool") toolCardRender(entry)(body);
    else body.appendChild(el("div", { class: "muted", text: "Unknown card." }));
    attachDrag(head, card);   // the whole title bar drags, not just the grip
    return card;
  }

  async function buildAdder(container) {
    container.textContent = "";
    container.appendChild(el("h3", { class: "adder-title", text: "Add a card" }));
    const present = {};
    dashCards.forEach(function (e) { if (e.type === "widget") present[e.widget] = true; });
    const chips = el("div", { class: "chiprow" });
    Object.keys(WIDGETS).forEach(function (key) {
      if (present[key]) return;
      chips.appendChild(el("button", { class: "chip", type: "button", onclick: function () { addWidget(key); } },
        [icon(iconName(key), "i-sm"), WIDGETS[key].title]));
    });
    if (chips.children.length) {
      container.appendChild(el("div", { class: "field-label", text: "Ready made" }));
      container.appendChild(chips);
    }

    container.appendChild(el("div", { class: "field-label", text: "From one of your apps" }));
    const mods = await loadModules();
    // Only read-only tools can back a card, so only those are offered.
    const choices = [];
    mods.forEach(function (m) {
      (m.tools || []).forEach(function (tool) {
        if (tool["class"] !== "read") return;
        choices.push({ module: m.name, tool: tool.name, schema: tool.schema, about: tool.description || "",
          label: appName(m.name) + " · " + humanizeWords(tool.name) });
      });
    });
    if (!choices.length) {
      blank(container, "Add an app and its information can live here.", "Browse apps", function () { selectTab("apps"); });
      container.appendChild(el("div", { class: "row-actions" }, [
        el("button", { class: "btn ghost small", type: "button", text: "Close",
          onclick: function () { adderOpen = false; renderHome(); headerActions(); } }),
      ]));
      return;
    }

    const what = el("select");
    choices.forEach(function (c, i) { what.appendChild(el("option", { value: String(i), text: c.label })); });
    const about = el("p", { class: "note" });
    const fieldsBox = el("div");
    const titleInp = el("input", { type: "text", placeholder: "leave empty and we will name it" });
    const err = el("div", { class: "err" });
    let fields = null;
    const buildFields = function () {
      fieldsBox.textContent = "";
      const choice = choices[Number(what.value) || 0];
      about.textContent = choice ? firstSentence(choice.about, 160) : "";
      fields = fieldsFromSchema(choice && choice.schema);
      if (!fields.empty) fieldsBox.appendChild(fields.node);
    };
    what.addEventListener("change", buildFields);

    const addB = el("button", { class: "btn primary small", type: "button", text: "Add to home" });
    addB.addEventListener("click", function () {
      err.textContent = "";
      const choice = choices[Number(what.value) || 0];
      const short = fields ? fields.missing() : [];
      if (short.length) { err.textContent = "Still needed: " + short.join(", ") + "."; return; }
      addToolCard(choice.module, choice.tool, fields ? fields.values() : {}, titleInp.value.trim());
    });

    container.appendChild(el("div", { class: "adder-form" }, [
      el("label", { class: "field full" }, ["Show me", what]),
    ]));
    container.appendChild(about);
    container.appendChild(fieldsBox);
    container.appendChild(el("div", { class: "adder-form" }, [
      el("label", { class: "field full" }, ["Card title", titleInp]),
    ]));
    container.appendChild(err);
    container.appendChild(el("div", { class: "row-actions" }, [addB,
      el("button", { class: "btn ghost small", type: "button", text: "Close",
        onclick: function () { adderOpen = false; renderHome(); headerActions(); } })]));
    buildFields();
  }

  async function renderHome() {
    const panel = $("home");
    stopClock();
    if (dashCards === null || dashDirty) { dashDirty = false; await loadDash(); }
    panel.textContent = "";
    panel.className = "panel active";
    if (adderOpen) {
      const adder = el("div", { class: "adder" });
      panel.appendChild(adder);
      buildAdder(adder);
    }
    const grid = el("div", { class: "grid-wrap", id: "dashGrid" });
    dashCards.forEach(function (entry) { grid.appendChild(buildCard(entry)); });
    panel.appendChild(grid);
    if (!dashCards.length) {
      panel.appendChild(el("p", { class: "muted", text: "No cards yet. Add one, or just ask the assistant to show you something." }));
    }
  }

  function renderClock(body) {
    const big = el("div", { class: "big" });
    const date = el("div", { class: "muted" });
    body.appendChild(big); body.appendChild(date);
    const tick = function () {
      const now = new Date();
      const opts = { hour: "2-digit", minute: "2-digit", hour12: !prefs.clock24 };
      if (prefs.clockSeconds) opts.second = "2-digit";
      big.textContent = now.toLocaleTimeString(undefined, opts);
      date.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    };
    tick();
    clockTimer = setInterval(tick, prefs.clockSeconds ? 1000 : 15000);
  }
  function renderQuickAsk(body) {
    const box = el("input", { type: "text", placeholder: "Ask the assistant…" });
    const btn = el("button", { class: "btn primary", type: "button", text: "Ask" });
    const go = function () {
      const text = box.value.trim();
      if (!text) return;
      box.value = "";
      selectTab("thread");
      send(text);
    };
    btn.addEventListener("click", go);
    box.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    body.appendChild(el("div", { class: "quickask" }, [box, btn]));
  }
  async function renderPlacesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    const r = await api("GET", "/api/locations");
    if (reauthed(r)) return;
    const places = (r.ok && r.data.locations) || [];
    if (!places.length) {
      ul.remove();
      blank(body, "Add the places you talk about, like home or work.", "Add a place", function () { openSettings("places"); });
      return;
    }
    places.forEach(function (p) {
      const where = (p.latitude != null) ? (p.latitude + ", " + p.longitude) : (p.address || "");
      ul.appendChild(el("li", null, [twoLine(p.label || p.name, where)]));
    });
  }
  async function renderRoutinesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    await loadModules();          // so a step reads as words, not module.tool
    const r = await api("GET", "/api/schedules");
    if (reauthed(r)) return;
    const rows = ((r.ok && r.data.schedules) || []).filter(function (s) { return s.enabled; });
    if (!rows.length) {
      ul.remove();
      blank(body, "Nothing runs automatically yet.", "Set one up", function () { openSettings("schedules"); });
      return;
    }
    rows.slice(0, 6).forEach(function (s) {
      ul.appendChild(el("li", null, [twoLine(describeCron(s.cron), describeSteps(s.steps))]));
    });
  }
  async function renderNotesWidget(body) {
    const ul = el("ul"); body.appendChild(ul);
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const memory = (r.ok && r.data.memory) || {};
    const keys = Object.keys(memory);
    if (!keys.length) {
      ul.remove();
      blank(body, "Tell the assistant something to remember and it appears here.", "Ask it", function () { selectTab("thread"); });
      return;
    }
    keys.forEach(function (k) { ul.appendChild(el("li", null, [twoLine(k, JSON.stringify(memory[k]))])); });
  }

  // ======================================================================
  //  SETTINGS (behind your name: places, automations, preferences, people)
  // ======================================================================
  // Apps are NOT in here any more. They live in the sidebar, because they are
  // places to go, not knobs to turn. What is left under your name is the
  // household's shared data, how this page looks, and who may sign in.
  let settingsSection = null;   // null means the list of sections
  let moduleCache = null;              // installed modules, for building friendly choices
  const SECTIONS = [
    ["places", "Places", "pin", "Names for the places you talk about"],
    ["schedules", "Automations", "repeat", "Things that happen on their own"],
    ["prefs", "Preferences", "settings", "How this app looks and behaves"],
    ["account", "Your account", "user", "Your name, and your password"],
    // The trailing flag means: only an admin is shown this. The server refuses
    // it either way; hiding it is so a plain user is not offered a locked door.
    ["people", "People", "people", "Who can sign in, and what they may do", true],
  ];
  function sections() {
    return SECTIONS.filter(function (s) { return !s[4] || isAdmin(); });
  }
  function openSettings(section) {
    settingsSection = section || null;
    selectTab("settings");
  }
  async function loadModules(force) {
    if (moduleCache && !force) return moduleCache;
    const r = await api("GET", "/api/modules");
    if (reauthed(r)) return [];
    moduleCache = (r.ok && r.data.modules) || [];
    // The server says whether this account may manage apps. The page uses its
    // own is_admin to decide what to draw; this is the same answer from the
    // other end, and the one that actually governs.
    canManageApps = !!(r.ok && r.data.can_manage);
    return moduleCache;
  }
  // "transit.next_departures" is not something to show a person. Prefer the
  // tool's own description, fall back to plain words.
  function describeSteps(steps) {
    return (steps || []).map(function (st) {
      const mod = (moduleCache || []).filter(function (m) { return m.name === st.module; })[0];
      const tool = mod && (mod.tools || []).filter(function (x) { return x.name === st.tool; })[0];
      const words = (tool && tool.description) ? firstSentence(tool.description, 70) : humanizeWords(st.tool);
      const args = Object.keys(st.args || {}).map(function (k) { return String(st.args[k]); }).join(", ");
      return args ? words + " (" + args + ")" : words;
    }).join(", ");
  }
  function sectionDef(key) {
    return SECTIONS.filter(function (s) { return s[0] === key; })[0] || null;
  }
  function renderSettings() {
    const panel = $("settings");
    panel.textContent = "";
    // A section this account may not see is not rendered even if something
    // asked for it (a stale menu click, a demotion mid-session).
    if (settingsSection && !sections().some(function (s) { return s[0] === settingsSection; })) {
      settingsSection = null;
    }
    const layout = el("div", { class: "settings-layout" });
    layout.dataset.open = settingsSection ? "section" : "list";

    // On a phone this list is the You screen and tapping opens one; on a desk
    // it stays beside the section as a table of contents.
    const list = el("nav", { class: "seclist", "aria-label": "Settings sections" });
    sections().forEach(function (s) {
      const item = el("button", { class: "secitem" + (settingsSection === s[0] ? " active" : ""), type: "button",
        onclick: function () { settingsSection = s[0]; renderSettings(); syncChrome(); } }, [
        icon(s[2]),
        el("span", { class: "grow" }, [s[1]]),
        icon("chevronRight", "i-sm"),
      ]);
      list.appendChild(item);
    });
    layout.appendChild(list);

    const body = el("div", { class: "secbody" });
    layout.appendChild(body);
    panel.appendChild(layout);
    if (settingsSection) {
      ({
        places: renderPlaces,
        schedules: renderSchedules,
        prefs: renderPreferences,
        account: renderAccount,
        people: renderPeople,
      }[settingsSection] || renderPlaces)(body);
    }
    syncChrome();
  }

  async function renderPlaces(root) {
    root.appendChild(el("p", { class: "sub", text: "Give the places you talk about a name, so you can just say “home”." }));
    const list = el("ul", { class: "items" });
    const r = await api("GET", "/api/locations");
    if (reauthed(r)) return;
    (r.data.locations || []).forEach(function (loc) {
      const bits = [];
      if (loc.latitude != null && loc.longitude != null) bits.push(loc.latitude + ", " + loc.longitude);
      if (loc.address) bits.push(loc.address);
      const del = el("button", { class: "btn small danger", type: "button", text: "Delete" });
      del.addEventListener("click", async function () { await api("DELETE", "/api/locations/" + encodeURIComponent(loc.name)); renderSettings(); });
      list.appendChild(el("li", null, [
        el("span", { class: "grow" }, [el("strong", { text: loc.label || loc.name }), el("span", { class: "meta", text: "  " + bits.join("  ·  ") })]),
        del,
      ]));
    });
    const hasPlaces = (r.data.locations || []).length > 0;

    const name = el("input", { type: "text", placeholder: "home" });
    const label = el("input", { type: "text", placeholder: "Home" });
    const lat = el("input", { type: "number", step: "any", placeholder: "latitude" });
    const lon = el("input", { type: "number", step: "any", placeholder: "longitude" });
    const address = el("input", { type: "text", placeholder: "Bahnhofstrasse 1, Zürich" });
    const err = el("div", { class: "err" });
    const save = el("button", { class: "btn primary", type: "button", text: "Save place" });
    save.addEventListener("click", async function () {
      err.textContent = "";
      const n = name.value.trim();
      if (!n) { err.textContent = "Give it a name first."; return; }
      const body = { label: label.value.trim() || null, address: address.value.trim() || null };
      if (lat.value !== "") body.latitude = Number(lat.value);
      if (lon.value !== "") body.longitude = Number(lon.value);
      const res = await api("PUT", "/api/locations/" + encodeURIComponent(n), body);
      if (!res.ok) { err.textContent = "Could not save that. If you entered coordinates, check them."; return; }
      renderSettings();
    });
    // An empty list is not worth a card of its own; the form below is the point.
    if (hasPlaces) root.appendChild(el("div", { class: "card" }, [list]));
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: hasPlaces ? "Add another place" : "Add your first place" }),
      el("div", { class: "grid" }, [
        el("label", { class: "field" }, ["What do you call it?", name]),
        el("label", { class: "field" }, ["Full name (optional)", label]),
        el("label", { class: "field full" }, ["Address (optional)", address]),
      ]),
      // Coordinates are what a weather or transit app actually wants, but nobody
      // should have to meet them first.
      el("details", { class: "advanced" }, [
        el("summary", { text: "Advanced: exact coordinates" }),
        el("div", { class: "grid" }, [
          el("label", { class: "field" }, ["Latitude", lat]),
          el("label", { class: "field" }, ["Longitude", lon]),
        ]),
      ]),
      err,
      el("div", { class: "row-actions" }, [save]),
    ]));
  }

  async function renderSchedules(root) {
    root.appendChild(el("p", { class: "sub", text: "Things that happen on their own, at a time you choose." }));

    await loadModules();
    const r = await api("GET", "/api/schedules");
    if (reauthed(r)) return;
    const rows = r.data.schedules || [];

    if (rows.length) {
      const list = el("div", { class: "card" });
      rows.forEach(function (s) {
        const actions = [];
        if (s.editable) {
          const toggle = el("button", { class: "btn small", type: "button", text: s.enabled ? "Pause" : "Resume" });
          toggle.addEventListener("click", async function () {
            await api("POST", "/api/schedules/" + encodeURIComponent(s.id) + "/enabled", { enabled: !s.enabled });
            renderSettings();
          });
          const del = el("button", { class: "btn small danger", type: "button", text: "Delete" });
          del.addEventListener("click", async function () {
            await api("DELETE", "/api/schedules/" + encodeURIComponent(s.id));
            renderSettings();
          });
          actions.push(toggle, del);
        } else {
          actions.push(el("span", { class: "meta", text: "set up on the hub" }));
        }
        list.appendChild(el("div", { class: "sched" }, [
          el("span", { class: "grow" }, [
            el("div", { class: "when", text: describeCron(s.cron) + (s.enabled ? "" : "  (paused)") }),
            el("div", { class: "what", text: s.description || describeSteps(s.steps) }),
          ]),
        ].concat(actions)));
      });
      root.appendChild(list);
    }

    // ---- the builder: an action, its own fields, and a time ----------------
    const choices = [];
    (moduleCache || []).forEach(function (m) {
      (m.tools || []).forEach(function (tool) {
        // A routine runs unattended, so a destructive tool is never offered here.
        if (tool["class"] === "destructive") return;
        choices.push({ module: m.name, tool: tool.name, schema: tool.schema, ready: m.state === "ready",
          about: tool.description || "",
          label: appName(m.name) + " · " + humanizeWords(tool.name) });
      });
    });

    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { text: rows.length ? "Add another" : "Create your first automation" }));
    if (!choices.length) {
      blank(card, "Install an app first, then you can automate what it does.", "Browse apps", function () { selectTab("apps"); });
      root.appendChild(card);
      return;
    }

    const what = el("select");
    choices.forEach(function (c, i) {
      what.appendChild(el("option", { value: String(i), text: c.label + (c.ready ? "" : " (not set up yet)") }));
    });
    const about = el("p", { class: "note" });
    const fieldsBox = el("div");
    let fields = null;
    const buildFields = function () {
      fieldsBox.textContent = "";
      const choice = choices[Number(what.value) || 0];
      about.textContent = choice ? firstSentence(choice.about, 160) : "";
      fields = fieldsFromSchema(choice && choice.schema);
      if (!fields.empty) fieldsBox.appendChild(fields.node);
    };
    what.addEventListener("change", buildFields);

    const repeat = el("select");
    REPEATS.forEach(function (rp) { repeat.appendChild(el("option", { value: rp[0], text: rp[1] })); });
    const at = el("input", { type: "time", value: "08:00" });
    const weekday = el("select");
    DAYS.forEach(function (d, i) { weekday.appendChild(el("option", { value: String(i), text: d })); });
    weekday.value = "1";
    const monthday = el("input", { type: "number", min: "1", max: "28", value: "1" });
    const atField = el("label", { class: "field" }, ["Time", at]);
    const dayField = el("label", { class: "field" }, ["Day", weekday]);
