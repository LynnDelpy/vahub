<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="referrer" content="no-referrer" />
<title>Assistant</title>
<style>
  /*
   * This page is the assistant, not an operator console. It shows what someone
   * asked, what came back, and anything waiting for their approval. Module
   * states, stderr and the tool catalogue are deliberately absent: they are for
   * whoever runs the service, who has the CLI and the service log.
   *
   * No external fonts, scripts or images, so it works on a network with no
   * route to the internet and leaks nothing to a third party.
   */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #17181c;
    --muted: #6a6f7a;
    --line: #e3e5ea;
    --mine: #2f6feb;
    --mine-fg: #ffffff;
    --theirs: #f2f3f5;
    --warn-bg: #fff6e5;
    --warn-line: #e5a63a;
    --danger: #c8372d;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e9eaee; --muted: #9aa0ab; --line: #2b2d33;
      --mine: #3b7bf0; --theirs: #232529; --warn-bg: #2e2717; --warn-line: #9a7420;
      --danger: #f0645a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: .9rem 1rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .6rem;
  }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .state { font-size: .8rem; color: var(--muted); }

  main {
    flex: 1; overflow-y: auto; padding: 1rem;
    display: flex; flex-direction: column; gap: .7rem;
    max-width: 46rem; width: 100%; margin: 0 auto;
  }
  .msg {
    padding: .6rem .85rem; border-radius: var(--radius); max-width: 85%;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.mine { align-self: flex-end; background: var(--mine); color: var(--mine-fg); border-bottom-right-radius: 5px; }
  .msg.theirs { align-self: flex-start; background: var(--theirs); border-bottom-left-radius: 5px; }
  .msg.problem { align-self: flex-start; background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 26rem; }
  .empty p { margin: .4rem 0; }
  .empty .examples { font-size: .9rem; }

  /* Something needs a person to approve it before it happens. */
  .approval {
    align-self: stretch; background: var(--warn-bg);
    border: 1px solid var(--warn-line); border-radius: var(--radius); padding: .8rem .9rem;
  }
  .approval p { margin: 0 0 .7rem; }
  .approval .what { font-weight: 600; }
  .approval .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .approval button { font: inherit; padding: .45rem .9rem; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
  .approval .yes { background: var(--danger); color: #fff; }
  .approval .no { background: transparent; border-color: var(--line); color: var(--fg); }
  .approval .expiry { font-size: .82rem; color: var(--muted); margin-left: auto; align-self: center; }

  footer { border-top: 1px solid var(--line); padding: .7rem 1rem 1rem; }
  .composer { display: flex; gap: .5rem; max-width: 46rem; margin: 0 auto; }
  .composer input[type=text] {
    flex: 1; font: inherit; padding: .65rem .8rem; border-radius: 11px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0;
  }
  .composer input[type=text]:focus { outline: 2px solid var(--mine); outline-offset: -1px; }
  .composer button {
    font: inherit; padding: .65rem .9rem; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--line); background: var(--theirs); color: var(--fg);
  }
  .composer .send { background: var(--mine); color: var(--mine-fg); border-color: transparent; }
  .composer button[disabled] { opacity: .5; cursor: default; }
  .composer .mic.recording { background: var(--danger); color: #fff; border-color: transparent; }
  .hint { max-width: 46rem; margin: .5rem auto 0; font-size: .8rem; color: var(--muted); display: flex; gap: 1rem; }
  .hint label { cursor: pointer; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
  <header>
    <h1>Assistant</h1>
    <span class="state" id="state" role="status" aria-live="polite"></span>
  </header>

  <main id="thread" aria-live="polite">
    <div class="empty" id="empty">
      <p>Ask for something.</p>
      <p class="examples">"what time is it in Tokyo?"<br />"turn on the kitchen light"</p>
    </div>
  </main>

  <footer>
    <div class="composer">
      <label class="visually-hidden" for="input">Message</label>
      <input id="input" type="text" autocomplete="off" autocapitalize="sentences"
             placeholder="Ask something" />
      <button id="mic" class="mic" type="button" title="Speak" aria-label="Speak">Speak</button>
      <button id="send" class="send" type="button">Send</button>
    </div>
    <div class="hint">
      <label><input type="checkbox" id="readAloud" checked /> read replies aloud</label>
      <span id="voiceNote"></span>
    </div>
  </footer>

<script>
(function () {
  "use strict";

  // Everything the page renders is inserted as text. Replies and approval
  // prompts contain strings that originated in a module, and a module is code
  // this hub did not write, so none of it is ever parsed as markup.
  const thread   = document.getElementById("thread");
  const empty    = document.getElementById("empty");
  const input    = document.getElementById("input");
  const sendBtn  = document.getElementById("send");
  const micBtn   = document.getElementById("mic");
  const readBox  = document.getElementById("readAloud");
  const stateEl  = document.getElementById("state");
  const voiceNote = document.getElementById("voiceNote");

  let sessionId = null;
  let config = { stt_provider: "browser", tts_provider: "browser" };
  const shown = new Set();   // approval ids already on screen

  function atBottom() {
    return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
  }
  function scroll(force) {
    if (force || atBottom()) thread.scrollTop = thread.scrollHeight;
  }
  function clearEmpty() {
    if (empty && empty.parentNode) empty.remove();
  }
  function bubble(text, kind) {
    clearEmpty();
    const stick = atBottom();
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    thread.appendChild(el);
    scroll(stick);
    return el;
  }
  function setState(text) { stateEl.textContent = text || ""; }

  // ---- speaking ---------------------------------------------------------
  function speak(text) {
    if (!text || !readBox.checked) return;
    if (config.tts_provider !== "browser") return;   // the server sent audio
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  // ---- approvals --------------------------------------------------------
  // The hub refuses to perform a destructive action on the model's say-so. It
  // parks the call with the arguments frozen and waits for a person here.
  function describe(p) {
    const what = (p.module || "") + "." + (p.tool || "");
    return p.reason ? what + " (" + p.reason + ")" : what;
  }

  function showApproval(p) {
    const id = p.pending_id || p.id;
    if (!id || shown.has(id)) return;
    shown.add(id);
    clearEmpty();

    const card = document.createElement("div");
    card.className = "approval";

    const line = document.createElement("p");
    const lead = document.createElement("span");
    lead.textContent = "Needs your approval: ";
    const what = document.createElement("span");
    what.className = "what";
    what.textContent = describe(p);
    line.append(lead, what);

    const row = document.createElement("div");
    row.className = "row";
    const yes = document.createElement("button");
    yes.className = "yes"; yes.type = "button"; yes.textContent = "Approve";
    const no = document.createElement("button");
    no.className = "no"; no.type = "button"; no.textContent = "Dismiss";
    const expiry = document.createElement("span");
    expiry.className = "expiry";

    row.append(yes, no, expiry);
    card.append(line, row);
    thread.appendChild(card);
    scroll(true);

    // The approval expires. Saying so avoids someone approving into a void.
    let countdown = null;
    if (p.expires_at) {
      const tick = function () {
        const left = Math.round(p.expires_at - Date.now() / 1000);
        if (left <= 0) {
          clearInterval(countdown);
          card.remove();
          bubble("That approval expired. Ask again if you still want it.", "theirs");
        } else {
          expiry.textContent = left + "s left";
        }
      };
      tick();
      countdown = setInterval(tick, 1000);
    }

    const finish = function (text, kind) {
      if (countdown) clearInterval(countdown);
      card.remove();
      if (text) bubble(text, kind || "theirs");
    };

    yes.addEventListener("click", async function () {
      yes.disabled = no.disabled = true;
      try {
        const r = await fetch("/api/confirm/" + encodeURIComponent(id), { method: "POST" });
        const data = await r.json().catch(function () { return {}; });
        if (r.ok && data.ok) finish("Done.");
        else finish("It did not go through: " + (data.detail || data.error || r.status), "problem");
      } catch (e) {
        finish("It did not go through: " + e, "problem");
      }
    });
    no.addEventListener("click", function () { finish("Left alone."); });
  }

  async function loadPending() {
    try {
      const r = await fetch("/api/pending");
      if (!r.ok) return;
      const rows = await r.json();
      if (Array.isArray(rows)) rows.forEach(showApproval);
    } catch (e) { /* nothing waiting is the normal case */ }
  }

  // ---- live approvals over the socket -----------------------------------
  function connect() {
    let ws;
    try {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws/events");
    } catch (e) { return; }

    ws.onopen = function () { setState(""); loadPending(); };
    ws.onclose = function () {
      // Losing the socket only costs live approval prompts; typing still works,
      // so this is a quiet note rather than an error.
      setState("reconnecting");
      setTimeout(connect, 2000);
    };
    ws.onmessage = function (ev) {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg && msg.type === "confirm" && msg.data) showApproval(msg.data);
    };
  }

  // ---- sending ----------------------------------------------------------
  async function send(text) {
    const message = (text !== undefined ? text : input.value).trim();
    if (!message) return;
    input.value = "";
    sendBtn.disabled = true;
    bubble(message, "mine");
    const pending = bubble("...", "theirs thinking");

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message: message, session_id: sessionId }),
      });
      const data = await r.json().catch(function () { return {}; });
      pending.remove();
      if (!r.ok) {
        bubble(data.detail || ("Something went wrong (" + r.status + ")."), "problem");
        return;
      }
      sessionId = data.session_id || sessionId;
      const reply = data.reply || "";
      if (reply) { bubble(reply, "theirs"); speak(reply); }
      loadPending();   // the turn may have parked something for approval
    } catch (e) {
      pending.remove();
      bubble("Could not reach the assistant.", "problem");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", function () { send(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ---- microphone -------------------------------------------------------
  let recognizer = null, recorder = null, recording = false;

  function setRecording(on) {
    recording = on;
    micBtn.classList.toggle("recording", on);
    micBtn.textContent = on ? "Stop" : "Speak";
  }

  function useBrowserSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.disabled = true;
      voiceNote.textContent = "Speaking needs Chrome or Edge. Typing works everywhere.";
      return;
    }
    recognizer = new SR();
    recognizer.lang = navigator.language || "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = function (e) { send(e.results[0][0].transcript); };
    recognizer.onend = function () { setRecording(false); };
    recognizer.onerror = function (e) {
      setRecording(false);
      if (e.error !== "aborted") voiceNote.textContent = "Microphone: " + e.error;
    };
    micBtn.addEventListener("click", function () {
      if (recording) { recognizer.stop(); return; }
      setRecording(true);
      try { recognizer.start(); } catch (e) { setRecording(false); }
    });
  }

  function useServerSpeech() {
    micBtn.addEventListener("click", async function () {
      if (recording) { if (recorder) recorder.stop(); return; }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        voiceNote.textContent = "Microphone unavailable.";
        return;
      }
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = async function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        setRecording(false);
        const form = new FormData();
        form.append("audio", new Blob(chunks, { type: recorder.mimeType || "audio/webm" }), "audio.webm");
        if (sessionId) form.append("session_id", sessionId);
        const thinking = bubble("...", "theirs thinking");
        try {
          const r = await fetch("/api/voice", { method: "POST", body: form });
          const data = await r.json().catch(function () { return {}; });
          thinking.remove();
          if (data.ok === false) { bubble(data.detail || data.error, "problem"); return; }
          if (data.transcript) bubble(data.transcript, "mine");
          sessionId = data.session_id || sessionId;
          if (data.reply) bubble(data.reply, "theirs");
          if (data.audio) {
            new Audio("data:" + (data.audio_mime || "audio/mpeg") + ";base64," + data.audio).play();
          } else {
            speak(data.reply || "");
          }
          loadPending();
        } catch (e) {
          thinking.remove();
          bubble("Could not send the recording.", "problem");
        }
      };
      recorder.start();
      setRecording(true);
    });
  }

  async function start() {
    try {
      const r = await fetch("/api/client-config");
      if (r.ok) config = await r.json();
    } catch (e) { /* defaults are fine */ }
    if (config.stt_provider === "openai_compat") useServerSpeech();
    else useBrowserSpeech();
    connect();
    input.focus();
  }

  start();
})();
</script>
</body>
</html>
