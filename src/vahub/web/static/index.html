    const dateField = el("label", { class: "field" }, ["Day of the month", monthday]);
    const syncWhen = function () {
      dayField.hidden = repeat.value !== "weekly";
      dateField.hidden = repeat.value !== "monthly";
      atField.hidden = repeat.value === "hourly";
    };
    repeat.addEventListener("change", syncWhen);

    const err = el("div", { class: "err" });
    const save = el("button", { class: "btn primary", type: "button", text: "Create automation" });
    const cronBox = el("input", { type: "text", placeholder: "leave empty unless you know cron" });

    save.addEventListener("click", async function () {
      err.textContent = "";
      const choice = choices[Number(what.value) || 0];
      const short = fields ? fields.missing() : [];
      if (short.length) { err.textContent = "Still needed: " + short.join(", ") + "."; return; }
      const cron = cronBox.value.trim() || cronFrom(repeat.value, at.value, weekday.value, monthday.value);
      const res = await api("POST", "/api/schedules", {
        cron: cron,
        steps: [{ module: choice.module, tool: choice.tool, args: fields ? fields.values() : {} }],
        description: firstSentence(choice.about, 110) || choice.label.replace(/^\S+\s/, ""),
      });
      if (!res.ok) { err.textContent = "Could not create it: " + (res.data.detail || res.data.error || res.status); return; }
      renderSettings();
    });

    card.appendChild(el("div", { class: "builder" }, [
      el("label", { class: "field" }, ["What should happen?", what]),
      about,
      fieldsBox,
      el("div", { class: "when-row" }, [el("label", { class: "field" }, ["How often?", repeat]), atField, dayField, dateField]),
    ]));
    card.appendChild(el("details", { class: "advanced" }, [
      el("summary", { text: "Advanced: write the schedule as cron" }),
      el("label", { class: "field" }, ["cron expression", cronBox]),
    ]));
    card.appendChild(err);
    card.appendChild(el("div", { class: "row-actions" }, [save]));
    card.appendChild(el("p", { class: "note", text: "An automation runs by itself, so it can only do what the hub already allows without a person present." }));
    root.appendChild(card);
    buildFields();
    syncWhen();
  }

  // ======================================================================
  //  APPS
  // ======================================================================
  // An app is a place you go, so it has a page of its own: what it is, what it
  // can do, and (for an admin) the details it needs and the way to remove it.
  // The list panel exists for the phone, where there is no sidebar to hold it.
  const STATE_WORDS = { ready: "Working", unconfigured: "Needs setup", failed: "Not working", stopped: "Off", degraded: "Having trouble", starting: "Starting" };
  function stateWord(m) { return STATE_WORDS[m && m.state] || (m && m.state) || ""; }
  function appByName(name) {
    return (moduleCache || []).filter(function (m) { return m.name === name; })[0] || null;
  }
  function openApp(name) { currentApp = name; selectTab("app"); }

  async function doInstall(body, errBox, btn) {
    errBox.textContent = "";
    if (body.source !== undefined && !body.source) { errBox.textContent = "Enter a source."; return; }
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Installing…";
    const r = await api("POST", "/api/modules", body);
    btn.disabled = false; btn.textContent = label;
    if (!r.ok || !r.data.ok) { errBox.textContent = "That did not work: " + ((r.data && (r.data.detail || r.data.error)) || r.status); return; }
    await loadModules(true);
    buildRail();
    if (r.data.name) { openApp(r.data.name); return; }
    renderApps();
  }

  // The details an app needs: one row per key the manifest declares. Values go
  // in and never come back: the page only ever learns which keys are set.
  function configSection(m, root) {
    const cfg = m.config || { required: [], optional: [], set: [] };
    const setKeys = cfg.set || [];
    const allKeys = (cfg.required || []).concat(cfg.optional || []);
    if (!allKeys.length) return;
    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { text: "Details it needs" }));
    card.appendChild(el("p", { class: "note", text: "These are kept on the hub and never shown back to you." }));
    allKeys.forEach(function (key) {
      const isReq = (cfg.required || []).indexOf(key) !== -1;
      const isSet = setKeys.indexOf(key) !== -1;
      const inp = el("input", { type: "password", autocomplete: "off",
        placeholder: isSet ? "•••••• saved — type to replace" : (isReq ? "needed" : "optional") });
      const save = el("button", { class: "btn small", type: "button", text: "Save" });
      const err = el("div", { class: "err" });
      save.addEventListener("click", async function () {
        err.textContent = "";
        if (!inp.value) { err.textContent = "Enter a value."; return; }
        const res = await api("PUT", "/api/modules/" + encodeURIComponent(m.name) + "/config/" + encodeURIComponent(key), { value: inp.value });
        if (!res.ok || !res.data.ok) { err.textContent = "Could not save that: " + errorText(res); return; }
        await loadModules(true); buildRail(); renderApp();
      });
      const row = el("div", { class: "cfgrow" }, [
        el("span", { class: "key" + (isReq ? " req" : ""), text: humanizeKey(m.name, key) }),
        inp, save,
      ]);
      if (isSet) {
        const clear = el("button", { class: "btn small danger", type: "button", text: "Clear" });
        clear.addEventListener("click", async function () {
          await api("DELETE", "/api/modules/" + encodeURIComponent(m.name) + "/config/" + encodeURIComponent(key));
          await loadModules(true); buildRail(); renderApp();
        });
        row.appendChild(clear);
      }
      card.appendChild(row);
      card.appendChild(err);
    });
    if (m.missing_config && m.missing_config.length) {
      const needed = m.missing_config.map(function (k) { return humanizeKey(m.name, k); }).join(", ");
      card.appendChild(el("p", { class: "err", text: "Fill in " + needed + " to switch it on." }));
    }
    root.appendChild(card);
  }

  // One app's page.
  async function renderApp() {
    const panel = $("app");
    panel.textContent = "";
    await loadModules();
    const m = appByName(currentApp);
    if (!m) {
      panel.appendChild(el("div", { class: "card" }, [
        el("p", { class: "sub", text: "That app is not installed." }),
      ]));
      const back = el("button", { class: "btn", type: "button", text: "See the apps" });
      back.addEventListener("click", function () { selectTab("apps"); });
      panel.appendChild(el("div", { class: "row-actions" }, [back]));
      syncChrome();
      return;
    }

    const head = el("div", { class: "apphead" }, [
      icon(iconName(m.name), "i-lg"),
      el("span", { class: "grow" }, [
        el("h2", { text: appName(m.name) }),
        el("span", { class: "meta", text: m.version ? "version " + m.version : "" }),
      ]),
      el("span", { class: "badge " + (m.state || ""), text: stateWord(m) }),
    ]);
    panel.appendChild(head);
    if (m.description) panel.appendChild(el("p", { class: "sub", text: m.description }));

    // What it can do, and a one-tap way to put a read tool on the home screen.
    if (m.tools && m.tools.length) {
      const card = el("div", { class: "card" });
      card.appendChild(el("h2", { text: "What it can do" }));
      m.tools.forEach(function (tool) {
        const row = el("div", { class: "toolrow" }, [
          el("span", { class: "grow" }, [
            el("div", { class: "n", text: humanizeWords(tool.name) }),
            el("div", { class: "d", text: firstSentence(tool.description, 120) || "" }),
          ]),
        ]);
        const needs = (tool.schema && tool.schema.required) || [];
        if (tool["class"] === "read" && !needs.length) {
          const add = el("button", { class: "btn small", type: "button", text: "Show on Home" });
          add.addEventListener("click", function () {
            addToolCard(m.name, tool.name, {}, null);
            selectTab("home");
          });
          row.appendChild(add);
        }
        card.appendChild(row);
      });
      panel.appendChild(card);
    }

    if (isAdmin()) {
      configSection(m, panel);
      if (m.has_policy_rule === false) {
        panel.appendChild(el("p", { class: "note", text: "You can put this on your home screen now. Letting the assistant use it on its own is a policy rule, written on the hub." }));
      }
      if (m.last_error) panel.appendChild(el("p", { class: "err", text: String(m.last_error) }));
      const rm = el("button", { class: "btn danger", type: "button", text: "Remove this app" });
      const rmErr = el("div", { class: "err" });
      rm.addEventListener("click", async function () {
        rm.disabled = true;
        const r = await api("DELETE", "/api/modules/" + encodeURIComponent(m.name));
        rm.disabled = false;
        if (!r.ok || !r.data.ok) { rmErr.textContent = "Could not remove it: " + errorText(r); return; }
        currentApp = null;
        await loadModules(true); buildRail(); selectTab("apps");
      });
      panel.appendChild(el("details", { class: "advanced" }, [
        el("summary", { text: "Remove this app" }),
        el("p", { class: "note", text: "Its code and the details you gave it are deleted. Cards and automations that used it stop working." }),
        rmErr,
        el("div", { class: "row-actions" }, [rm]),
      ]));
    } else if (m.state !== "ready") {
      panel.appendChild(el("p", { class: "note", text: "This app is not working yet. Setting one up is an admin's job." }));
    }
    syncChrome();
  }

  // The list of apps: the phone's version of the sidebar's app section, and
  // where an admin adds one.
  async function renderApps() {
    const panel = $("apps");
    panel.textContent = "";
    const mods = await loadModules(true);
    buildRail();

    panel.appendChild(el("p", { class: "sub", text: "What the assistant can reach: your mail, your calendar, your lights. Each one only gets the details you give it." }));

    if (mods.length) {
      const card = el("div", { class: "card" });
      mods.forEach(function (m) {
        const row = el("button", { class: "approw", type: "button" }, [
          icon(iconName(m.name)),
          el("span", { class: "grow" }, [
            el("span", { class: "n", text: appName(m.name) }),
            el("span", { class: "d", text: firstSentence(m.description, 90) || "" }),
          ]),
          el("span", { class: "badge " + (m.state || ""), text: stateWord(m) }),
          icon("chevronRight", "i-sm"),
        ]);
        row.addEventListener("click", function () { openApp(m.name); });
        card.appendChild(row);
      });
      panel.appendChild(card);
    }

    if (!isAdmin()) {
      if (!mods.length) {
        panel.appendChild(el("div", { class: "card" }, [
          el("p", { class: "note", text: "No apps yet. An admin adds these." }),
        ]));
      }
      syncChrome();
      return;
    }

    const avList = el("div");
    const src = el("input", { type: "text", placeholder: "git+https://…@tag#subdir=…, pypi:…, or ./path" });
    const srcErr = el("div", { class: "err" });
    const srcBtn = el("button", { class: "btn", type: "button", text: "Install from source" });
    srcBtn.addEventListener("click", function () { doInstall({ source: src.value.trim() }, srcErr, srcBtn); });
    panel.appendChild(el("div", { class: "card" }, [
      el("h2", { text: "Add an app" }),
      avList,
      // Installing from an arbitrary link is a power-user escape hatch, so it is
      // folded away rather than being the second thing a person sees.
      el("details", { class: "advanced" }, [
        el("summary", { text: "Advanced: install from a link or folder" }),
        el("div", { class: "grid" }, [el("label", { class: "field full" }, ["source", src])]),
        srcErr,
        el("div", { class: "row-actions" }, [srcBtn]),
      ]),
    ]));
    syncChrome();

    const a = await api("GET", "/api/modules/available");
    if (reauthed(a)) return;
    if (a.data && a.data.error) { avList.appendChild(el("p", { class: "note", text: "The app list could not be reached right now." })); return; }
    const notInstalled = ((a.ok && a.data.available) || []).filter(function (it) { return !it.installed; });
    if (!notInstalled.length) { avList.appendChild(el("p", { class: "note", text: "You already have every app on the list." })); return; }
    const ul = el("ul", { class: "items" });
    notInstalled.forEach(function (it) {
      const btn = el("button", { class: "btn small primary", type: "button", text: "Install" });
      const err = el("div", { class: "err" });
      btn.addEventListener("click", function () { doInstall({ name: it.name }, err, btn); });
      ul.appendChild(el("li", null, [
        icon(iconName(it.name)),
        el("span", { class: "grow" }, [
          el("div", null, [el("strong", { text: appName(it.name) })]),
          el("div", { class: "meta", text: it.description || "" }),
        ]),
        btn,
      ]));
      ul.appendChild(err);
    });
    avList.appendChild(ul);
  }

  async function renderPreferences(root) {
    root.appendChild(el("p", { class: "sub", text: "How this app looks and behaves. Everything here takes effect straight away." }));

    // ---- look ------------------------------------------------------------
    const swatches = el("div", { class: "swatches" });
    Object.keys(ACCENTS).forEach(function (name) {
      const sw = el("button", { class: "swatch" + (currentAccent === name ? " active" : ""), type: "button",
        title: humanizeWords(name), "aria-label": humanizeWords(name) });
      sw.style.setProperty("background", ACCENTS[name]);   // CSSOM write, not a style attribute
      sw.addEventListener("click", async function () {
        applyAccent(name);
        await api("PUT", "/api/settings/" + encodeURIComponent("ui:accent"), { value: name });
        renderSettings();
      });
      swatches.appendChild(sw);
    });
    const look = el("div", { class: "card" }, [
      segmentedRow("Theme", "Follow the system, or pick one.", [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]], currentTheme,
        async function (v) { applyTheme(v); await api("PUT", "/api/settings/" + encodeURIComponent("ui:theme"), { value: v }); renderSettings(); }),
      el("div", { class: "setrow" }, [
        el("div", { class: "text" }, [el("div", { class: "name", text: "Colour" }), el("div", { class: "why", text: "Used for buttons and highlights." })]),
      ]),
      swatches,
    ]);
    root.appendChild(el("div", { class: "grouplabel", text: "Look" }));
    root.appendChild(look);

    // ---- behaviour -------------------------------------------------------
    const keep = async function () { await savePrefs(); renderSettings(); };
    const behaviour = el("div", { class: "card" }, [
      segmentedRow("Start on", "The page you see when you open the app.", [["home", "Home"], ["thread", "Chat"]], prefs.startPage,
        function (v) { prefs.startPage = v; keep(); }),
      switchRow("Read replies aloud", "Speak the assistant's answers.", prefs.readAloud,
        function (on) { prefs.readAloud = on; readBox.checked = on; keep(); }),
      switchRow("24-hour clock", "Show 14:00 instead of 2:00 pm.", prefs.clock24,
        function (on) { prefs.clock24 = on; keep(); }),
      switchRow("Show seconds", "On the clock card.", prefs.clockSeconds,
        function (on) { prefs.clockSeconds = on; keep(); }),
      switchRow("Animations", "Cards glide when you move them. Turn off for less motion.", prefs.motion,
        function (on) { prefs.motion = on; keep(); }),
    ]);
    root.appendChild(el("div", { class: "grouplabel", text: "Behaviour" }));
    root.appendChild(behaviour);

    // ---- what the assistant remembers ------------------------------------
    const r = await api("GET", "/api/settings");
    if (reauthed(r)) return;
    const memory = r.data.memory || {};
    const keys = Object.keys(memory);
    root.appendChild(el("div", { class: "grouplabel", text: "What the assistant remembers" }));
    const memCard = el("div", { class: "card" });
    if (!keys.length) {
      blank(memCard, "Nothing yet. Say “remember that I live in Zürich” and it shows up here.", "Say it", function () { selectTab("thread"); });
    } else {
      const memList = el("ul", { class: "items" });
      keys.forEach(function (k) {
        memList.appendChild(el("li", null, [
          el("span", { class: "grow" }, [
            el("strong", { text: humanizeWords(k) }),
            el("span", { class: "meta", text: "  " + String(memory[k]) }),
          ]),
        ]));
      });
      memCard.appendChild(memList);
      memCard.appendChild(el("p", { class: "note", text: "Ask the assistant to forget one to remove it." }));
    }
    root.appendChild(memCard);

    // Raw key/value settings still exist for anyone who wants them, but they are
    // not the thing a person is shown first.
    const prefs_raw = r.data.settings || {};
    const rawKeys = Object.keys(prefs_raw).filter(function (k) { return k.indexOf("ui:") !== 0; });
    const adv = el("details", { class: "advanced" }, [el("summary", { text: "Advanced: stored values" })]);
    const list = el("ul", { class: "items" });
    rawKeys.forEach(function (k) {
      const del = el("button", { class: "btn small danger", type: "button", text: "Delete" });
      del.addEventListener("click", async function () { await api("DELETE", "/api/settings/" + encodeURIComponent(k)); renderSettings(); });
      list.appendChild(el("li", null, [
        el("span", { class: "grow" }, [el("strong", { text: k }), el("span", { class: "meta", text: "  " + JSON.stringify(prefs_raw[k]) })]),
        del,
      ]));
    });
    if (!rawKeys.length) list.appendChild(el("li", { class: "note", text: "Nothing stored beyond the settings above." }));
    adv.appendChild(el("div", { class: "card" }, [list]));
    root.appendChild(adv);
  }

  // ======================================================================
  //  YOUR ACCOUNT, AND PEOPLE
  // ======================================================================
  async function renderAccount(root) {
    root.appendChild(el("p", { class: "sub", text: "Who you are signed in as, and how to change your password." }));

    root.appendChild(el("div", { class: "card" }, [
      el("div", { class: "apphead" }, [
        el("span", { class: "avatar lg", text: initials(personName()) }),
        el("span", { class: "grow" }, [
          el("div", null, [el("strong", { text: personName() })]),
          el("div", { class: "meta", text: currentUser ? "@" + currentUser : "no account: the hub is behind a proxy" }),
        ]),
        el("span", { class: "tag" + (isAdmin() ? " admin" : ""), text: roleWord() }),
      ]),
      el("p", { class: "note", text: isAdmin()
        ? "As an admin you can add apps, give them their details, and manage who else can sign in."
        : "You can use the assistant, arrange your home screen, save places and set up automations. Adding apps and managing people is an admin's job." }),
    ]));

    if (!currentUser) return;   // login off: there is no password to change

    const cur = el("input", { type: "password", autocomplete: "current-password" });
    const next = el("input", { type: "password", autocomplete: "new-password" });
    const again = el("input", { type: "password", autocomplete: "new-password" });
    const err = el("div", { class: "err" });
    const ok = el("p", { class: "note" });
    const save = el("button", { class: "btn primary", type: "submit", text: "Change password" });
    const form = el("form", null, [
      el("div", { class: "grid" }, [
        el("label", { class: "field" }, ["Current password", cur]),
        el("label", { class: "field" }, ["New password (8+ characters)", next]),
        el("label", { class: "field" }, ["New password again", again]),
      ]),
      err, ok,
      el("div", { class: "row-actions" }, [save]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = ""; ok.textContent = "";
      if (next.value !== again.value) { err.textContent = "The new passwords do not match."; return; }
      save.disabled = true;
      const r = await api("POST", "/api/me/password", { current_password: cur.value, password: next.value });
      save.disabled = false;
      if (!r.ok || !r.data.ok) { err.textContent = "Could not change it: " + errorText(r); return; }
      cur.value = next.value = again.value = "";
      ok.textContent = "Changed. Anywhere else you were signed in has been signed out.";
    });
    root.appendChild(el("div", { class: "card" }, [el("h2", { text: "Change your password" }), form]));

    const out = el("button", { class: "btn danger", type: "button", text: "Sign out" });
    out.addEventListener("click", signOut);
    root.appendChild(el("div", { class: "row-actions" }, [out]));
  }

  // Only an admin is offered this, and only an admin is served it: every button
  // below is a route the server refuses to anyone else.
  async function renderPeople(root) {
    root.appendChild(el("p", { class: "sub", text: "Who can sign in to this hub. An admin can add apps and manage people; everyone else can use the assistant, arrange their home screen, and set up places and automations." }));

    const r = await api("GET", "/api/users");
    if (reauthed(r)) return;
    if (!r.ok) {
      root.appendChild(el("div", { class: "card" }, [el("p", { class: "err", text: "Could not read the accounts: " + errorText(r) })]));
      return;
    }
    const users = r.data.users || [];

    const list = el("div", { class: "card" });
    users.forEach(function (u) {
      const isYou = u.username === currentUser;
      const err = el("div", { class: "err" });
      const act = async function (method, path, body, confirmText) {
        if (confirmText && !window.confirm(confirmText)) return;
        err.textContent = "";
        const res = await api(method, path, body);
        if (!res.ok || (res.data && res.data.ok === false)) { err.textContent = errorText(res); return; }
        renderSettings();
      };
      const base = "/api/users/" + encodeURIComponent(u.username);

      const acts = el("div", { class: "acts" });
      if (!isYou) {
        const role = el("button", { class: "btn small", type: "button",
          text: u.role === "admin" ? "Make normal" : "Make admin" });
        role.addEventListener("click", function () {
          act("POST", base + "/role", { role: u.role === "admin" ? "user" : "admin" });
        });
        acts.appendChild(role);

        const onoff = el("button", { class: "btn small", type: "button", text: u.disabled ? "Let back in" : "Block" });
        onoff.addEventListener("click", function () { act("POST", base + "/enabled", { enabled: !!u.disabled }); });
        acts.appendChild(onoff);

        // The field is revealed in place rather than asked for with prompt(),
        // which would show the password in the clear in a browser dialog.
        const pwField = el("input", { type: "password", autocomplete: "new-password",
          placeholder: "new password, 8+ characters", hidden: true });
        const pwSet = el("button", { class: "btn small primary", type: "button", text: "Set", hidden: true });
        const reset = el("button", { class: "btn small", type: "button", text: "New password" });
        reset.addEventListener("click", function () {
          const showing = !pwField.hidden;
          pwField.hidden = pwSet.hidden = showing;
          if (!showing) pwField.focus();
        });
        pwSet.addEventListener("click", async function () {
          if (!pwField.value) { err.textContent = "Enter a password."; return; }
          await act("POST", base + "/password", { password: pwField.value });
        });
        acts.appendChild(reset);
        acts.appendChild(pwField);
        acts.appendChild(pwSet);

        const del = el("button", { class: "btn small danger", type: "button", text: "Remove" });
        del.addEventListener("click", function () {
          act("DELETE", base, undefined, "Remove the account " + u.username + "? They will not be able to sign in again.");
        });
        acts.appendChild(del);
      } else {
        acts.appendChild(el("span", { class: "meta", text: "this is you" }));
      }

      const tags = [el("span", { class: "tag" + (u.role === "admin" ? " admin" : ""), text: u.role === "admin" ? "Admin" : "Normal" })];
      if (u.disabled) tags.push(el("span", { class: "tag off", text: "Blocked" }));
      if (isYou) tags.push(el("span", { class: "tag you", text: "You" }));

      list.appendChild(el("div", { class: "person" }, [
        el("span", { class: "avatar", text: initials(u.display_name || u.username) }),
        el("span", { class: "grow" }, [
          el("div", { class: "n", text: u.display_name || u.username }),
          el("div", { class: "d", text: "@" + u.username }),
        ]),
      ].concat(tags, [acts])));
      list.appendChild(err);
    });
    root.appendChild(list);

    // ---- add someone ------------------------------------------------------
    const name = el("input", { type: "text", autocomplete: "off", placeholder: "ben" });
    const display = el("input", { type: "text", autocomplete: "off", placeholder: "Ben" });
    const pass = el("input", { type: "password", autocomplete: "new-password", placeholder: "8+ characters" });
    const admin = el("input", { type: "checkbox", "aria-label": "Make them an admin" });
    const err = el("div", { class: "err" });
    const save = el("button", { class: "btn primary", type: "submit", text: "Add them" });
    const form = el("form", null, [
      el("div", { class: "grid" }, [
        el("label", { class: "field" }, ["Username (lowercase)", name]),
        el("label", { class: "field" }, ["Name to show (optional)", display]),
        el("label", { class: "field full" }, ["A password to start with", pass]),
      ]),
      el("label", { class: "checkline" }, [admin, "Make them an admin (apps and people)"]),
      err,
      el("div", { class: "row-actions" }, [save]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      save.disabled = true;
      const res = await api("POST", "/api/users", {
        username: name.value.trim(),
        password: pass.value,
        display_name: display.value.trim() || null,
        role: admin.checked ? "admin" : "user",
      });
      save.disabled = false;
      if (!res.ok || !res.data.ok) { err.textContent = "Could not add them: " + errorText(res); return; }
      renderSettings();
    });
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: "Add someone" }),
      el("p", { class: "note", text: "Give them a password here, then let them change it under Your account." }),
      form,
    ]));
    root.appendChild(el("p", { class: "note", text: "Accounts can also be managed on the hub with `vahub user`, which is the way back in if nobody can sign in." }));
  }

  // ---- navigation -------------------------------------------------------
  // Two fixed places (Home, Chat) and then your apps, drawn as a rail beside
  // the content on a desk and as a bar under the thumb on a phone. The rail
  // collapses to icons; the bar cannot, so the phone gets an Apps screen and a
  // You screen instead of a sidebar it has no room for.
  const MAIN_VIEWS = [["home", "Home", "home"], ["thread", "Chat", "chat"]];
  const TABS = [
    ["home", "Home", "home"], ["thread", "Chat", "chat"],
    ["apps", "Apps", "grid"], ["settings", "You", "user"],
  ];
  let currentView = "home";
  let currentApp = null;      // which app's page, when currentView is "app"
  let canManageApps = false;  // what the server said the last time we asked
  const renderers = { home: renderHome, settings: renderSettings, apps: renderApps, app: renderApp };

  function isAdmin() { return !!(me && me.is_admin); }

  // Whether a rail entry is the one you are looking at. An app entry is only
  // active for its own app, which is why this is not a plain [data-view] sweep.
  function viewIsApps() { return currentView === "apps" || currentView === "app"; }

  function buildRail() {
    const rail = $("railnav");
    rail.textContent = "";
    MAIN_VIEWS.forEach(function (v) {
      rail.appendChild(el("button", {
        class: "navitem" + (currentView === v[0] ? " active" : ""),
        type: "button", title: v[1],
        onclick: function () { selectTab(v[0]); },
      }, [icon(v[2]), el("span", { class: "label", text: v[1] })]));
    });

    const group = el("div", { class: "railgroup" });
    const label = el("button", {
      class: "navitem", type: "button", title: "All apps",
      onclick: function () { selectTab("apps"); },
    }, [icon("grid"), el("span", { class: "label", text: "Apps" })]);
    label.classList.toggle("active", currentView === "apps");
    group.appendChild(label);

    const apps = moduleCache || [];
    apps.forEach(function (m) {
      group.appendChild(el("button", {
        class: "navitem" + (currentView === "app" && currentApp === m.name ? " active" : ""),
        type: "button", title: appName(m.name) + " — " + stateWord(m),
        onclick: function () { openApp(m.name); },
      }, [
        icon(iconName(m.name)),
        el("span", { class: "label", text: appName(m.name) }),
        el("span", { class: "statedot " + (m.state || ""), "aria-hidden": "true" }),
      ]));
    });
    if (!apps.length) {
      group.appendChild(el("p", { class: "railnote", text: isAdmin() ? "None yet — add one." : "None yet." }));
    }
    if (isAdmin()) {
      group.appendChild(el("button", {
        class: "navitem add", type: "button", title: "Add an app",
        onclick: function () { selectTab("apps"); },
      }, [icon("plus"), el("span", { class: "label", text: "Add an app" })]));
    }
    rail.appendChild(group);
  }

  function buildTabbar() {
    const bar = $("tabbar");
    bar.textContent = "";
    TABS.forEach(function (v) {
      const active = v[0] === "apps" ? viewIsApps() : currentView === v[0];
      bar.appendChild(el("button", {
        class: "tab" + (active ? " active" : ""), type: "button",
        onclick: function () { v[0] === "settings" ? openSettings(null) : selectTab(v[0]); },
      }, [icon(v[2], "i-lg"), el("span", { text: v[1] })]));
    });
  }

  // ---- the sidebar's width ----------------------------------------------
  // Kept in this browser rather than in the hub's settings: those settings are
  // shared by everyone with an account, and how wide you like your sidebar is
  // nobody else's business. It is also read before the first paint, so the rail
  // does not start wide and then jump.
  const RAIL_KEY = "vahub:rail";
  let railCollapsed = false;
  function readRail() {
    try { railCollapsed = window.localStorage.getItem(RAIL_KEY) === "collapsed"; }
    catch (e) { railCollapsed = false; }   // private window, or storage refused
  }
  function applyRail() {
    $("shell").dataset.rail = railCollapsed ? "collapsed" : "open";
    const btn = $("railToggle");
    const what = railCollapsed ? "Expand sidebar" : "Collapse sidebar";
    btn.setAttribute("aria-expanded", railCollapsed ? "false" : "true");
    btn.setAttribute("aria-label", what);
    btn.title = what;
  }
  function toggleRail() {
    railCollapsed = !railCollapsed;
    try { window.localStorage.setItem(RAIL_KEY, railCollapsed ? "collapsed" : "open"); }
    catch (e) { /* not remembering it is survivable */ }
    applyRail();
    if (menuOpen) closeMenu();
  }

  // ---- your name, and everything behind it ------------------------------
  let menuOpen = false;
  function personName() { return (me && me.display_name) || currentUser || "Signed in"; }
  function initials(name) {
    const parts = String(name || "").trim().split(/[\s._-]+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : "")).slice(0, 2);
  }
  function roleWord() {
    if (!me || me.auth === false) return "Operator";
    return isAdmin() ? "Admin" : "Signed in";
  }
  function buildAccount() {
    const btn = $("accountBtn");
    btn.textContent = "";
    btn.appendChild(el("span", { class: "avatar", text: initials(personName()) }));
    btn.appendChild(el("span", { class: "who", text: personName() }));
    btn.appendChild(icon(menuOpen ? "chevronDown" : "chevronUp", "i-sm"));
    btn.setAttribute("aria-expanded", menuOpen ? "true" : "false");
    btn.title = personName() + " — " + roleWord();
  }
  function closeMenu() { menuOpen = false; $("accountMenu").hidden = true; buildAccount(); }
  function openMenu() {
    menuOpen = true;
    const menu = $("accountMenu");
    menu.textContent = "";
    menu.hidden = false;
    menu.appendChild(el("div", { class: "menuhead" }, [
      el("span", { class: "n", text: personName() }),
      el("span", { class: "r", text: roleWord() }),
    ]));
    sections().forEach(function (sec) {
      const item = el("button", { class: "menuitem", type: "button", role: "menuitem" },
        [icon(sec[2], "i-sm"), el("span", { text: sec[1] })]);
      item.addEventListener("click", function () { closeMenu(); openSettings(sec[0]); });
      menu.appendChild(item);
    });
    if (me && me.auth !== false) {
      menu.appendChild(el("div", { class: "menusep" }));
      const out = el("button", { class: "menuitem leave", type: "button", role: "menuitem" },
        [icon("leave", "i-sm"), el("span", { text: "Sign out" })]);
      out.addEventListener("click", function () { closeMenu(); signOut(); });
      menu.appendChild(out);
    }
    buildAccount();
  }
  function toggleMenu() { menuOpen ? closeMenu() : openMenu(); }

  // Built once: the handlers and the icons that never change.
  let chromeBuilt = false;
  function buildChrome() {
    if (chromeBuilt) return;
    chromeBuilt = true;
    $("railToggle").appendChild(icon("sidebar"));
    $("railToggle").addEventListener("click", toggleRail);
    $("accountBtn").addEventListener("click", function (e) { e.stopPropagation(); toggleMenu(); });
    $("backBtn").appendChild(icon("chevronLeft"));
    $("backBtn").addEventListener("click", goBack);
    $("mic").appendChild(icon("mic"));
    $("send").appendChild(icon("send"));
    // A menu that only closes on its own items is a menu you fight with.
    document.addEventListener("click", function (e) {
      if (!menuOpen) return;
      const foot = $("accountMenu").parentNode;
      if (!foot.contains(e.target)) closeMenu();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && menuOpen) closeMenu();
    });
  }

  // The back arrow is the phone's way out of a section or an app page.
  function goBack() {
    if (currentView === "app") { selectTab("apps"); return; }
    settingsSection = null;
    renderSettings();
    syncChrome();
  }

  // The header title and the back arrow depend on where you are, so they are
  // set in one place rather than by whoever rendered last.
  function headerActions() {
    const box = $("headActions");
    box.textContent = "";
    if (currentView !== "home") return;
    box.appendChild(el("button", { class: "btn small", type: "button",
      onclick: function () { adderOpen = !adderOpen; renderHome(); headerActions(); } },
      [icon(adderOpen ? "x" : "plus", "i-sm"), adderOpen ? "Close" : "Add card"]));
  }
  function viewTitle() {
    if (currentView === "app") {
      const m = appByName(currentApp);
      return m ? appName(m.name) : "App";
    }
    if (currentView === "apps") return "Apps";
    if (currentView === "settings") {
      const section = settingsSection ? sectionDef(settingsSection) : null;
      return section ? section[1] : "You";
    }
    const view = MAIN_VIEWS.filter(function (v) { return v[0] === currentView; })[0];
    return view ? view[1] : "";
  }
  function syncChrome() {
    $("viewTitle").textContent = viewTitle();
    const deep = currentView === "app" || (currentView === "settings" && !!settingsSection);
    $("backBtn").dataset.show = deep ? "1" : "0";
    buildRail();
    buildTabbar();
    buildAccount();
    headerActions();
  }

  function selectTab(name) {
    currentView = name;
    if (menuOpen) closeMenu();
    document.querySelectorAll("main .panel").forEach(function (p) { p.classList.toggle("active", p.id === name); });
    $("composerBar").hidden = name !== "thread";
    if (name !== "home") stopClock();
    if (renderers[name]) renderers[name]();
    syncChrome();
    if (name === "thread") input.focus();
  }

  // ---- auth gate --------------------------------------------------------
  const gate = $("gate"), gateBody = $("gateBody");
  async function showApp(who) {
    signedOut = false;
    me = who || {};
    currentUser = me.username || null;
    dashCards = null; adderOpen = false; settingsSection = null;
    moduleCache = null; currentApp = null; canManageApps = false;
    resetConversation();
    gate.classList.remove("active");
    $("shell").hidden = false;
    buildChrome();
    applyRail();
    // Load the saved look, the preferences and the app list before painting, so
    // the first frame is already the right theme, the right starting page and a
    // sidebar with your apps in it.
    await loadDash();
    if (signedOut) return;
    await loadModules(true);
    if (signedOut) return;
    selectTab(prefs.startPage === "thread" ? "thread" : "home");
    startAssistant();
    connect();
  }
  function showGate() { $("shell").hidden = true; gate.classList.add("active"); }
  function dropToLogin() {
    if (signedOut) return;
    signedOut = true;
    if (socket) { try { socket.close(); } catch (e) { /* gone */ } socket = null; }
    resetConversation();
    renderLogin();
    showGate();
  }
  function renderSetup() {
    $("gateTitle").textContent = "Create your account";
    gateBody.textContent = "";
    gateBody.appendChild(el("p", { class: "note", text: "This hub has no account yet. Create the first one, it becomes the owner. Afterwards, more accounts are added on the host with vahub user add." }));
    const user = el("input", { type: "text", placeholder: "username", autocomplete: "username" });
    const pass = el("input", { type: "password", placeholder: "password (8+ characters)", autocomplete: "new-password" });
    const confirm = el("input", { type: "password", placeholder: "confirm password", autocomplete: "new-password" });
    const err = el("div", { class: "err" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Create account" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      el("label", { class: "field" }, ["confirm password", confirm]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      if (pass.value !== confirm.value) { err.textContent = "The passwords do not match."; return; }
      btn.disabled = true;
      const r = await api("POST", "/api/setup", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) { boot(); return; }
      if (r.status === 409) { renderLogin("An account already exists. Sign in instead."); return; }
      err.textContent = (r.data && r.data.detail) || "Could not create the account.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  function renderLogin(message) {
    $("gateTitle").textContent = "Sign in";
    gateBody.textContent = "";
    const user = el("input", { type: "text", placeholder: "username", autocomplete: "username" });
    const pass = el("input", { type: "password", placeholder: "password", autocomplete: "current-password" });
    const err = el("div", { class: "err", text: message || "" });
    const btn = el("button", { class: "btn primary", type: "submit", text: "Sign in" });
    const form = el("form", null, [
      el("label", { class: "field" }, ["username", user]),
      el("label", { class: "field" }, ["password", pass]),
      err,
      el("div", { class: "row-actions" }, [btn]),
    ]);
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      const r = await api("POST", "/api/login", { username: user.value, password: pass.value });
      btn.disabled = false;
      if (r.ok && r.data.ok) boot();
      else if (r.status === 429) err.textContent = "Too many attempts. Wait a few minutes.";
      else err.textContent = "Wrong username or password.";
    });
    gateBody.appendChild(form);
    user.focus();
  }
  async function signOut() {
    signedOut = true;
    if (socket) { try { socket.close(); } catch (e) { /* gone */ } socket = null; }
    // Wipe the screen before the round trip, not after: whoever is standing
    // there should not be able to read the last conversation while the request
    // is in flight, and a failed logout must not leave it on display either.
    resetConversation();
    me = {};
    currentUser = null;
    dashCards = null; moduleCache = null; currentApp = null;
    canManageApps = false; settingsSection = null;
    $("settings").textContent = ""; $("apps").textContent = ""; $("app").textContent = "";
    renderLogin();
    showGate();
    await api("POST", "/api/logout");
  }

  async function boot() {
    const r = await api("GET", "/api/me");
    if (!r.ok) { dropToLogin(); return; }
    const who = r.data || {};
    if (who.auth === false || who.authenticated) { showApp(who); return; }
    if (who.setup_required) renderSetup(); else renderLogin();
    showGate();
  }

  applyAccent(DEFAULT_ACCENT);
  readRail();
  applyRail();
  boot();
})();
</script>
</body>
</html>
